<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderneta</title>
<meta name="description" content="Suas finanças em ordem, sem complicação. Seus dados ficam só no seu celular.">
<meta name="theme-color" content="#1F3D2F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderneta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F4EEDC; --card:#FBF7E9; --ink:#1D2A22; --ink2:#46564B; --ink3:#5F6A5C; --rule:#D8CFAE; --rule2:#B9AE8A;
  --in:#1E3A8A; --in-bg:#E1E7F6; --out:#B3261E; --out-bg:#F6DEDA; --tr:#2C6B52; --tr-bg:#DDEBDD;
  --ouro:#8F6A10; --ouro-bg:#F3E8C6; --latao:#C99A1E; --capa:#1F3D2F; --capa-ink:#F4EEDC;
  --btn:#1F3D2F; --btn-ink:#F4EEDC; --sel:#E1EBD6; --margem:#C4574A; --shadow:0 2px 8px rgba(31,61,47,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --bg:#121C17; --card:#1B2A22; --ink:#EFE7CF; --ink2:#BDC6B1; --ink3:#97A190; --rule:#2C3D33; --rule2:#46594C;
    --in:#93ABF5; --in-bg:#1E2A4A; --out:#F29484; --out-bg:#3A211D; --tr:#86C9AA; --tr-bg:#1F3A2E;
    --ouro:#E2B945; --ouro-bg:#3A3118; --latao:#E2B945; --capa:#0D1612; --capa-ink:#EFE7CF;
    --btn:#E2B945; --btn-ink:#121C17; --sel:#26402F; --margem:#8A4A41; --shadow:none;
  }
}
:root[data-tema="escuro"]{
  --bg:#121C17; --card:#1B2A22; --ink:#EFE7CF; --ink2:#BDC6B1; --ink3:#97A190; --rule:#2C3D33; --rule2:#46594C;
  --in:#93ABF5; --in-bg:#1E2A4A; --out:#F29484; --out-bg:#3A211D; --tr:#86C9AA; --tr-bg:#1F3A2E;
  --ouro:#E2B945; --ouro-bg:#3A3118; --latao:#E2B945; --capa:#0D1612; --capa-ink:#EFE7CF;
  --btn:#E2B945; --btn-ink:#121C17; --sel:#26402F; --margem:#8A4A41; --shadow:none;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-tam="g"]{font-size:19px}
html[data-tam="gg"]{font-size:22px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;
  padding-bottom:calc(6.5rem + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:32rem;margin:0 auto;padding:0 1rem;position:relative;isolation:isolate}
.wrap:before{content:"";position:absolute;left:.5rem;top:0;bottom:0;width:1px;background:var(--margem);opacity:.45;z-index:-1}
#tela{padding-top:0}
.serif{font-family:Georgia,"Times New Roman",serif}
h1{font-size:1.5rem;font-weight:700;margin-bottom:.25rem;font-family:Georgia,serif}
h2{font-size:1.05rem;font-weight:700;margin:1.5rem 0 .55rem;font-family:Georgia,serif;letter-spacing:.01em;padding-bottom:.25rem;border-bottom:1px solid var(--rule2)}
.sub{color:var(--ink2);font-size:.95rem}
.faint{color:var(--ink3);font-size:.88rem}

/* capa de livro */
.capa{margin:0 -1rem;background:var(--capa);color:var(--capa-ink);padding:.7rem 1rem .75rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:3px solid var(--latao)}
.capa span{font-size:.82rem;opacity:.85}
.capa h1{font-family:Georgia,serif;font-size:1.25rem;font-weight:400;letter-spacing:.02em}
.lead{margin:.9rem 0 0}

/* cartões e papel */
.card{background:var(--card);border:1px solid var(--rule);border-radius:.8rem;padding:1rem;box-shadow:var(--shadow)}
.hero{text-align:center;padding:.4rem 0 0;margin-top:.6rem}
.hero .rot{color:var(--ouro);font-weight:700;font-size:.95rem;letter-spacing:.03em}
.hero .grande{font-family:Georgia,serif;font-size:2.7rem;font-weight:700;color:var(--ouro);line-height:1.1;margin:.1rem 0;word-break:break-word}
.hero .grande.neg{color:var(--out)}
.hero .eq{font-size:.88rem;color:var(--ink2)}
.bal{width:100%;max-width:18rem;height:auto;display:block;margin:.2rem auto 0}
.bal .linha{stroke:var(--ink)}
.beam{transform-origin:140px 30px}.pA{transform-origin:50px 30px}.pB{transform-origin:230px 30px}
.wob .beam{animation:bw 2.4s ease-out}.wob .pA,.wob .pB{animation:pa 2.4s ease-out}
@keyframes bw{0%{transform:rotate(-7deg)}25%{transform:rotate(5deg)}50%{transform:rotate(-2.5deg)}75%{transform:rotate(1deg)}100%{transform:rotate(0)}}
@keyframes pa{0%{transform:rotate(7deg)}25%{transform:rotate(-5deg)}50%{transform:rotate(2.5deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
.tri{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:3px double var(--ink);margin:.9rem 0 .3rem}
.tri div{padding:.55rem .25rem;text-align:center;border-left:1px solid var(--rule2)}
.tri div:first-child{border-left:0}
.tri span{display:block;font-size:.8rem;color:var(--ink2)}
.tri b{display:block;font-family:Georgia,serif;font-weight:400;font-size:1.02rem;margin-top:.1rem;word-break:break-word}
.tri .e b{color:var(--in)} .tri .s b{color:var(--out)}

.alerta{display:flex;gap:.7rem;align-items:center;width:100%;border-radius:.6rem;padding:.8rem .9rem;margin-top:.6rem;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--latao)}
.alerta.ruim{border-left-color:var(--out);background:var(--out-bg)}
.alerta b{display:block}
.alerta span{font-size:.9rem;color:var(--ink2)}

/* linhas do livro */
.lista{display:flex;flex-direction:column}
.lanc{display:flex;align-items:center;gap:.6rem;width:100%;padding:.7rem .1rem;border-bottom:1px solid var(--rule);min-height:3.5rem}
.lanc:last-child{border-bottom:0}
.dia{width:2.6rem;text-align:center;flex:none}
.dia b{display:block;font-size:1.15rem;font-family:Georgia,serif;font-weight:400;line-height:1}
.dia i{font-style:normal;font-size:.72rem;color:var(--ink3);text-transform:uppercase}
.txt{min-width:0;flex:0 1 auto;max-width:62%}
.txt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt i{font-style:normal;font-size:.84rem;color:var(--ink2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pont{flex:1;min-width:.6rem;border-bottom:2px dotted var(--rule2);align-self:flex-end;margin-bottom:.9rem}
.vl{font-weight:700;white-space:nowrap;font-family:Georgia,serif}
.vl.in{color:var(--in)} .vl.out{color:var(--out)} .vl.tr{color:var(--tr)}
.vazio{text-align:center;color:var(--ink2);padding:1.4rem .5rem}
.vazio b{display:block;color:var(--ink);margin-bottom:.2rem}
.novo-lin{animation:rin .55s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* botões */
.btn{display:block;width:100%;min-height:3.25rem;border-radius:.7rem;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:1.05rem;text-align:center;padding:.8rem 1rem;margin-top:.7rem;letter-spacing:.01em}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--rule2)}
.btn.perigo{background:var(--out-bg);color:var(--out)}
.btn.peq{display:inline-block;width:auto;min-height:2.75rem;padding:.5rem 1rem;font-size:.95rem;margin-top:.5rem}
.link{color:var(--in);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:2.75rem;padding:.5rem 0;display:inline-block}

/* navegação: capa verde com latão */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--capa);border-top:3px solid var(--latao);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .in{max-width:32rem;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;align-items:end}
nav button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0 .5rem;font-size:.76rem;color:var(--capa-ink);opacity:.78;min-height:3.6rem;text-align:center}
nav button[aria-current="page"]{opacity:1;font-weight:700;color:var(--latao)}
nav svg{width:1.6rem;height:1.6rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .fab{align-items:center;opacity:1}
nav .fab span.b{display:grid;place-items:center;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--latao);color:#1F3D2F;margin-top:-1.5rem;border:3px solid var(--capa);box-shadow:0 4px 12px rgba(0,0,0,.35);font-size:2rem;line-height:1;font-weight:400;transition:transform .15s}
nav .fab:active span.b{transform:scale(.92)}
nav .fab em{font-style:normal;font-weight:700;color:var(--capa-ink)}

/* folha (anotar) */
.folha{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none;padding-bottom:3rem}
.folha.on{display:block;animation:abre .22s ease-out}
@keyframes abre{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.folha .wrap{padding-top:0}
.acoes{position:sticky;bottom:0;margin:0 -1rem;padding:1.2rem 1rem calc(.8rem + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.acoes .btn{margin-top:0}
.volta{min-height:2.75rem;min-width:2.75rem;display:grid;place-items:center;font-size:1.5rem;color:var(--capa-ink);margin-left:-.6rem}
.capa.f{align-items:center;justify-content:flex-start}
.capa.f h1{flex:1}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.9rem}
.seg3 button{min-height:3.4rem;border-radius:.7rem;border:2px solid var(--rule2);background:var(--card);text-align:center;font-weight:700;font-size:.95rem;padding:.4rem .2rem}
.seg3 button[aria-pressed="true"].s{background:var(--out-bg);border-color:var(--out);color:var(--out)}
.seg3 button[aria-pressed="true"].e{background:var(--in-bg);border-color:var(--in);color:var(--in)}
.seg3 button[aria-pressed="true"].t{background:var(--tr-bg);border-color:var(--tr);color:var(--tr)}
.rot{display:block;font-weight:700;margin:1.1rem 0 .4rem}
.dinheiro{width:100%;font-family:Georgia,serif;font-size:2.4rem;font-weight:700;border:0;border-bottom:3px double var(--ink);background:transparent;padding:.2rem 0;text-align:center;border-radius:0}
.dinheiro.s{color:var(--out)} .dinheiro.e{color:var(--in)} .dinheiro.t{color:var(--tr)}
.dinheiro::placeholder{color:var(--ink3);opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{min-height:2.9rem;padding:.55rem .95rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.novo{border-style:dashed;color:var(--in)}
.campo{margin-top:.9rem}
.campo label{display:block;font-weight:700;margin-bottom:.35rem}
.campo input,.campo select{width:100%;min-height:3.1rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.5rem .8rem;background:var(--card)}
.passo{display:flex;align-items:center;gap:1rem}
.passo button{width:3rem;height:3rem;border-radius:50%;border:2px solid var(--rule2);background:var(--card);font-size:1.5rem;text-align:center;font-weight:700}
.passo b{font-size:1.2rem;min-width:5rem;text-align:center}
.prev{background:var(--card);border:1px dashed var(--ink3);border-radius:.6rem;padding:.8rem .9rem;margin-top:1.1rem;font-size:.95rem;color:var(--ink2)}
.prev b{color:var(--ink)}
.prev .parc{display:flex;justify-content:space-between;padding:.15rem 0;font-variant-numeric:tabular-nums}

/* conta em T: de onde saiu | para onde foi */
.tt{position:relative;margin-top:1rem}
.th{display:grid;grid-template-columns:1fr 1fr;font-size:.72rem;letter-spacing:.07em;font-weight:700;color:var(--ink2);border-bottom:3px double var(--ink);padding-bottom:.35rem;text-align:center;text-transform:uppercase}
.tc{display:grid;grid-template-columns:1fr 1fr;position:relative}
.tc>div{display:flex;flex-direction:column;gap:.5rem;padding:.7rem .4rem}
.tc>div:first-child{border-right:1px solid var(--ink)}
.colrot{display:none;font-size:.75rem;letter-spacing:.07em;font-weight:700;color:var(--ink2);text-transform:uppercase}
.opt{display:block;width:100%;min-height:3.1rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.5rem .6rem;background:var(--card);font-weight:600;font-size:.95rem;line-height:1.25;position:relative;z-index:1}
.opt small{display:block;font-weight:400;color:var(--ink3);font-size:.78rem}
.opt[aria-pressed="true"]{border-color:var(--capa);background:var(--sel);box-shadow:inset 0 0 0 1px var(--capa)}
.opt.novo{border-style:dashed;color:var(--in);background:transparent}
.lnk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.lnk path{stroke:var(--latao);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:var(--L,0);stroke-dashoffset:var(--L,0);animation:dr .55s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.moeda{position:absolute;left:0;top:0;margin:-.4rem 0 0 -.4rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--latao);border:2px solid #7a5c14;pointer-events:none;z-index:2}
html[data-tam="gg"] .th{display:none}
html[data-tam="gg"] .colrot{display:block}
html[data-tam="gg"] .tc{grid-template-columns:1fr}
html[data-tam="gg"] .tc>div:first-child{border-right:0;border-bottom:1px solid var(--ink)}
html[data-tam="gg"] .lnk{display:none}

/* carimbo */
.carimbo{position:fixed;left:50%;top:45%;z-index:90;border:4px solid var(--out);color:var(--out);padding:.35rem 1.1rem;font-family:Georgia,serif;letter-spacing:.14em;font-size:1.7rem;font-weight:700;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);background:rgba(244,238,220,.82);border-radius:.3rem}
.carimbo.on{animation:car 1.1s ease-out}
@keyframes car{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.3)}20%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}

/* gavetas */
.gaveta{display:flex;align-items:center;gap:.75rem;width:100%;padding:.8rem 0;border-bottom:1px solid var(--rule);min-height:3.6rem}
.gaveta:last-child{border-bottom:0}
.marca{width:.65rem;height:2.4rem;border-radius:.2rem;background:var(--in);flex:none}
.marca.pas{background:var(--out)}
.gaveta .vl{font-size:1.02rem}
.cartao{background:var(--card);border:1px solid var(--rule);border-radius:.8rem;padding:1rem;margin-bottom:.7rem;box-shadow:var(--shadow)}
.cartao .t{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.cartao .t b{font-size:1.05rem;font-family:Georgia,serif}
.barra-lim{height:.7rem;background:var(--rule);border-radius:.2rem;overflow:hidden;margin:.6rem 0 .3rem}
.barra-lim div{height:100%;background:var(--tr);transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.barra-lim div.alto{background:var(--out)}
.linhas3{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink2)}
.linhas3 b{display:block;color:var(--ink);font-size:.98rem;font-family:Georgia,serif}

/* relatórios */
.mes{display:flex;align-items:center;justify-content:space-between;margin:.9rem 0 .5rem}
.mes button{min-width:3rem;min-height:3rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);font-size:1.3rem;text-align:center}
.mes b{font-size:1.15rem;font-family:Georgia,serif;font-weight:400}
.mes b::first-letter{text-transform:uppercase}
.vira-d{animation:vd .38s ease-out}.vira-e{animation:ve .38s ease-out}
@keyframes vd{from{opacity:0;transform:translateX(26px) rotateY(-12deg)}to{opacity:1;transform:none}}
@keyframes ve{from{opacity:0;transform:translateX(-26px) rotateY(12deg)}to{opacity:1;transform:none}}
.barra{margin:.7rem 0}
.barra .top{display:flex;justify-content:space-between;gap:.5rem;font-size:.95rem}
.trilho{height:.6rem;background:var(--rule);border-radius:.15rem;margin-top:.3rem;overflow:hidden}
.trilho div{height:100%;transition:width .8s cubic-bezier(.3,1.2,.5,1);animation:enche .9s ease-out}
@keyframes enche{from{width:0!important}}
.barra.s .trilho div{background:var(--out)} .barra.e .trilho div{background:var(--in)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.45rem .2rem;border-bottom:1px solid var(--rule)}
th{text-align:left;color:var(--ink2);font-weight:600;font-size:.8rem}
td:nth-child(n+2),th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
.confere{margin-top:.7rem;padding:.6rem .8rem;border-radius:.5rem;background:var(--in-bg);color:var(--in);font-weight:600;font-size:.92rem}
.confere.erro{background:var(--out-bg);color:var(--out)}
svg.grafico{width:100%;height:auto;display:block}

/* ajustes */
.opc{display:flex;gap:.45rem}
.opc button{flex:1;min-height:3rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);text-align:center;font-weight:700}
.opc button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.linha-sw{display:flex;align-items:center;gap:1rem;justify-content:space-between;min-height:3.2rem}
.sw{position:relative;width:3.4rem;height:2rem;border-radius:2rem;background:var(--rule2);flex:none;border:0}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-pressed="true"]{background:var(--tr)}
.sw[aria-pressed="true"]::after{left:1.6rem}
.item{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:3.2rem;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item small{color:var(--ink3)}
.linha-f{display:grid;grid-template-columns:1.3fr 1fr 3rem;gap:.4rem;margin-bottom:.45rem;align-items:center}
.linha-f input{width:100%;min-height:3.1rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.4rem .6rem;background:var(--card)}
.linha-f .x{min-height:3rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);font-size:1.3rem;text-align:center}

/* modal, toast, primeiros passos */
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal-fundo.on{display:flex}
.modal{background:var(--bg);width:100%;max-width:32rem;border-radius:1rem 1rem 0 0;padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;border-top:3px solid var(--latao);animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal p.q{font-size:1.1rem;font-weight:700;margin-bottom:.5rem;font-family:Georgia,serif}
.toast{position:fixed;left:50%;bottom:calc(5.7rem + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--capa);color:var(--capa-ink);padding:.75rem 1.1rem;border-radius:.6rem;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center;border:1px solid var(--latao)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.onb{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;display:none;padding-bottom:3rem}
.onb.on{display:block}
.fino{height:.35rem;background:var(--rule);border-radius:.2rem;margin:1rem 0;overflow:hidden}
.fino div{height:100%;background:var(--latao);transition:width .4s}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
html.calmo *,html.calmo *:before{animation:none!important;transition:none!important}
</style>
</head>
<body>
<noscript><p style="padding:2rem">Este app precisa de JavaScript para funcionar.</p></noscript>
<main id="tela" class="wrap" aria-live="polite"></main>

<div class="carimbo" id="carimbo" aria-hidden="true">LANÇADO</div>

<script>
(function(){
"use strict";

/* =====================================================================
   CADERNETA — finanças pessoais com partida dobrada por trás.
   Todos os valores em CENTAVOS (inteiros) para nunca errar contas.
   ===================================================================== */

/* ---------- utilidades ---------- */
var KEY="caderneta:v2";
var RE_ID=/^[A-Za-z0-9_-]+$/, RE_DATA=/^\d{4}-\d{2}-\d{2}$/;
var MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ehObj(x){return !!x&&typeof x==="object"&&!Array.isArray(x)}
function $(s){return document.querySelector(s)}

function num(c){return (Math.abs(c)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function brl(c){return (c<0?"−":"")+"R$ "+num(c)}
function pad(n){return String(n).padStart(2,"0")}
function isoDe(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hojeISO(){return isoDe(new Date())}
function dataBR(iso){return iso.split("-").reverse().join("/")}
function ultimoDia(ano,mes0){return new Date(ano,mes0+1,0).getDate()}

/* soma n meses mantendo o dia, limitado ao último dia do mês (31/jan+1 = 28/fev) */
function addMes(iso,n){
  var p=iso.split("-").map(Number), t=p[1]-1+n;
  var ano=p[0]+Math.floor(t/12), mes=((t%12)+12)%12;
  return ano+"-"+pad(mes+1)+"-"+pad(Math.min(p[2],ultimoDia(ano,mes)));
}
function addDias(iso,n){var p=iso.split("-").map(Number);return isoDe(new Date(p[0],p[1]-1,p[2]+n))}
function diasAte(iso){
  var a=hojeISO().split("-").map(Number), b=iso.split("-").map(Number);
  return Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/864e5);
}

/* divide em n parcelas em centavos; a sobra fica na última (soma sempre fecha) */
function dividir(total,n){
  var base=Math.floor(total/n), arr=[], i;
  for(i=0;i<n-1;i++)arr.push(base);
  arr.push(total-base*(n-1));
  return arr;
}

/* ---------- ciclo do cartão ---------- */
function proximoFechamento(compra,fecha){
  var p=compra.split("-").map(Number), ano=p[0], mes=p[1]-1, dia=p[2];
  var fe=Math.min(fecha,ultimoDia(ano,mes));
  if(dia<=fe)return ano+"-"+pad(mes+1)+"-"+pad(fe);
  mes++; if(mes>11){mes=0;ano++}
  return ano+"-"+pad(mes+1)+"-"+pad(Math.min(fecha,ultimoDia(ano,mes)));
}
function primeiroVencimento(compra,fecha,vence){
  var f=proximoFechamento(compra,fecha).split("-").map(Number);
  var ano=f[0], mes=f[1]-1+(vence>fecha?0:1);
  if(mes>11){mes=0;ano++}
  return ano+"-"+pad(mes+1)+"-"+pad(Math.min(vence,ultimoDia(ano,mes)));
}

/* ---------- dados ---------- */
var S={contas:[],categorias:[],lancamentos:[],
  config:{tamanho:"m",tema:"auto",contador:false,ultimoBackup:null,pronto:false,movimento:"vivo"}};

/* valida qualquer dado vindo do armazenamento ou de um backup */
function higienizar(p){
  var out={contas:[],categorias:[],lancamentos:[],perdidos:0};
  function id(x){return typeof x==="string"&&RE_ID.test(x)}
  function cent(x){var n=Math.round(Number(x));return isFinite(n)?n:NaN}
  (Array.isArray(p.contas)?p.contas:[]).forEach(function(c){
    if(!ehObj(c)||!id(c.id)||typeof c.nome!=="string"||(c.tipo!=="ativo"&&c.tipo!=="passivo")){out.perdidos++;return}
    var n={id:c.id,nome:c.nome,tipo:c.tipo,inicial:cent(c.inicial)||0};
    ["fecha","vence"].forEach(function(k){var d=parseInt(c[k],10);if(d>=1&&d<=31)n[k]=d});
    if(cent(c.limite)>0)n.limite=cent(c.limite);
    if(c.tipo==="passivo"&&Array.isArray(c.abertas)){
      var ab=c.abertas.filter(function(a){return ehObj(a)&&cent(a.valor)>0&&(a.data==null||(typeof a.data==="string"&&RE_DATA.test(a.data)))})
        .map(function(a){return {data:a.data||null,valor:cent(a.valor)}});
      if(ab.length){n.abertas=ab; n.inicial=ab.reduce(function(s,a){return s+a.valor},0)}
    }
    out.contas.push(n);
  });
  (Array.isArray(p.categorias)?p.categorias:[]).forEach(function(c){
    if(!ehObj(c)||!id(c.id)||typeof c.nome!=="string"||(c.tipo!=="despesa"&&c.tipo!=="receita")){out.perdidos++;return}
    out.categorias.push({id:c.id,nome:c.nome,tipo:c.tipo});
  });
  (Array.isArray(p.lancamentos)?p.lancamentos:[]).forEach(function(l){
    var val=ehObj(l)?cent(l.valor):NaN;
    if(!ehObj(l)||!id(l.id)||["saida","entrada","transferencia"].indexOf(l.tipo)<0||!isFinite(val)||val<=0||
       typeof l.data!=="string"||!RE_DATA.test(l.data)){out.perdidos++;return}
    var n={id:l.id,tipo:l.tipo,valor:val,desc:typeof l.desc==="string"?l.desc:"",
      contaId:id(l.contaId)?l.contaId:null,destinoId:id(l.destinoId)?l.destinoId:null,
      catId:id(l.catId)?l.catId:null,data:l.data};
    if(Array.isArray(l.parcelas)&&l.parcelas.length){
      var ps=l.parcelas.filter(function(q){return ehObj(q)&&typeof q.data==="string"&&RE_DATA.test(q.data)&&isFinite(cent(q.valor))})
        .map(function(q){return {data:q.data,valor:cent(q.valor)}});
      if(ps.length===l.parcelas.length)n.parcelas=ps;
    }
    out.lancamentos.push(n);
  });
  return out;
}
function higienizarConfig(c){
  var d=S.config;
  if(!ehObj(c))return d;
  return {
    tamanho:["m","g","gg"].indexOf(c.tamanho)>=0?c.tamanho:"m",
    tema:["auto","claro","escuro"].indexOf(c.tema)>=0?c.tema:"auto",
    contador:c.contador===true,
    ultimoBackup:typeof c.ultimoBackup==="string"&&RE_DATA.test(c.ultimoBackup)?c.ultimoBackup:null,
    pronto:c.pronto===true,
    movimento:c.movimento==="parado"?"parado":"vivo"
  };
}

function carregar(){
  var raw=lsGet(KEY);
  if(!raw)return;
  try{
    var p=JSON.parse(raw);
    if(!ehObj(p))throw new Error("formato");
    var h=higienizar(p);
    S.contas=h.contas;S.categorias=h.categorias;S.lancamentos=h.lancamentos;
    S.config=higienizarConfig(p.config);
    if(h.perdidos){
      lsSet(KEY+":corrompido",raw);
      setTimeout(function(){toast(h.perdidos+" item(ns) com problema foram ignorados. Guardei uma cópia do original.")},400);
    }
  }catch(e){
    lsSet(KEY+":corrompido",raw);   /* nunca sobrescreve dados ilegíveis sem guardar o original */
    setTimeout(function(){toast("Seus dados estavam ilegíveis. Guardei uma cópia e comecei do zero.")},400);
  }
}
function salvar(){
  if(!lsSet(KEY,JSON.stringify(S)))toast("Não consegui salvar neste navegador");
}

function conta(id){for(var i=0;i<S.contas.length;i++)if(S.contas[i].id===id)return S.contas[i];return null}
function cat(id){for(var i=0;i<S.categorias.length;i++)if(S.categorias[i].id===id)return S.categorias[i];return null}
function nomeConta(id){var c=conta(id);return c?c.nome:"(gaveta apagada)"}
function nomeCat(id){var c=cat(id);return c?c.nome:"Sem categoria"}

/* ---------- vocabulário: comum x contador ---------- */
var VOC={
  simples:{pl:"É meu de verdade",ativo:"O que eu tenho",passivo:"O que eu devo",entrou:"Entrou",saiu:"Saiu",sobrou:"Sobrou",
           resultado:"Resultado do mês",evo:"Como o que é meu andou"},
  contador:{pl:"Patrimônio líquido",ativo:"Ativo",passivo:"Passivo",entrou:"Receitas",saiu:"Despesas",sobrou:"Resultado",
           resultado:"DRE do mês",evo:"Evolução do patrimônio líquido"}
};
function v(k){return VOC[S.config.contador?"contador":"simples"][k]}

/* =====================================================================
   MOTOR DE PARTIDA DOBRADA
   Toda moeda tem duas faces: de onde saiu e para onde foi.
   gasto        : D categoria (despesa) / C gaveta que pagou
   ganho        : D gaveta que recebeu  / C categoria (receita)
   mudar lugar  : D gaveta destino      / C gaveta de origem
   Ativo cresce a débito; passivo cresce a crédito. PL = ativo − passivo.
   ===================================================================== */
function partidas(l){
  if(l.tipo==="saida")return [{k:"cat",id:l.catId,lado:"D"},{k:"conta",id:l.contaId,lado:"C"}];
  if(l.tipo==="entrada")return [{k:"conta",id:l.contaId,lado:"D"},{k:"cat",id:l.catId,lado:"C"}];
  return [{k:"conta",id:l.destinoId,lado:"D"},{k:"conta",id:l.contaId,lado:"C"}];
}
function saldoConta(c,ate){
  var s=c.inicial||0;
  S.lancamentos.forEach(function(l){
    if(ate&&l.data>ate)return;
    var d=0;
    if(l.tipo==="saida"&&l.contaId===c.id)d=-l.valor;
    else if(l.tipo==="entrada"&&l.contaId===c.id)d=l.valor;
    else if(l.tipo==="transferencia"){
      if(l.destinoId===c.id)d=l.valor; else if(l.contaId===c.id)d=-l.valor;
    }
    s+= c.tipo==="ativo"? d : -d;   /* no passivo, pagar reduz a dívida */
  });
  return s;
}
function totais(ate){
  var a=0,p=0;
  S.contas.forEach(function(c){var s=saldoConta(c,ate); if(c.tipo==="ativo")a+=s; else p+=s});
  return {ativo:a,passivo:p,pl:a-p};
}
function resumoMes(ym){
  var r={ent:0,sai:0,porEnt:{},porSai:{},lanc:[]};
  S.lancamentos.forEach(function(l){
    if(l.data.slice(0,7)!==ym)return;
    r.lanc.push(l);
    if(l.tipo==="entrada"){r.ent+=l.valor;r.porEnt[l.catId]=(r.porEnt[l.catId]||0)+l.valor}
    else if(l.tipo==="saida"){r.sai+=l.valor;r.porSai[l.catId]=(r.porSai[l.catId]||0)+l.valor}
  });
  r.lanc.sort(ordemRecente);
  return r;
}
function ordemRecente(a,b){return a.data<b.data?1:a.data>b.data?-1:(a.id<b.id?1:-1)}

/* o que ainda falta pagar numa gaveta de dívida (cartão, empréstimo...).
   Pagamentos (mudar de lugar para a dívida) quitam os itens mais antigos primeiro. */
function itensDevidos(c){
  var it=[];
  if(c.abertas&&c.abertas.length)
    c.abertas.forEach(function(a){it.push({data:a.data,valor:a.valor,desc:"Dívida de antes de usar o app",n:1,de:1})});
  else if(c.inicial>0)it.push({data:null,valor:c.inicial,desc:"Dívida de antes de usar o app",n:1,de:1});
  S.lancamentos.forEach(function(l){
    if(l.tipo!=="saida"||l.contaId!==c.id)return;
    var base=l.desc||nomeCat(l.catId);
    if(l.parcelas&&l.parcelas.length)
      l.parcelas.forEach(function(p,i){it.push({data:p.data,valor:p.valor,desc:base,n:i+1,de:l.parcelas.length})});
    else it.push({data:l.data,valor:l.valor,desc:base,n:1,de:1});
  });
  it.sort(function(a,b){return (a.data||"")<(b.data||"")?-1:(a.data||"")>(b.data||"")?1:0});
  var pago=0;
  S.lancamentos.forEach(function(l){
    if(l.tipo==="transferencia"){ if(l.destinoId===c.id)pago+=l.valor; if(l.contaId===c.id)pago-=l.valor }
    else if(l.tipo==="entrada"&&l.contaId===c.id)pago+=l.valor;   /* estorno */
  });
  var out=[];
  it.forEach(function(x){
    if(pago>=x.valor){pago-=x.valor;return}
    out.push({data:x.data,valor:x.valor-pago,desc:x.desc,n:x.n,de:x.de}); pago=0;
  });
  return out;
}
/* contas a pagar: itens em aberto agrupados por gaveta e data de vencimento */
function aPagar(){
  var out=[];
  S.contas.filter(function(c){return c.tipo==="passivo"}).forEach(function(c){
    var g={};
    itensDevidos(c).forEach(function(x){
      var k=x.data||"sem";
      if(!g[k])g[k]={conta:c,data:x.data,valor:0,itens:[]};
      g[k].valor+=x.valor; g[k].itens.push(x);
    });
    Object.keys(g).forEach(function(k){out.push(g[k])});
  });
  return out.sort(function(a,b){return (a.data||"")<(b.data||"")?-1:(a.data||"")>(b.data||"")?1:0});
}

/* ---------- toast e modal ---------- */
var tmr;
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(tmr);tmr=setTimeout(function(){el.classList.remove("on")},2600)}
var MOK=null;
function abrirModal(html){$("#modal").innerHTML=html;$("#modalFundo").classList.add("on")}
function fecharModal(){$("#modalFundo").classList.remove("on");MOK=null}
function confirmar(texto,rotulo,acao){
  MOK=acao;
  abrirModal('<p class="q">'+esc(texto)+'</p>'+
    '<button class="btn perigo" data-a="mOk">'+esc(rotulo)+'</button>'+
    '<button class="btn sec" data-a="mFechar">Cancelar</button>');
}
$("#modalFundo").addEventListener("click",function(e){if(e.target===this)fecharModal()});

/* máscara de dinheiro: o usuário digita só números e o app põe vírgula */
function ligarDinheiro(el,inicial,aoMudar){
  el.dataset.cent=inicial||0;
  el.value=inicial?num(inicial):"";
  el.addEventListener("input",function(){
    var d=el.value.replace(/\D/g,"").slice(0,11), c=d?parseInt(d,10):0;
    el.dataset.cent=c; el.value=c?num(c):"";
    if(aoMudar)aoMudar(c);
  });
}
function cent(el){return parseInt(el.dataset.cent,10)||0}

/* =====================================================================
   NAVEGAÇÃO
   ===================================================================== */
var VIEW="inicio", REF=new Date(); REF.setDate(1);

function ir(vw){
  VIEW=vw;
  $("#tela").classList.remove("vira-d","vira-e");
  document.querySelectorAll("nav button[data-v]").forEach(function(b){
    if(b.dataset.v===vw)b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  desenhar();
  window.scrollTo(0,0);
}
function desenhar(){
  var t=$("#tela");
  t.innerHTML = VIEW==="inicio"?telaInicio():VIEW==="contas"?telaContas():VIEW==="relatorios"?telaRel():telaAjustes();
  ULTIMO=null;
  if(VIEW==="inicio")animarInicio();
}

/* ---------- visual vivo: capa, balança, números que rolam, carimbo ---------- */
var ULTIMO=null, WOB=false, ULT={};
function calmo(){return document.documentElement.classList.contains("calmo")}
function capa(esq,tit){return '<header class="capa"><span>'+esc(esq)+'</span><h1>'+esc(tit)+'</h1></header>'}
function balanca(){
  var a=S.config.contador?"Ativo":"Tenho", b=S.config.contador?"Passivo + PL":"Devo + meu";
  var pan=function(cls,cx,fill,txt){
    return '<g class="'+cls+'"><path d="M'+cx+' 30L'+(cx-28)+' 64M'+cx+' 30L'+(cx+28)+' 64" style="stroke:var(--ink)" stroke-width="1.2" fill="none"/>'+
      '<path d="M'+(cx-32)+' 64H'+(cx+32)+'Q'+(cx+32)+' 83 '+cx+' 83Q'+(cx-32)+' 83 '+(cx-32)+' 64Z" style="fill:'+fill+';stroke:var(--ink)" stroke-width="2"/>'+
      '<text x="'+cx+'" y="77" text-anchor="middle" font-size="8.5" style="fill:var(--ink)">'+esc(txt)+'</text></g>';
  };
  return '<svg class="bal" id="bal" viewBox="0 0 280 118" role="img" aria-label="Balança em equilíbrio: o que você tem é igual ao que você deve mais o que é seu">'+
    '<path d="M140 30V104M108 106H172" style="stroke:var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/>'+
    '<circle cx="140" cy="30" r="5" style="fill:var(--latao)"/>'+
    '<g class="beam"><path d="M50 30H230" style="stroke:var(--ink)" stroke-width="3" stroke-linecap="round"/>'+
    pan("pA",50,"var(--sel)",a)+pan("pB",230,"var(--ouro-bg)",b)+'</g></svg>';
}
function fmtRoll(k,c){
  if(k==="pl")return brl(c);
  if(k==="ent")return "+"+num(c);
  if(k==="sai")return "−"+num(c);
  return (c<0?"−":"")+num(c);
}
function rolarNum(el,k,de,para){
  if(!window.requestAnimationFrame){el.textContent=fmtRoll(k,para);return}
  el.textContent=fmtRoll(k,de);
  var t0=null;
  function p(t){
    if(!t0)t0=t;
    var x=Math.min(1,(t-t0)/800), e=1-Math.pow(1-x,3);
    el.textContent=fmtRoll(k,Math.round(de+(para-de)*e));
    if(x<1&&el.isConnected)requestAnimationFrame(p);
  }
  requestAnimationFrame(p);
}
function animarInicio(){
  document.querySelectorAll("[data-roll]").forEach(function(el){
    var k=el.dataset.k, para=+el.dataset.roll, de=ULT[k]==null?0:ULT[k];
    ULT[k]=para;
    if(calmo()||de===para)return;
    rolarNum(el,k,de,para);
  });
  if(WOB){
    WOB=false; var b=$("#bal");
    if(b&&!calmo()){b.classList.remove("wob");void b.getBoundingClientRect();b.classList.add("wob")}
  }
}
function carimbo(txt){
  var c=$("#carimbo"); if(calmo())return;
  c.textContent=txt; c.classList.remove("on"); void c.offsetWidth; c.classList.add("on");
  try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}
}
function moedaFio(){
  var p=$("#lp"), tt=$("#tt"); if(!p||!tt||!p.getAttribute("d"))return;
  var L=0; try{L=p.getTotalLength()}catch(e){}
  if(!L)return;
  var m=document.createElement("div"); m.className="moeda"; tt.appendChild(m);
  if(!m.animate){m.remove();return}
  var a=p.getPointAtLength(0), b=p.getPointAtLength(L);
  m.animate([{transform:"translate("+a.x+"px,"+a.y+"px)"},{transform:"translate("+b.x+"px,"+b.y+"px)"}],{duration:650,easing:"ease-in-out"}).onfinish=function(){m.remove()};
}

/* ---------- linhas de lançamento ---------- */
function linha(l){
  var p=l.data.split("-"), cls=l.tipo==="entrada"?"in":l.tipo==="saida"?"out":"tr",
      sinal=l.tipo==="entrada"?"+":l.tipo==="saida"?"−":"⇄",
      det=l.tipo==="transferencia"?nomeConta(l.contaId)+" → "+nomeConta(l.destinoId):nomeCat(l.catId)+" · "+nomeConta(l.contaId),
      par=l.parcelas&&l.parcelas.length>1?" · "+l.parcelas.length+"x":"",
      tit=l.desc||(l.tipo==="transferencia"?"Mudança de lugar":nomeCat(l.catId));
  return '<button class="lanc'+(l.id===ULTIMO?" novo-lin":"")+'" data-a="editar" data-id="'+l.id+'" aria-label="Editar: '+esc(tit)+'">'+
    '<span class="dia"><b>'+p[2]+'</b><i>'+MES3[+p[1]-1]+'</i></span>'+

  return ks.map(function(k){
    var pc=total?por[k]/total*100:0;
    return '<div class="barra '+cls+'"><div class="top"><b>'+esc(nomeCat(k))+'</b><span>'+num(por[k])+' <span class="faint">'+pc.toFixed(0)+'%</span></span></div>'+
      '<div class="trilho"><div style="width:'+pc.toFixed(1)+'%"></div></div></div>';
  }).join("");
}

    var resumo=g.itens.slice(0,2).map(function(x){return x.desc+(x.de>1?" "+x.n+"/"+x.de:"")}).join(", ")+(g.itens.length>2?" e mais "+(g.itens.length-2):"");

  }).join("")+'</div>':'<div class="vazio"><b>Nada para pagar</b>Quando você gastar no cartão, a conta aparece aqui.</div>')+'</div>';

  if(S.config.contador)h+=blocoContador(r);

function graficoEvolucao(){
  var pts=[], hoje=new Date(), i;
  for(i=5;i>=0;i--){
    var d=new Date(hoje.getFullYear(),hoje.getMonth()-i+1,0), iso=i===0?hojeISO():isoDe(d);
    pts.push({l:MES3[d.getMonth()],pl:totais(iso).pl});
  }
  var W=320,H=140,pL=10,pR=10,pT=22,pB=22, vs=pts.map(function(p){return p.pl});
  var mn=Math.min.apply(null,vs.concat([0])), mx=Math.max.apply(null,vs.concat([1]));
  if(mn===mx){mn-=1;mx+=1}
  function X(k){return pL+k/(pts.length-1)*(W-pL-pR)}
  function Y(val){return pT+(H-pT-pB)-(val-mn)/(mx-mn)*(H-pT-pB)}
  var linha=pts.map(function(p,k){return (k?"L":"M")+X(k).toFixed(1)+","+Y(p.pl).toFixed(1)}).join(" ");
  var s='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--rule)" stroke-dasharray="3,3"/>'+
    '<path d="'+linha+'" fill="none" stroke="var(--ouro)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,k){
    s+='<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(p.pl).toFixed(1)+'" r="4" fill="var(--ouro)"/>'+
       '<text x="'+X(k).toFixed(1)+'" y="'+(H-6)+'" font-size="11" fill="var(--ink2)" text-anchor="middle">'+p.l+'</text>';
  });
  var a=pts[0], b=pts[pts.length-1];
  s+='<text x="'+pL+'" y="12" font-size="11" fill="var(--ink2)">'+esc(brl(a.pl))+'</text><text x="'+(W-pR)+'" y="12" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="end">'+esc(brl(b.pl))+'</text>';
  var dif=b.pl-a.pl;
  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução dos últimos 6 meses">'+s+'</svg>'+
    '<p class="sub" style="margin-top:.4rem">Em 6 meses, o que é seu '+(dif>=0?"subiu ":"caiu ")+'<b>'+esc(brl(Math.abs(dif)))+'</b>.</p>';
}
function blocoContador(r){
  var razao={}, ordem=[];
  r.lanc.forEach(function(l){partidas(l).forEach(function(p){
    var k=p.k+":"+p.id; if(!razao[k]){razao[k]={nome:p.k==="cat"?nomeCat(p.id):nomeConta(p.id),d:0,c:0};ordem.push(k)}
    razao[k][p.lado==="D"?"d":"c"]+=l.valor;
  })});
  ordem.sort(function(a,b){return razao[a].nome.localeCompare(razao[b].nome,"pt-BR")});
  var td=0,tc=0, linhas=ordem.map(function(k){var x=razao[k];td+=x.d;tc+=x.c;
    return '<tr><td>'+esc(x.nome)+'</td><td>'+(x.d?num(x.d):"—")+'</td><td>'+(x.c?num(x.c):"—")+'</td></tr>'}).join("");
  var t=totais();
  return '<h2>Balancete do mês (modo contador)</h2><div class="card">'+
    (ordem.length?'<table><thead><tr><th>Conta</th><th>Débito</th><th>Crédito</th></tr></thead><tbody>'+linhas+'<tr class="tot"><td>Totais</td><td>'+num(td)+'</td><td>'+num(tc)+'</td></tr></tbody></table>'+
      '<div class="confere'+(td===tc?"":" erro")+'">'+(td===tc?"Débito e crédito batem: "+num(td):"Diferença de "+num(Math.abs(td-tc)))+'</div>'
      :'<div class="vazio">Sem lançamentos neste mês.</div>')+
    '<p class="faint" style="margin-top:.7rem">Equação hoje: Ativo '+num(t.ativo)+' = Passivo '+num(t.passivo)+' + Patrimônio líquido '+num(t.pl)+'.</p></div>';
}

/* =====================================================================
   FOLHA "ANOTAR" (criar / editar lançamento)
   ===================================================================== */
var F=null, FOLHA_ABERTA=false;

function abrirFolha(){
  $("#folha").classList.add("on"); document.body.style.overflow="hidden";
  if(!FOLHA_ABERTA){FOLHA_ABERTA=true; try{history.pushState({f:1},"")}catch(e){}}
}
function fecharFolha(){
  if(!FOLHA_ABERTA)return;
  FOLHA_ABERTA=false; F=null;
  $("#folha").classList.remove("on"); document.body.style.overflow="";
  try{if(history.state&&history.state.f)history.back()}catch(e){}
}
window.addEventListener("popstate",function(){
  if(FOLHA_ABERTA){FOLHA_ABERTA=false;F=null;$("#folha").classList.remove("on");document.body.style.overflow=""}
});

function novaFolha(o){
  if(!S.contas.length){toast("Crie uma gaveta primeiro");ir("contas");return}
  F=Object.assign({id:null,tipo:"saida",cent:0,contaId:null,destinoId:null,catId:null,desc:"",data:hojeISO(),n:1},o||{});
  ajustarFolha(); abrirFolha(); desenharFolha();
}
function ajustarFolha(){
  var primAtivo=S.contas.filter(function(c){return c.tipo==="ativo"})[0]||S.contas[0];
  if(!F.contaId||!conta(F.contaId))F.contaId=primAtivo.id;
  if(F.tipo==="transferencia"){
    if(!F.destinoId||F.destinoId===F.contaId||!conta(F.destinoId)){
      var outra=S.contas.filter(function(c){return c.id!==F.contaId})[0]; F.destinoId=outra?outra.id:null;
    }
    F.catId=null;
  }else{
    F.destinoId=null;
    var want=F.tipo==="saida"?"despesa":"receita", k=cat(F.catId);
    if(!k||k.tipo!==want){var p=S.categorias.filter(function(c){return c.tipo===want})[0]; F.catId=p?p.id:null}
  }
  var c=conta(F.contaId);
  if(F.tipo!=="saida"||!c||c.tipo!=="passivo")F.n=1;
}
function gerarParcelas(contaId,data,total,n){
  var c=conta(contaId); if(!c||c.tipo!=="passivo")return null;
  var v1=(c.fecha&&c.vence)?primeiroVencimento(data,c.fecha,c.vence):data;
  return dividir(total,n).map(function(val,i){return {data:addMes(v1,i),valor:val}});
}
function chip(acao,id,rot,sel,extra){return '<button class="chip" data-a="'+acao+'" data-id="'+id+'" aria-pressed="'+sel+'">'+esc(rot)+(extra||"")+'</button>'}

function desenharFolha(){
  var tr=F.tipo==="transferencia", cl=F.tipo==="saida"?"s":F.tipo==="entrada"?"e":"t", c=conta(F.contaId);
  var h='<header class="capa f"><button class="volta" data-a="fFechar" aria-label="Voltar">←</button><h1>'+(F.id?"Editar anotação":"Anotar")+'</h1></header>';
  h+='<div class="seg3" role="group" aria-label="O que aconteceu">'+
    '<button class="s" data-a="fTipo" data-t="saida" aria-pressed="'+(F.tipo==="saida")+'">Gastei</button>'+
    '<button class="e" data-a="fTipo" data-t="entrada" aria-pressed="'+(F.tipo==="entrada")+'">Recebi</button>'+
    '<button class="t" data-a="fTipo" data-t="transferencia" aria-pressed="'+(F.tipo==="transferencia")+'">Mudei de lugar</button></div>';
  h+='<label class="rot" for="fValor">Quanto?</label><input id="fValor" class="dinheiro '+cl+'" inputmode="numeric" autocomplete="off" placeholder="R$ 0,00">';

  function gav(acao,sel,excl){
    return S.contas.filter(function(x){return x.id!==excl}).map(function(x){
      return '<button class="opt" data-a="'+acao+'" data-id="'+x.id+'" aria-pressed="'+(sel===x.id)+'">'+esc(x.nome)+
        '<small>'+(x.tipo==="passivo"?"dívida · devo "+brl(saldoConta(x)):brl(saldoConta(x)))+'</small></button>';
    }).join("");
  }
  var want=F.tipo==="saida"?"despesa":"receita";
  var cats=S.categorias.filter(function(k){return k.tipo===want}).map(function(k){
    return '<button class="opt" data-a="fCat" data-id="'+k.id+'" aria-pressed="'+(F.catId===k.id)+'">'+esc(k.nome)+'</button>';
  }).join("")+'<button class="opt novo" data-a="categoria" data-id="" data-tipo="'+want+'">+ Nova categoria</button>';
  var tE, tD, cE, cD;
  if(F.tipo==="saida"){tE="De onde saiu";tD="Para onde foi";cE=gav("fConta",F.contaId);cD=cats}

/* fio dourado que liga o que foi escolhido na coluna da esquerda ao da direita */
function ligarFio(){
  var tt=$("#tt"), p=$("#lp"); if(!tt||!p)return;
  var l=tt.querySelector('.tc>div:first-child .opt[aria-pressed="true"]'), r=tt.querySelector('.tc>div:last-child .opt[aria-pressed="true"]');
  if(!l||!r){p.setAttribute("d","");return}
  var T=tt.getBoundingClientRect(), a=l.getBoundingClientRect(), b=r.getBoundingClientRect();
  var x1=a.right-T.left, y1=a.top+a.height/2-T.top, x2=b.left-T.left, y2=b.top+b.height/2-T.top, mx=(x1+x2)/2;
  p.setAttribute("d","M"+x1+" "+y1+" C "+mx+" "+y1+" "+mx+" "+y2+" "+x2+" "+y2);
  var L=600; try{L=p.getTotalLength()}catch(e){}
  p.style.setProperty("--L",L);
}

   BACKUP
   ===================================================================== */
function guardarCopia(){
  var txt=JSON.stringify({app:"caderneta",versao:2,dados:S},null,1), nome="caderneta-"+hojeISO()+".json";
  function marcar(){S.config.ultimoBackup=hojeISO();salvar();toast("Cópia guardada!");desenhar()}
  function baixar(){
    try{
      var a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
      a.download=nome; document.body.appendChild(a); a.click(); a.remove(); marcar();
    }catch(e){toast("Não consegui gerar o arquivo aqui")}
  }
  try{
    var f=new File([txt],nome,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"Cópia da Caderneta"}).then(marcar).catch(function(e){if(!e||e.name!=="AbortError")baixar()});
      return;
    }
  }catch(e){}
  baixar();
}
function lerCopia(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      if(!ehObj(p)||p.app!=="caderneta"||!ehObj(p.dados))throw 0;
      var h=higienizar(p.dados);
      if(!h.contas.length&&!h.lancamentos.length)throw 0;
      confirmar("Isso troca tudo que está neste aparelho pelo conteúdo da cópia."+(h.perdidos?" ("+h.perdidos+" item(ns) com problema serão ignorados.)":"")+" Continuar?","Sim, recuperar",function(){
        S.contas=h.contas;S.categorias=h.categorias;S.lancamentos=h.lancamentos;S.config.pronto=true;
        salvar(); toast("Dados recuperados!"); ir("inicio");
      });
    }catch(e){toast("Esse arquivo não é uma cópia da Caderneta")}
  };
  r.readAsText(file);
}

  r.classList.toggle("calmo",S.config.movimento==="parado"||reduz);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute("content",S.config.tema==="escuro"||(S.config.tema==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"#0D1612":"#1F3D2F");
}

var ACOES={
  ir:function(d){ir(d.v)},
  novo:function(){novaFolha()},
  editar:function(d){
    var l=null; S.lancamentos.forEach(function(x){if(x.id===d.id)l=x}); if(!l)return;
    novaFolha({id:l.id,tipo:l.tipo,cent:l.valor,contaId:l.contaId,destinoId:l.destinoId,catId:l.catId,desc:l.desc,data:l.data,n:l.parcelas?l.parcelas.length:1});
  },
  mes:function(d){
    REF.setMonth(REF.getMonth()+(+d.n)); desenhar();
    var t=$("#tela"); t.classList.remove("vira-d","vira-e"); void t.offsetWidth; t.classList.add(+d.n>0?"vira-d":"vira-e");
  },
  pagar:function(d){
    var c=conta(d.id); if(!c)return;
    var banco=S.contas.filter(function(x){return x.tipo==="ativo"})[0];
    if(!banco){toast("Crie uma gaveta com dinheiro para pagar");return}
    novaFolha({tipo:"transferencia",contaId:banco.id,destinoId:c.id,cent:+d.valor,desc:"Pagamento "+c.nome});
  },
  gaveta:function(d){modalGaveta(d.id||null)},
  fAdd:function(d){addLinhaFatura(d.c,null)},
  fDel:function(d,b){b.closest(".linha-f").remove()},
  gTipo:function(d){if(G&&!G.bloqueado){G.tipo=d.t;rotuloGaveta()}},
  gSalvar:salvarGaveta,
  gApagar:function(){
    var id=G.id; confirmar("Apagar a gaveta "+nomeConta(id)+"?","Apagar",function(){
      S.contas=S.contas.filter(function(c){return c.id!==id}); salvar(); desenhar(); toast("Gaveta apagada")});
  },
  categoria:function(d){modalCategoria(d.id||null,d.tipo||null)},
  kTipo:function(d){if(K&&!K.bloqueado){K.tipo=d.t;document.querySelectorAll("#kTipos button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.t===K.tipo))})}},
  kSalvar:salvarCategoria,
  kApagar:function(){
    var id=K.id; confirmar("Apagar a categoria "+nomeCat(id)+"?","Apagar",function(){
      S.categorias=S.categorias.filter(function(c){return c.id!==id}); salvar(); desenhar(); toast("Categoria apagada")});
  },
  mOk:function(){var a=MOK; fecharModal(); if(a)a()},
  mFechar:fecharModal,
  cfg:function(d){
    var val=d.val==="true"?true:d.val==="false"?false:d.val;
    S.config[d.g]=val; salvar(); aplicarConfig(); desenhar();
  },
  backup:guardarCopia,
  restaurar:function(){var f=$("#arquivo"); if(f)f.click()},
  zerar:function(){
    confirmar("Isso apaga TODAS as suas gavetas e anotações deste aparelho. Não dá para desfazer. Tem certeza?","Sim, apagar tudo",function(){
      S.contas=[];S.categorias=[];S.lancamentos=[];S.config.pronto=false;salvar();iniciarOnb();
    });
  },
  /* folha */
  fFechar:fecharFolha,
  fTipo:function(d){F.tipo=d.t;ajustarFolha();desenharFolha()},
  fConta:function(d){F.contaId=d.id;ajustarFolha();desenharFolha()},
  fDestino:function(d){F.destinoId=d.id;desenharFolha()},
  fCat:function(d){F.catId=d.id;desenharFolha()},
  fData:function(d){F.data=d.d;desenharFolha()},
  fOutraData:function(){var w=$("#wData");w.hidden=false;document.querySelectorAll('[data-a="fData"],[data-a="fOutraData"]').forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.a==="fOutraData"))});$("#fData").focus()},
  fN:function(d){F.n=Math.max(1,Math.min(24,F.n+(+d.n)));previa()},
  fSalvar:salvarFolha,
  fApagar:function(){
    var id=F.id; confirmar("Apagar esta anotação?","Apagar",function(){
      S.lancamentos=S.lancamentos.filter(function(x){return x.id!==id}); salvar(); fecharFolha(); desenhar(); toast("Anotação apagada")});
  },
  /* primeiros passos */
  oProx:function(){
    if(O.passo===2){
      O.guardados=[];
      [["oCarteira","Carteira"],["oBanco","Conta no banco"],["oPoup","Poupança"]].forEach(function(x){var c=cent(document.getElementById(x[0]));if(c>0)O.guardados.push({nome:x[1],c:c})});
    }
    O.passo++; desenharOnb();
  },
  oCartao:function(d){O.cartao=d.s==="1";document.getElementById("oCartaoCampos").hidden=!O.cartao;document.querySelectorAll('[data-a="oCartao"]').forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.s===d.s))})},
  oFim:finalizarOnb
};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]"); if(!b||b.disabled)return;
  var fn=ACOES[b.dataset.a]; if(fn)fn(b.dataset,b);
});
document.addEventListener("change",function(e){
  if(e.target.id==="arquivo"&&e.target.files&&e.target.files[0]){lerCopia(e.target.files[0]);e.target.value=""}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if($("#modalFundo").classList.contains("on"))fecharModal(); else if(FOLHA_ABERTA)fecharFolha() }
});

/* ---------- início ---------- */
carregar();
aplicarConfig();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
if(S.config.pronto&&S.contas.length)ir("inicio"); else iniciarOnb();

})();
</script>
</body>
</html>
