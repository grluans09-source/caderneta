document.addEventListener("keydown",function(e){if(e.key==="Escape")fabMenu(false)});

function norm(s){return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function carteiraConta(){return S.contas.filter(function(c){return c.carteira})[0]||null}
function marcarCarteira(arr){
  var ja=arr.filter(function(c){return c.carteira});
  ja.slice(1).forEach(function(c){delete c.carteira});
  if(ja.length)return;
  var nomes=["dinheiro","carteira","dinheiro vivo","dinheiro em especie"];
  var c=arr.filter(function(x){return x.tipo==="ativo"&&!x.pessoa&&!x.bem&&nomes.indexOf(norm(x.nome))>=0})[0];
  if(c){c.carteira=true;return}
  /* quem já tinha o app antes da conta Dinheiro existir também ganha a carteira (sem tocar no que já tem) */
  if(!arr.length)return;
  var usados=arr.map(function(x){return norm(x.nome)});
  var nome=["Dinheiro","Dinheiro vivo","Carteira"].filter(function(n){return usados.indexOf(norm(n))<0})[0]||"Dinheiro na mão";
  arr.unshift({id:uid(),nome:nome,tipo:"ativo",inicial:0,carteira:true});
  CARTEIRA_NOVA=true;
}

/* ---------- listas curtas na folha ---------- */
function usoContas(){var u={};S.lancamentos.forEach(function(l){[l.contaId,l.destinoId].forEach(function(id){if(id)u[id]=(u[id]||0)+1})});return u}
function favoritasValidas(){
  var cand=S.contas.filter(function(x){return !x.bem&&!x.carteira}).map(function(x){return x.id});
  return (S.config.favoritas||[]).filter(function(id){return cand.indexOf(id)>=0}).slice(0,3);
}
function contasRapidas(excl){
  var cw=carteiraConta(), u=usoContas();
  var todas=S.contas.filter(function(x){return !x.bem&&!x.carteira&&x.id!==excl});
  var fav=favoritasValidas().filter(function(id){return id!==excl});
  var outras=todas.filter(function(x){return fav.indexOf(x.id)<0&&!x.pessoa}).sort(function(a,b){return (u[b.id]||0)-(u[a.id]||0)});
  var ids=fav.concat(outras.slice(0,Math.max(0,3-fav.length)).map(function(x){return x.id}));
  var lista=[]; if(cw&&cw.id!==excl)lista.push(cw);
  ids.forEach(function(id){lista.push(conta(id))});
  return lista;
}
function favCatsValidas(want){
  var out=[];
  (S.config.favCats||[]).forEach(function(id){var k=cat(id); if(k&&k.tipo===want&&out.indexOf(id)<0)out.push(id)});
  return out.slice(0,5);
}
function catsRapidas(want){
  var u={}; S.lancamentos.forEach(function(l){if(l.catId)u[l.catId]=(u[l.catId]||0)+1});
  var fav=favCatsValidas(want).map(cat);
  var resto=S.categorias.filter(function(k){return k.tipo===want&&fav.indexOf(k)<0}).map(function(k,i){return {k:k,i:i}})
    .sort(function(a,b){return (u[b.k.id]||0)-(u[a.k.id]||0)||a.i-b.i}).map(function(x){return x.k});
  return fav.concat(resto.slice(0,Math.max(0,5-fav.length)));
}
function listaColuna(cfg,q,todas){
  var todos=cfg.k==="contas"?S.contas.filter(function(x){return !x.bem&&x.id!==cfg.ex})
    :cfg.k==="cats"?S.categorias.filter(function(k){return k.tipo===cfg.want}):bensLista();
  if(q){var nq=norm(q); return todos.filter(function(x){return norm(x.nome).indexOf(nq)>=0})}
  if(todas)return todos.slice().sort(function(a,b){return norm(a.nome)<norm(b.nome)?-1:norm(a.nome)>norm(b.nome)?1:0});
  var curtos=cfg.k==="contas"?contasRapidas(cfg.ex):cfg.k==="cats"?catsRapidas(cfg.want):bensLista().slice(0,5);
  if(cfg.sel&&!curtos.some(function(x){return x.id===cfg.sel})){var s=todos.filter(function(x){return x.id===cfg.sel})[0]; if(s)curtos.push(s)}
  return curtos;
}
function itemColuna(cfg,x){
  var on=cfg.sel===x.id;
  if(cfg.k==="cats")return '<button class="opt" data-a="'+cfg.a+'" data-id="'+x.id+'" aria-pressed="'+on+'">'+esc(x.nome)+'</button>';
  if(cfg.k==="bens")return '<button class="opt" data-a="'+cfg.a+'" data-id="'+x.id+'" aria-pressed="'+on+'">'+esc(x.nome)+'<small>vale '+esc(brl(saldoConta(x)))+'</small></button>';
  return '<button class="opt" data-a="'+cfg.a+'" data-id="'+x.id+'" aria-pressed="'+on+'">'+esc(x.nome)+
    '<small>'+(x.pessoa?(x.tipo==="ativo"?"te deve ":"você deve ")+brl(saldoConta(x)):x.tipo==="passivo"?"dívida · devo "+brl(saldoConta(x)):brl(saldoConta(x)))+'</small></button>';
}
function pintarColuna(lado){

  var q=(F["q"+lado]||"").trim(), todas=!!F["t"+lado], itens=listaColuna(cfg,q,todas), h="";

  if(todas||q)h+='<button class="link" data-a="verCurta" data-l="'+lado+'">↑ Mostrar só as favoritas</button>';

    if(cfg.k==="cats"){
      h+='<button class="opt novo" data-a="categoria" data-id="" data-tipo="'+cfg.want+'">+ Nova categoria</button>';
      h+='<button class="link" data-a="favCats" data-w="'+cfg.want+'">★ Escolher minhas 5 favoritas</button>';
    }

    if(cfg.k==="contas")h+='<button class="link" data-a="favoritas">★ Escolher minhas 3 favoritas</button>';

/* ---------- conferir o saldo com o banco (conciliação) ----------
   A pessoa digita o saldo que vê no app do banco. Se bater, marca a data.
   Se não bater: ou anota o que faltou (folha já preenchida), ou corrige com uma
   anotação de verdade na categoria "Diferença ao conferir" (o passado não muda). */
var CF=null;
function modalConferir(id){
  var c=conta(id); if(!c)return; CF={id:id};
  abrirModal('<p class="q">Conferir com o banco</p>'+
    '<p class="sub">Abra o app do banco e veja o saldo de <b>'+esc(c.nome)+'</b> agora. Digite aqui o mesmo valor.</p>'+
    '<p class="faint">No Balancete: <b style="color:var(--ink)">'+esc(brl(saldoConta(c)))+'</b>'+(c.conferido?' · última conferência em '+esc(dataBR(c.conferido)):'')+'</p>'+
    '<div class="campo"><label for="cfSaldo">Saldo no banco agora</label><input id="cfSaldo" inputmode="numeric" placeholder="R$ 0,00"></div>'+
    '<div id="cfRes" aria-live="polite"></div>'+
    '<button class="btn sec" data-a="mFechar">Fechar</button>');

function pintarConferir(){
  var el=$("#cfRes"), c=CF&&conta(CF.id); if(!el||!c)return;

  var banco=cent($("#cfSaldo")), dif=banco-saldoConta(c); CF.banco=banco; CF.dif=dif;
  if(dif===0){el.innerHTML='<div class="cf-res cf-ok"><b>Bateu!</b> O Balancete e o banco mostram o mesmo valor.</div><button class="btn" data-a="cfOk">Marcar como conferido</button>';return}
  var falta=dif<0, d=Math.abs(dif);
  if(c.inv){el.innerHTML='<div class="cf-res"><b>'+(falta?'O banco mostra '+esc(brl(d))+' a menos':'O banco mostra '+esc(brl(d))+' a mais')+'</b><p>'+(falta?'Pode ser imposto (IR, IOF) ou taxa descontada pelo banco.':'É rendimento que eu ainda não tinha contado.')+'</p></div><button class="btn" data-a="cfCorrigir">'+(falta?'Anotar o imposto ou a taxa':'Ajustar o rendimento')+'</button>';return}
  el.innerHTML='<div class="cf-res"><b>'+(falta?'Faltam '+esc(brl(d))+' no banco':'Tem '+esc(brl(d))+' a mais no banco')+'</b>'+
    '<p>'+(falta?'Pode ser um gasto, uma tarifa ou um pagamento que não foi anotado.':'Pode ser um dinheiro que entrou e não foi anotado, ou um rendimento.')+'</p></div>'+

function salvarCarteira(){
  var c=conta(G.id); if(!c)return;
  var nome=$("#gNome").value.trim();
  if(!nome){toast("Dê um nome para a conta");return}
  if(repetido(nome,S.contas,G.id)){toast("Já existe uma conta com esse nome");return}
  var contou=CED.some(function(v){return G.ced[v]>0})||!!c.cedulas;
  function aplicar(){
    c.nome=nome;
    if(contou){
      var total=totalCed(G.ced); c.inicial+=total-saldoConta(c);
      var ce={}; CED.forEach(function(v){if(G.ced[v]>0)ce[v]=G.ced[v]});
      if(Object.keys(ce).length){c.cedulas=ce;c.contagem=hojeISO()} else {delete c.cedulas;delete c.contagem}
    }
    salvar(); fecharModal(); desenhar(); toast("Conta Dinheiro salva");
  }
  var novo=totalCed(G.ced), atual=saldoConta(c);
  if(contou&&novo!==atual)confirmar("O saldo da conta "+c.nome+" vai de "+brl(atual)+" para "+brl(novo)+" (o que você contou). Continuar?","Sim, ajustar",aplicar);
  else aplicar();
}
function pintarArred(){
  var el=$("#fArred"); if(!el||!F)return;
  var cw=carteiraConta(), v=F.cent;
  var envolve=!!cw&&(F.contaId===cw.id||(F.tipo==="transferencia"&&F.destinoId===cw.id));
  if(!envolve||!v||v%100===0){el.innerHTML="";return}
  var baixo=Math.floor(v/100)*100, alto=baixo+100;
  el.innerHTML='<p class="faint" style="margin-top:.5rem">Dinheiro vivo trabalha em <b>reais inteiros</b> (as moedas ficam de fora). Quer arredondar?</p><div class="chips">'+
    '<button class="chip" data-a="fArred" data-v="'+alto+'">Para '+esc(brl(alto))+'</button>'+
    (baixo>0?'<button class="chip" data-a="fArred" data-v="'+baixo+'">Para '+esc(brl(baixo))+'</button>':'')+
    '<button class="chip" data-a="fArred" data-v="'+v+'" aria-pressed="true">Manter '+esc(brl(v))+'</button></div>';
}

var REL_ID=null;
var ST={ok:["✓","Saudável"],atencao:["!","Atenção"],critico:["▲","Alerta"],info:["i","Informativo"],sem:["–","Sem dados"]};
function n1(x){return String(Math.round(x*10)/10).replace(".",",")}
function RB(x){return esc(brl(x))}
function selo(st){return '<span class="selo st-'+st+'"><i aria-hidden="true">'+ST[st][0]+'</i> '+ST[st][1]+'</span>'}
function fimDoMes(ym){var p=ym.split("-").map(Number);return ym+"-"+pad(ultimoDia(p[0],p[1]-1))}
function serieMeses(n){
  var ym=hojeISO().slice(0,7), out=[], i;

/* ---------- peças de desenho (as faixas usam as cores do app: preto = saudável, ouro = atenção, bordô = alerta) ---------- */
function gaugeHTML(v,max,faixas,fmt,marcas){
  var pos=Math.max(0,Math.min(100,v/max*100)), prev=0, bands="";
  faixas.forEach(function(f){bands+='<i style="width:'+((f.ate-prev)/max*100).toFixed(2)+'%;background:'+f.cor+'"></i>';prev=f.ate});
  var ticks=(marcas||[]).map(function(m){return '<span style="left:'+(m/max*100).toFixed(2)+'%">'+esc(fmt(m))+'</span>'}).join("");
  return '<div class="gauge" role="img" aria-label="'+esc(fmt(v))+'"><div class="g-b">'+bands+'</div><span class="g-m" style="left:'+pos.toFixed(2)+'%"><b>'+esc(fmt(v))+'</b></span><div class="g-t"><span style="left:0">'+esc(fmt(0))+'</span>'+ticks+'</div></div>';
}
function duasHTML(rows){
  var mx=Math.max(1,rows.reduce(function(m,r){return Math.max(m,r.v)},0));
  return '<div class="duas">'+rows.map(function(r){return '<div class="du"><div class="du-n"><span>'+esc(r.n)+'</span><b>'+esc(brl(r.v))+'</b></div><div class="du-t"><i style="width:'+Math.max(r.v>0?3:0,r.v/mx*100).toFixed(1)+'%;background:'+r.cor+'"></i></div></div>'}).join("")+'</div>';
}
function empHTML(parts){
  var tot=parts.reduce(function(s,p){return s+p.v},0)||1;
  return '<div class="emp" role="img" aria-label="Composição"><div class="emp-b">'+parts.filter(function(p){return p.v>0}).map(function(p){return '<i style="width:'+(p.v/tot*100).toFixed(2)+'%;background:'+p.cor+'"></i>'}).join("")+'</div><ul class="emp-l">'+
    parts.map(function(p){return '<li><i style="background:'+p.cor+'"></i><span>'+esc(p.n)+'</span><b>'+esc(brl(p.v))+' · '+Math.round(p.v/tot*100)+'%</b></li>'}).join("")+'</ul></div>';
}
function barrasParSVG(serie,ka,kb,rotA,rotB,aria){
  var W=320,H=172,pL=8,pR=8,pT=24,pB=24, n=serie.length, w=(W-pL-pR)/n, bw=Math.min(18,w/2-3), mx=1, s="";
  serie.forEach(function(m){mx=Math.max(mx,m[ka],kb?m[kb]:0)});
  serie.forEach(function(m,i){
    var cx=pL+w*i+w/2, ha=(H-pT-pB)*m[ka]/mx, hb=kb?(H-pT-pB)*m[kb]/mx:0, xa=kb?cx-bw-1:cx-bw/2;
    s+='<rect x="'+xa.toFixed(1)+'" y="'+(H-pB-ha).toFixed(1)+'" width="'+bw+'" height="'+ha.toFixed(1)+'" rx="2" style="fill:'+(kb?"var(--in)":"var(--out)")+'"/>';
    if(kb)s+='<rect x="'+(cx+1).toFixed(1)+'" y="'+(H-pB-hb).toFixed(1)+'" width="'+bw+'" height="'+hb.toFixed(1)+'" rx="2" style="fill:var(--out)"/>';
    s+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" font-size="9.5" text-anchor="middle" style="fill:var(--ink2)">'+m.l+'</text>';
  });
  s+='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+(H-pB)+'" y2="'+(H-pB)+'" style="stroke:var(--rule2)"/>';
  s+='<text x="'+pL+'" y="13" font-size="10" font-weight="700" style="fill:'+(kb?"var(--in)":"var(--out)")+'">■ '+esc(rotA)+'</text>'+(kb?'<text x="'+(pL+70)+'" y="13" font-size="10" font-weight="700" style="fill:var(--out)">■ '+esc(rotB)+'</text>':'');
  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">'+s+'</svg>';
}

/* ---------- os indicadores ---------- */
function indicadores(){
  var hoje=hojeISO(), ym=hoje.slice(0,7), t=totais(), B=Math.max(0,bensTotal()), caixa=dinheiroEmConta()+investidoTotal(), guard=totalReservado()+investidoTotal();
  var serie=serieMeses(6), ult=serie.slice(3), ent3=0, sai3=0, n3=0, out=[], i;
  ult.forEach(function(m){if(m.ent>0||m.sai>0){ent3+=m.ent;sai3+=m.sai;n3++}});
  var saiMed=n3?Math.round(sai3/n3):0, entMed=n3?Math.round(ent3/n3):0;
  var C={ok:"var(--selbg)",at:"var(--latao)",cr:"var(--gasto-bg)"};

  /* 1. patrimônio */
  var plAnt=totais(fimDoMes(ymMais(ym,-1))).pl, hist=S.lancamentos.some(function(l){return l.data.slice(0,7)<ym}), dPL=t.pl-plAnt;
  out.push({id:"patrimonio",nome:"O que é seu de verdade",pergunta:"Meu patrimônio está crescendo?",valor:brl(t.pl),
    st:t.pl<0?"critico":(hist&&dPL<0)?"atencao":hist?"ok":"info",
    leitura:t.pl<0?"Você deve mais do que tem.":!hist?"Ainda sem meses anteriores para comparar.":dPL>0?"Subiu "+brl(dPL)+" desde o mês passado.":dPL<0?"Caiu "+brl(-dPL)+" desde o mês passado.":"Igual ao mês passado.",
    d:{pl:t.pl,ant:plAnt,delta:dPL,hist:hist,ativo:t.ativo,passivo:t.passivo,aj:resumoMes(ym).aj}, graf:graficoEvolucao()});

  /* 2. folga para os próximos 30 dias */
  var obrig=0; agenda().forEach(function(a){if(a.k==="receber")return; if(!a.data||diasAte(a.data)<=30)obrig+=a.valor});
  var razao=obrig>0?caixa/obrig:null;

    valor:obrig===0?"Sem contas":n1(razao)+"x",
    st:obrig===0?"ok":razao>=2?"ok":razao>=1?"atencao":"critico",
    leitura:obrig===0?"Nenhuma conta nos próximos 30 dias.":razao>=1?"Seu dinheiro cobre "+n1(razao)+" vez(es) as contas.":"Seu dinheiro não cobre todas as contas.",
    d:{caixa:caixa,obrig:obrig,razao:razao},
    graf:duasHTML([{n:"Seu dinheiro (com o guardado)",v:caixa,cor:C.ok},{n:"Contas até 30 dias",v:obrig,cor:C.cr}])});

  /* 3. reserva de emergência */
  var meses=saiMed>0?caixa/saiMed:null;
  out.push({id:"reserva",nome:"Reserva de emergência",pergunta:"Por quantos meses eu aguento sem renda?",
    valor:meses===null?"—":n1(meses)+" meses",
    st:meses===null?"sem":meses>=6?"ok":meses>=3?"atencao":"critico",
    leitura:meses===null?"Anote seus gastos para estimar.":meses>=6?"Você aguenta "+n1(meses)+" meses.":"Você aguenta só "+n1(meses)+" meses.",
    d:{caixa:caixa,saiMed:saiMed,meses:meses},
    graf:meses===null?'<p class="faint">Sem gastos anotados ainda.</p>':gaugeHTML(Math.min(meses,12),12,[{ate:3,cor:C.cr},{ate:6,cor:C.at},{ate:12,cor:C.ok}],function(x){return n1(x)+(x===0?"":" m")},[3,6,12])});

  /* 4. taxa de poupança */
  var taxa=ent3>0?(ent3-sai3)/ent3*100:null;
  out.push({id:"poupanca",nome:"Taxa de poupança",pergunta:"Quanto do que eu ganho sobra?",
    valor:taxa===null?"—":Math.round(taxa)+"%",

    d:{ent:ent3,sai:sai3,entMed:entMed,saiMed:saiMed,taxa:taxa},
    graf:barrasParSVG(serie,"ent","sai","Entrou","Saiu","Entradas e saídas dos últimos 6 meses")});

  /* 5. endividamento */
  var pDiv=t.ativo>0?t.passivo/t.ativo*100:null;
  out.push({id:"endividamento",nome:"Peso das dívidas",pergunta:"Quanto do que tenho está tomado por dívidas?",
    valor:t.passivo===0?"0%":pDiv===null?"—":Math.round(pDiv)+"%",
    st:t.passivo===0?"ok":pDiv===null?"sem":pDiv<=30?"ok":pDiv<=50?"atencao":"critico",

    d:{ativo:t.ativo,passivo:t.passivo,pct:pDiv},
    graf:gaugeHTML(Math.min(pDiv||0,100),100,[{ate:30,cor:C.ok},{ate:50,cor:C.at},{ate:100,cor:C.cr}],function(x){return Math.round(x)+"%"},[30,50,100])});

  /* 6. quanto da renda já tem dono */
  var cm=comprometidoMeses(3), compr=Math.round(cm.reduce(function(s,m){return s+m.div+m.fix},0)/cm.length), renda=rendaMedia();

  /* 7. custo fixo de vida: o básico que chega todo mês */
  var ymH=hojeISO().slice(0,7), fixM=0, anoM=0;

  var divM=Math.round(cm.reduce(function(s,m){return s+m.div},0)/cm.length), custo=fixM+anoM+divM, pCu=renda>0&&custo>0?custo/renda*100:null;

    st:custo===0?"sem":pCu===null?"sem":pCu<=50?"ok":pCu<=70?"atencao":"critico",
    leitura:custo===0?"Cadastre suas contas fixas para calcular.":"O seu básico custa "+brl(custo)+" por mês"+(pCu!==null?", "+Math.round(pCu)+"% da renda.":"."),
    d:{custo:custo,fixM:fixM,anoM:anoM,divM:divM,renda:renda,pct:pCu},
    graf:custo===0?'<p class="faint">Cadastre contas fixas (aluguel, luz, internet) e dívidas para ver este gráfico.</p>':empHTML([{n:"Contas fixas do mês",v:fixM,cor:C.cr},{n:"Contas do ano (por mês)",v:anoM,cor:C.at},{n:"Parcelas e dívidas (média)",v:divM,cor:"var(--tr)"}])});

  /* 8. para onde vai o dinheiro */
  var rm=resumoMes(ym), ks=Object.keys(rm.porSai).sort(function(a,b){return rm.porSai[b]-rm.porSai[a]}), top=ks[0], pTop=top&&rm.sai?rm.porSai[top]/rm.sai*100:0, pTop3=rm.sai?ks.slice(0,3).reduce(function(s,k){return s+rm.porSai[k]},0)/rm.sai*100:0;
  out.push({id:"destino",nome:"Para onde vai o dinheiro",pergunta:"Em que eu mais gasto?",
    valor:rm.sai?brl(rm.sai):"—",
    st:!rm.sai?"sem":pTop>50?"atencao":"info",
    leitura:!rm.sai?"Nenhum gasto anotado neste mês.":nomeCat(top)+" é a maior fatia: "+Math.round(pTop)+"% dos gastos.",
    d:{sai:rm.sai,ent:rm.ent,top:top?nomeCat(top):"",topV:top?rm.porSai[top]:0,pTop:pTop,pTop3:pTop3,porSai:rm.porSai,porEnt:rm.porEnt},
    graf:'<div class="rot2" style="margin-bottom:.3rem">Gastos de '+MES[+ym.slice(5)-1]+'</div>'+barras(rm.porSai,rm.sai,"s")});

  /* 9. de que é feito o patrimônio */
  var usar=Math.max(0,caixa-guard), recPes=Math.max(0,t.ativo-caixa-B), liqP=t.ativo>0?caixa/t.ativo*100:null;
  out.push({id:"composicao",nome:"De que é feito o que você tem",pergunta:"O que tenho vira dinheiro rápido?",
    valor:liqP===null?"—":Math.round(liqP)+"% em dinheiro",

/* ---------- o texto de cada relatório (como um consultor explicaria) ---------- */
function relatorioTexto(i){
  var d=i.d, st=i.st, T={o:"",c:"",r:"",p:"",b:[]};
  if(i.id==="patrimonio"){
    T.o="É o placar da sua vida financeira: tudo o que você tem (dinheiro, bens e o que te devem) menos tudo o que você deve. Se esse número sobe com o tempo, você está ficando mais forte; se desce, mais frágil, mesmo que o saldo do banco pareça o mesmo.";
    T.c=d.pl<0?"Hoje você deve mais do que tem: faltariam <b>"+RB(-d.pl)+"</b> para quitar tudo. Isso não é o fim, é um ponto de partida.":
      "Hoje o seu patrimônio é de <b>"+RB(d.pl)+"</b> (você tem "+RB(d.ativo)+" e deve "+RB(d.passivo)+"). "+
      (!d.hist?"Ainda não há meses anteriores para comparar; a evolução aparece conforme você anota.":d.delta>0?"Desde o fim do mês passado ele <b>subiu "+RB(d.delta)+"</b>: você está construindo.":d.delta<0?"Desde o fim do mês passado ele <b>caiu "+RB(-d.delta)+"</b>. Vale descobrir por quê: gastou mais do que ganhou, pagou juros ou algum bem perdeu valor?":"Ele ficou igual ao do mês passado.")+(d.aj?" Neste mês o valor dos seus bens mudou "+(d.aj>0?"+":"−")+RB(Math.abs(d.aj))+": o bem ganhou ou perdeu valor, não é dinheiro que entrou ou saiu.":"");
    T.r="Não existe um valor certo: o que vale é a direção. Subindo mês a mês, o plano funciona. Caindo por três meses seguidos, é hora de rever gastos e dívidas.";
    T.p=st==="critico"?"A prioridade é parar de aumentar as dívidas e reduzir primeiro as mais caras (cartão e cheque especial costumam ser as piores).":st==="atencao"?"O patrimônio recuou. Olhe a taxa de poupança e o relatório 'Para onde vai o dinheiro' para achar a causa.":st==="ok"?"Você está no caminho certo. O desafio agora é manter o ritmo e proteger o que construiu, com uma reserva e seguros.":"Anote por mais algumas semanas para ver a tendência.";
    T.b=["Anote tudo por 30 dias: o que você enxerga, você consegue controlar.","Separe um valor fixo para guardar assim que receber, antes de gastar.","Evite comprar a prazo com juros coisas que perdem valor rápido."];
  }else if(i.id==="liquidez"){
    T.o="Responde: se todas as contas dos próximos 30 dias chegassem juntas, o meu dinheiro cobre? É como olhar o tanque antes de uma viagem.";
    T.c=d.obrig===0?"Você não tem contas registradas para os próximos 30 dias, então a folga hoje é total. Cadastre suas contas fixas e dívidas para este indicador ficar fiel.":
      "Você tem <b>"+RB(d.caixa)+"</b> em dinheiro (contando o que está guardado) e <b>"+RB(d.obrig)+"</b> de contas até 30 dias. Isso cobre as contas <b>"+n1(d.razao)+" vez(es)</b>.";
    T.r="2 vezes ou mais: folgado. Entre 1 e 2 vezes: apertado, qualquer imprevisto pesa. Abaixo de 1: o dinheiro não cobre tudo e alguma conta vai atrasar.";

    T.b=["Abra o acerto de contas em Planejar e pague uma a uma, por ordem de vencimento.","Se faltar, procure o credor antes de atrasar: renegociar custa menos que a multa.","Use a agenda para ver o que vence primeiro."];
  }else if(i.id==="reserva"){

    T.b=["Monte a reserva numa caixinha só dela, para não misturar com o dinheiro do dia a dia.","Comece pequeno: o valor de uma semana de gastos já muda o jogo.","Reserva primeiro, investimento depois."];
  }else if(i.id==="poupanca"){

  }else if(i.id==="endividamento"){

      "Você tem <b>"+RB(d.ativo)+"</b> e deve <b>"+RB(d.passivo)+"</b>: para cada R$ 100 que possui, <b>R$ "+Math.round(d.pct)+"</b> são de dívida (<b>"+Math.round(d.pct)+"%</b>).";
    T.r="Até 30%: confortável. De 30% a 50%: atenção, as dívidas já pesam. Acima de 50%: alerta, mais da metade do que você tem já tem dono. São referências comuns de educação financeira, não regras.";
    T.p=st==="critico"?"As dívidas dominam o seu patrimônio. Foque em reduzi-las antes de qualquer compra nova.":st==="atencao"?"Você ainda tem margem, mas qualquer dívida nova empurra para o alerta.":st==="ok"?"As dívidas estão sob controle. Continue pagando em dia e evite novas parcelas desnecessárias.":"Cadastre suas contas, bens e dívidas para o cálculo.";
    T.b=["Liste as dívidas pelo juro e pague primeiro as mais caras (cartão rotativo, cheque especial).","Evite criar dívida nova enquanto estiver acima de 30%.","Pergunte ao credor sobre quitar à vista com desconto."];
  }else if(i.id==="renda"){
    T.o="Mostra quanto da sua renda já está reservado para contas que vão chegar: parcelas, dívidas e contas fixas. É a parte do dinheiro que não é mais sua para decidir.";
    T.c=d.pct===null?"Para calcular, informe a sua renda mensal (ou anote os seus ganhos por alguns meses).":

    T.r="Até 30%: confortável. De 30% a 50%: apertado. Acima de 50%: a maior parte da renda já tem destino antes de o mês começar, e sobra pouco para viver e guardar.";
    T.p=st==="critico"?"A renda está muito amarrada. Evite novas parcelas e veja se alguma conta fixa pode ser reduzida ou renegociada.":st==="atencao"?"Está apertado. Um imprevisto pode forçar atraso; segure novos compromissos.":st==="ok"?"Sua renda tem folga. Dá para assumir objetivos com calma, sem se amarrar demais.":"Informe sua renda em Ajustes ou anote ganhos para ver este indicador.";
    T.b=["Antes de parcelar, some a nova parcela a este percentual: ela cabe abaixo de 30%?","Reveja assinaturas e planos: cada um é um pedaço fixo da renda.","Prefira prazos curtos: parcelas longas amarram a renda por muito tempo."];
  }else if(i.id==="custo"){
    T.o="É quanto custa manter a sua vida básica por mês: contas fixas (aluguel, luz, internet, assinaturas), a parte de cada mês das contas do ano (IPVA, IPTU) e as parcelas das dívidas. É o valor mínimo que precisa entrar todo mês, antes de comida e lazer.";
    T.c=d.custo===0?"Ainda não há contas fixas nem dívidas cadastradas para calcular.":
      "O seu básico custa <b>"+RB(d.custo)+"</b> por mês: <b>"+RB(d.fixM)+"</b> de contas fixas, <b>"+RB(d.anoM)+"</b> das contas do ano divididas por 12 e <b>"+RB(d.divM)+"</b> de parcelas e dívidas (média dos próximos 3 meses)."+(d.pct!==null?" Isso é <b>"+Math.round(d.pct)+"%</b> da sua renda de cerca de "+RB(d.renda)+".":"");
    T.r="Até 50% da renda: o básico cabe com folga para comida, imprevistos e guardar. De 50% a 70%: apertado. Acima de 70%: qualquer imprevisto vira dívida. Diferente de \"Quanto da renda já tem dono\", que olha só as contas que já vão chegar, aqui entra também a parte de cada mês das contas do ano.";
    T.p=st==="critico"?"O básico come quase toda a renda. Comece pelas contas fixas maiores: dá para trocar de plano, renegociar ou cortar?":st==="atencao"?"O básico está pesado. Antes de assumir uma nova conta fixa, veja se outra pode sair.":st==="ok"?"O seu básico cabe bem na renda. Use a folga para guardar e para as contas do ano.":"Informe a sua renda (ou anote seus ganhos) e cadastre as contas fixas para ver a comparação.";
    T.b=["Separe todo mês a parte das contas do ano (Planejar > Contas fixas > Contas do ano).","Reveja as assinaturas: some as pequenas, elas viram uma conta grande.","Quando uma dívida acabar, mande o valor da parcela para a reserva."];
  }else if(i.id==="destino"){
    T.o="Mostra para onde o seu dinheiro foi neste mês. Quase todo mundo se surpreende: gastos pequenos e frequentes costumam pesar mais que a grande compra.";
    T.c=d.sai===0?"Você ainda não anotou gastos neste mês.":
      "Neste mês você gastou <b>"+RB(d.sai)+"</b>. A maior fatia foi <b>"+esc(d.top)+"</b> (<b>"+RB(d.topV)+"</b>, "+Math.round(d.pTop)+"% dos gastos) e as 3 maiores juntas somam <b>"+Math.round(d.pTop3)+"%</b>."+(d.ent>0?" Entrou no mês: "+RB(d.ent)+".":"");
    T.r="Não há porcentagem certa: cada vida é diferente. Um alerta comum é uma categoria sozinha passar de 50% dos gastos; vale olhar com atenção. Compare com os seus objetivos e com as metas do mês.";
    T.p=st==="sem"?"Anote seus gastos para ver o retrato.":st==="atencao"?"Uma categoria concentra mais da metade dos gastos. Veja se é necessário mesmo ou se dá para reduzir.":"Os gastos estão distribuídos. Olhe a categoria que mais pesa e pergunte: isso me faz bem pelo que custa?";
    T.b=["Defina uma meta mensal para a categoria que mais pesa (Planejar > Metas do mês).","Procure gastos recorrentes pequenos: assinaturas esquecidas e taxas.","Anote todos os gastos, inclusive os pequenos."];
  }else if(i.id==="composicao"){
    T.o="Mostra de que o seu patrimônio é feito: dinheiro disponível, dinheiro guardado, bens (casa, carro) e valores a receber. O que importa é quanto disso vira dinheiro rápido se você precisar.";
    T.c=d.liq===null?"Ainda não há o que mostrar. Cadastre suas contas e bens.":
      "Do total de <b>"+RB(d.ativo)+"</b>: <b>"+RB(d.usar)+"</b> para usar, <b>"+RB(d.guard)+"</b> guardado, <b>"+RB(d.bens)+"</b> em bens e <b>"+RB(d.rec)+"</b> a receber. Em dinheiro (usar mais guardado) estão <b>"+Math.round(d.liq)+"%</b>.";
    T.r="Muita coisa em bens e pouco em dinheiro é um patrimônio engessado: vale muito no papel, mas não paga a conta de luz. Acima de 30% em dinheiro é um bom sinal; abaixo de 10% pede atenção.";
    T.p=st==="critico"?"O seu patrimônio está quase todo preso em bens ou valores a receber. Um imprevisto seria difícil de cobrir.":st==="atencao"?"Você tem algum dinheiro de fácil acesso, mas pouco diante do total. Aumentar a reserva ajuda.":st==="ok"?"Boa liquidez: você consegue lidar com imprevistos sem vender bens.":"Cadastre suas contas e bens para ver a composição.";
    T.b=["Aumente o dinheiro de fácil acesso antes de comprar novos bens.","Cobre quem te deve: valores a receber só viram dinheiro quando entram.","Mantenha parte do guardado numa caixinha de emergência."];
  }else if(i.id==="juros"){
    T.o="É quanto você pagou nos últimos 6 meses só de juros e multas. Esse dinheiro não compra nada: é o preço de atrasar ou de parcelar. Costuma ser o primeiro vazamento a tapar.";
    T.c=d.total===0?"Você não registrou juros nem multas nos últimos 6 meses. Excelente.":
      "Nos últimos 6 meses você pagou <b>"+RB(d.total)+"</b> de juros e multas, o que equivale a <b>"+n1(d.pct)+"%</b> do que recebeu no período.";
    T.r="Zero é o ideal. Até 3% da renda é atenção; acima disso os juros consomem o seu esforço. Só aparece aqui o que você anotou como juros ou multa ao pagar uma dívida.";
    T.p=st==="critico"?"Os juros estão pesando muito. Quitar ou renegociar a dívida mais cara tende a ser o melhor investimento que você pode fazer.":st==="atencao"?"Há custo de juros. Evite atrasos e veja se dá para quitar essa dívida antes.":"Sem custo de juros. Continue pagando em dia.";
    T.b=["Pague as contas em dia: a multa de um atraso costuma custar mais que o valor da conta.","Troque dívida cara por dívida mais barata, quando possível.","Ao pagar uma dívida, informe quanto foi de juros para este indicador ficar fiel."];
  }
  return T;
}

function cardIndicador(i){
  return '<article class="ind-card st-'+i.st+'"><div class="ind-top"><div><h3>'+esc(i.nome)+'</h3><p class="ind-sub">'+esc(i.pergunta)+'</p></div>'+selo(i.st)+'</div>'+
    '<div class="ind-val">'+esc(i.valor)+'</div><div class="ind-graf">'+i.graf+'</div><p class="ind-leit">'+esc(i.leitura)+'</p>'+
    '<button class="btn sec peq" data-a="relInd" data-id="'+i.id+'">Ler o relatório ›</button></article>';
}
/* um mês comparado com o anterior: totais e as categorias que mais mudaram */
function compMes(ym){
  var a=resumoMes(ym), b=resumoMes(ymMais(ym,-1)), ks={}, mud=[];
  Object.keys(a.porSai).concat(Object.keys(b.porSai)).forEach(function(k){ks[k]=1});
  Object.keys(ks).forEach(function(k){var va=a.porSai[k]||0, vb=b.porSai[k]||0; if(va!==vb)mud.push({nome:nomeCat(k),agora:va,antes:vb,dif:va-vb})});
  mud.sort(function(x,y){return Math.abs(y.dif)-Math.abs(x.dif)});
  return {ym:ym,ent:a.ent,sai:a.sai,sob:a.ent-a.sai,entA:b.ent,saiA:b.sai,sobA:b.ent-b.sai,tem:a.lanc.length>0,temA:b.lanc.length>0,mud:mud.slice(0,3)};
}
function pctTxt(agora,antes){if(!antes)return "";var p=Math.round((agora-antes)/antes*100); return p===0?"igual":(p>0?"+":"−")+Math.abs(p)+"%"}
function difTxt(v){return (v>0?"+":v<0?"−":"")+brl(Math.abs(v))}
function blocoMes(c,curto){
  var mes=MES[+c.ym.slice(5)-1], ant=MES[+ymMais(c.ym,-1).slice(5)-1];
  if(!c.tem)return '<p class="faint">Nada anotado em '+esc(mes)+'.</p>';
  var h='<div class="mm-tri"><div><span>'+esc(v("entrou"))+'</span><b>'+num(c.ent)+'</b></div><div><span>'+esc(v("saiu"))+'</span><b>'+num(c.sai)+'</b></div><div><span>'+esc(v("sobrou"))+'</span><b'+(c.sob<0?' class="neg"':'')+'>'+(c.sob<0?"−":"")+num(Math.abs(c.sob))+'</b></div></div>';
  if(!c.temA)return h+'<p class="faint">Ainda não há '+esc(ant)+' anotado para comparar.</p>';
  var gs=c.sai-c.saiA;
  h+='<p class="mm-frase">Comparado com '+esc(ant)+', você <b>'+(gs===0?'gastou o mesmo':gs<0?'gastou '+esc(brl(-gs))+' a menos':'gastou '+esc(brl(gs))+' a mais')+'</b>'+(c.saiA&&gs!==0?' ('+esc(pctTxt(c.sai,c.saiA))+')':'')+' e '+(c.sob>=c.sobA?'sobrou '+esc(brl(c.sob-c.sobA))+' a mais':'sobrou '+esc(brl(c.sobA-c.sob))+' a menos')+'.</p>';
  if(c.mud.length&&!curto)h+='<ul class="mm-mud">'+c.mud.map(function(m){return '<li><span>'+esc(m.nome)+'</span><b class="'+(m.dif>0?"mais":"menos")+'">'+esc(difTxt(m.dif))+(m.antes?' ('+esc(pctTxt(m.agora,m.antes))+')':' (novo)')+'</b></li>'}).join("")+'</ul>';
  return h;
}
var MM_OFF=-1;
function cardMesAMes(){
  var ym=ymMais(hojeISO().slice(0,7),MM_OFF), mes=MES[+ym.slice(5)-1];
  return '<article class="mm-card" id="cardMM"><div class="mesnav"><button data-a="mmMes" data-n="-1" aria-label="Mês anterior"'+(MM_OFF<=-12?" disabled":"")+'>‹</button><b>'+esc(mes)+(ym.slice(0,4)!==hojeISO().slice(0,4)?" de "+ym.slice(0,4):"")+'</b><button data-a="mmMes" data-n="1" aria-label="Próximo mês"'+(MM_OFF>=0?" disabled":"")+'>›</button></div>'+
    '<h3>Mês a mês</h3><p class="ind-sub">Como foi o mês comparado com o anterior?</p>'+blocoMes(compMes(ym))+'</article>';

/* no Início, nos 10 primeiros dias do mês: "outubro fechou" (some ao tocar em Entendi) */

function telaGraficos(){
  return capa("Seus números em imagens","Gráficos")+

function panoramaTexto(L,c){
  var com=L.filter(function(i){return i.st!=="sem"}).length;
  if(!com)return '<p>Ainda não há dados suficientes. Anote seus gastos e ganhos por alguns dias e informe o que você tem: os relatórios aparecem sozinhos.</p>';
  var cr=L.filter(function(i){return i.st==="critico"}), at=L.filter(function(i){return i.st==="atencao"});
  var s='<p>De <b>'+com+'</b> indicadores com dados, <b>'+c.ok+'</b> estão saudáveis, <b>'+c.atencao+'</b> pedem atenção e <b>'+c.critico+'</b> estão em alerta.</p>';
  if(cr.length)s+='<p>O ponto mais urgente é <b>'+esc(cr[0].nome)+'</b>. '+esc(cr[0].leitura)+' Comece por ele.</p>';
  else if(at.length)s+='<p>Nada em alerta. O que merece atenção agora é <b>'+esc(at[0].nome)+'</b>: '+esc(at[0].leitura)+'</p>';
  else s+='<p>Nenhum sinal de alerta. Mantenha o ritmo e continue anotando.</p>';
  return s;
}
function telaRel(){

function relatorioPlano(i){

/* ---------- TELA: GAVETAS ---------- */
var DIN_ABA="contas";
function telaContas(){
  var ativos=S.contas.filter(function(c){return c.tipo==="ativo"&&!c.pessoa&&!c.bem&&!c.inv}), pas=S.contas.filter(function(c){return c.tipo==="passivo"&&!c.pessoa});

function barras(por,total,cls){

      '<div class="trilho"><div style="width:'+pc.toFixed(1)+'%"></div></div></div>';
  }).join("");

function graficoEvolucao(){
  var hoje=hojeISO(), ymH=hoje.slice(0,7), i;
  var primeiro=ymH; S.lancamentos.forEach(function(l){var m=l.data.slice(0,7); if(m<primeiro)primeiro=m});
  var atras=0; while(atras<5&&ymMais(ymH,-(atras+1))>=primeiro)atras++;
  var plH=totais(hoje).pl, sobras=[];
  for(i=0;i<3;i++){var rr=resumoMes(ymMais(ymH,-i)); if(rr.lanc.length)sobras.push(rr.ent-rr.sai)}
  var media=sobras.length?Math.round(sobras.reduce(function(a,b){return a+b},0)/sobras.length):0;
  var pts=[];
  for(i=-atras;i<=6;i++){
    var ym2=ymMais(ymH,i), p=ym2.split("-").map(Number), fim=ym2+"-"+pad(ultimoDia(p[0],p[1]-1));
    pts.push({i:i,l:MES3[p[1]-1],pl:i<0?totais(fim).pl:i===0?plH:plH+media*i});
  }
  var W=320,H=176,pL=12,pR=12,pT=30,pB=26, vs=pts.map(function(q){return q.pl});
  var mn=Math.min.apply(null,vs.concat([0])), mx=Math.max.apply(null,vs.concat([1]));
  if(mn===mx){mn-=1;mx+=1}
  function X(k){return pL+k/(pts.length-1)*(W-pL-pR)}
  function Y(val){return pT+(H-pT-pB)-(val-mn)/(mx-mn)*(H-pT-pB)}
  var k0=atras, real=[], proj=[];
  pts.forEach(function(q,k){var s=X(k).toFixed(1)+","+Y(q.pl).toFixed(1); if(k<=k0)real.push(s); if(k>=k0)proj.push(s)});
  var s='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--rule2)" stroke-dasharray="3,3"/>'+
    '<line x1="'+X(k0).toFixed(1)+'" x2="'+X(k0).toFixed(1)+'" y1="'+(pT-6)+'" y2="'+(H-pB)+'" stroke="var(--latao)" stroke-width="1" stroke-dasharray="2,3"/>'+
    '<text x="'+(X(k0)+(k0<2?5:0)).toFixed(1)+'" y="'+(pT-10)+'" font-size="10" text-anchor="'+(k0<2?"start":"middle")+'" fill="var(--ouro)" font-weight="700">hoje: '+esc(brl(plH))+'</text>';
  if(real.length>1)s+='<path d="M'+real.join(" L")+'" fill="none" stroke="var(--ouro)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>';
  s+='<path d="M'+proj.join(" L")+'" fill="none" stroke="var(--ouro)" stroke-width="4" stroke-dasharray="1,8" stroke-linecap="round" opacity=".9"/>';
  pts.forEach(function(q,k){
    s+='<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(q.pl).toFixed(1)+'" r="'+(q.i===0?5:3.4)+'" fill="'+(q.fut?"var(--card)":"var(--ouro)")+'" stroke="var(--ouro)" stroke-width="2"/>'+
       '<text x="'+X(k).toFixed(1)+'" y="'+(H-8)+'" font-size="9.5" fill="var(--ink2)" text-anchor="middle">'+q.l+'</text>';
  });
  var last=pts[pts.length-1];
  s+='<text x="'+(W-pR)+'" y="14" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="end">em 6 meses: '+esc(brl(last.pl))+'</text>';
  var nota=sobras.length
    ? 'A linha pontilhada é uma <b>previsão</b>: se você continuar '+(media>=0?"sobrando":"gastando a mais")+' cerca de <b>'+esc(brl(Math.abs(media)))+'</b> por mês, o que é seu chega a <b>'+esc(brl(last.pl))+'</b> em 6 meses.'
    : 'Anote por um tempo e a linha pontilhada mostra para onde o que é seu está indo nos próximos 6 meses.';
  return '<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Do começo até 6 meses à frente">'+s+'</svg><p class="sub" style="margin-top:.4rem">'+nota+'</p>';
}

/* =====================================================================
   INVESTIMENTOS (D50, D58): aplicações (poupança, CDB, Tesouro, fundos) são
   contas "ativo" com c.inv = {taxa (% ao ano), banco (id da conta ligada),
   ate (até que dia o rendimento já foi calculado)}. O rendimento é calculado
   por DIA ÚTIL (sem fim de semana e feriado nacional), pela convenção de
   252 dias úteis no ano, e juntado numa anotação por mês ("Rendimento de
   novembro", categoria do sistema "Rendimentos", que é receita financeira).
   Caixinhas também podem render (x.taxa): o rendimento entra na conta onde o
   dinheiro da caixinha está e fica guardado nela.

function contasInvest(){return S.contas.filter(function(c){return c.tipo==="ativo"&&c.inv})}
function investidoTotal(){return contasInvest().reduce(function(s,c){return s+saldoConta(c)},0)}
var FER={};
function pascoa(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return y+"-"+pad(mes)+"-"+pad(dia);
}
/* feriados nacionais (os fixos e os que dependem da Páscoa: Carnaval, Sexta-feira Santa, Corpus Christi) */
function feriados(y){
  if(FER[y])return FER[y];
  var s={}, p=pascoa(y);
  ["01-01","04-21","05-01","09-07","10-12","11-02","11-15","11-20","12-25"].forEach(function(x){s[y+"-"+x]=1});
  [-48,-47,-2,60].forEach(function(n){s[addDias(p,n)]=1});
  return FER[y]=s;
}
function diaUtil(iso){var p=iso.split("-").map(Number), w=new Date(p[0],p[1]-1,p[2]).getDay(); return w!==0&&w!==6&&!feriados(p[0])[iso]}
function fatorDia(taxa){return Math.pow(1+taxa/100,1/252)-1}
function catSis(sis,nome,tipo){
  var k=S.categorias.filter(function(x){return x.sis===sis})[0];
  if(!k){k={id:uid(),nome:nome,tipo:tipo,sis:sis};S.categorias.push(k)}

function lerTaxa(v){var n=Number(String(v||"").replace(/[^\d,.]/g,"").replace(",","."));return isFinite(n)&&n>0?Math.min(100,Math.round(n*100)/100):0}
/* calcula o que rendeu desde a última vez, por dia útil, e lança no mês certo */
function atualizarRendimentos(){
  var hoje=hojeISO(), mudou=false, kr=null;
  function lancar(contaId,ym,v,dia,cx){
    if(v<=0)return;
    var l=S.lancamentos.filter(function(x){return x.rend===ym&&x.contaId===contaId&&x.tipo==="entrada"&&(x.rendCx||null)===(cx||null)})[0];
    if(l){l.valor+=v; if(dia>l.data)l.data=dia}
    else{
      kr=kr||catSis("rend","Rendimentos","receita");
      l={id:uid(),tipo:"entrada",valor:v,desc:(cx?"Rendimento da caixinha "+nomeCaixa(cx):"Rendimento")+" de "+MES[+ym.slice(5)-1],contaId:contaId,destinoId:null,catId:kr.id,data:dia,rend:ym};
      if(cx)l.rendCx=cx;
      S.lancamentos.push(l);
    }
    if(cx){
      var r=S.reservas.filter(function(x){return x.rend===ym&&x.para===cx&&x.de==="livre"})[0];
      if(r){r.valor+=v; if(dia>r.data)r.data=dia} else S.reservas.push({id:uid(),data:dia,de:"livre",para:cx,valor:v,conta:contaId,rend:ym});
    }
  }
  function rodar(obj,taxa,saldoNoDia,destino,cx){
    if(!obj.ate||obj.ate>hoje){obj.ate=hoje;mudou=true;return}
    if(obj.ate===hoje)return;
    if(!(taxa>0)||!destino){obj.ate=hoje;mudou=true;return}
    var f=fatorDia(taxa), d=obj.ate, extra=0, acc={}, ult={}, guarda=0;
    while(d<hoje&&guarda++<4000){
      d=addDias(d,1); if(!diaUtil(d))continue;
      var r=(saldoNoDia(d)+extra)*f; if(!(r>0))continue;
      extra+=r; var ym=d.slice(0,7); acc[ym]=(acc[ym]||0)+r; ult[ym]=d;
    }
    Object.keys(acc).sort().forEach(function(ym){lancar(destino,ym,Math.round(acc[ym]),ult[ym],cx)});
    obj.ate=hoje; mudou=true;
  }
  contasInvest().forEach(function(c){rodar(c.inv,c.inv.taxa,function(d){return saldoConta(c,d)},c.id,null)});
  S.caixas.forEach(function(x){
    if(!(x.taxa>0)){if(x.ate){delete x.ate;mudou=true}return}
    var bk=bucketsCaixa(x.id), cid=Object.keys(bk).filter(function(k){return bk[k]>0&&conta(k)}).sort(function(a,b){return bk[b]-bk[a]})[0]||null;
    var base=saldoCaixa(x.id);
    rodar(x,x.taxa,function(){return base},cid,x.id);
  });
  return mudou;
}

/* =====================================================================
   TRAVAS DE COERÊNCIA (D57): o app impede o que não pode acontecer na vida
   real (carteira negativa, passar do limite do cartão) e pergunta "era isso?"
   quando algo é possível mas estranho. Tudo antes de salvar.

/* quanto uma anotação muda o saldo de uma conta (mesma regra de saldoConta) */
function efeitoConta(l,c){
  if(!l||!c)return 0; var d=0;
  if(l.tipo==="saida"&&l.contaId===c.id)d=-l.valor;
  else if(l.tipo==="entrada"&&l.contaId===c.id)d=l.valor;
  else if(l.tipo==="ajuste"&&l.contaId===c.id)d=l.sinal==="alta"?l.valor:-l.valor;
  else if(l.tipo==="transferencia"||l.tipo==="bem"){if(l.destinoId===c.id)d=l.valor; else if(l.contaId===c.id)d=-l.valor}
  return c.tipo==="ativo"?d:-d;
}
/* saldo de c se as anotações "antes" forem trocadas pelas "depois" */
function saldoApos(c,antes,depois){
  var s=saldoConta(c);
  (antes||[]).forEach(function(l){s-=efeitoConta(l,c)});
  (depois||[]).forEach(function(l){s+=efeitoConta(l,c)});
  return s;
}

  abrirModal('<div class="trava"><div class="trava-r">'+rostoPerg()+'</div><div><p class="q">'+(pode?'Confira antes de salvar':'Não dá para salvar assim')+'</p>'+

    (pode?'<button class="btn" data-a="mFechar">Corrigir</button><button class="btn sec" data-a="fConfirma">Sim, está certo</button>':'<button class="btn" data-a="mFechar">Corrigir</button>'),"trava-j");
}
function valorEstranho(tipo,valor){

  if(vs.length<5)return false;

  return valor>100000&&valor>20*med;
}
/* devolve {impede:[...], avisa:[...]} para a anotação nova l (e a antiga, se for alteração) */
function conferirAnotacao(l,extra,antiga){
  var antes=antiga?[antiga]:[], depois=[l].concat(extra?[extra]:[]), imp=[], av=[];
  var envolvidas=[conta(l.contaId),conta(l.destinoId)].filter(Boolean);
  envolvidas.forEach(function(c){

function salvarFolha(){
  if(!F.cent){toast("Diga quanto foi");$("#fValor").focus();return}
  if(F.tipo==="transferencia"){
    if(!F.destinoId||F.destinoId===F.contaId){toast("Escolha duas contas diferentes");return}
  }else if(F.tipo==="bem"){
    if(!F.destinoId||!conta(F.destinoId)){toast("Escolha o bem ou crie um novo");return}
  }else if(!F.catId){toast("Escolha uma categoria");return}
  if(!RE_DATA.test(F.data)){toast("Escolha uma data válida");return}
  if(F.juros>0&&F.juros>=F.cent){toast("Os juros precisam ser menores que o valor pago");return}
  if(F.salvando)return; F.salvando=true;
  var l={id:F.id||uid(),tipo:F.tipo,valor:F.cent,desc:F.desc.trim(),contaId:F.contaId,
    destinoId:(F.tipo==="transferencia"||F.tipo==="bem")?F.destinoId:null,catId:(F.tipo==="transferencia"||F.tipo==="bem")?null:F.catId,data:F.data};
  if(F.tipo==="bem"){var pbm=gerarParcelas(F.contaId,F.data,F.cent,F.n); if(pbm)l.parcelas=pbm}
  if(F.tipo==="saida"){var ps=gerarParcelas(F.contaId,F.data,F.cent,F.n); if(ps)l.parcelas=ps; if(F.caixaId)l.caixaId=F.caixaId; if(F.fixaId){l.fixaId=F.fixaId;l.ref=F.ref}}
  var extra=null, dj=conta(F.destinoId);
  if(F.tipo==="transferencia"&&F.juros>0&&dj&&dj.tipo==="passivo"){
    l.valor=F.cent-F.juros;
    extra={id:uid(),tipo:"saida",valor:F.juros,desc:"Juros e multa — "+(F.desc.trim()||dj.nome),contaId:F.contaId,destinoId:null,catId:jurosCat().id,data:F.data};
  }
  var i=-1; S.lancamentos.forEach(function(x,k){if(x.id===l.id)i=k});
  var cf=conferirAnotacao(l,extra,i>=0?S.lancamentos[i]:null);
  if(cf.impede.length){F.salvando=false; janelaTrava(cf.impede,false); return}
  if(cf.avisa.length&&!F.confirmado){F.salvando=false; janelaTrava(cf.avisa,true); return}
  F.confirmado=false;
  if(i>=0)S.lancamentos[i]=l; else S.lancamentos.push(l);
  if(extra)S.lancamentos.push(extra);
  salvar(); ULTIMO=l.id; WOB=true;
  var fim=function(){var u=ULTIMO; fecharFolha(); toast(i>=0?"Alterado!":"Pronto, anotado!"); ULTIMO=u; desenhar()};
  if(calmo()){fim();return}
  var pagou=(l.tipo==="transferencia"&&dj&&dj.tipo==="passivo")||(l.tipo==="saida"&&!!l.fixaId);
  if(i<0&&l.tipo==="entrada")momento("moeda"); else if(i<0&&pagou)momento("selo"); else carimbo(i>=0?"ALTERADO":"ANOTADO");
  moedaFio();
  setTimeout(fim,800);
}

function mesesAte(de,ate){var a=de.split("-").map(Number), b=ate.split("-").map(Number); return (b[0]*12+b[1])-(a[0]*12+a[1])}
function contasDoAno(){
  var ym=hojeISO().slice(0,7);
  return S.fixas.filter(function(f){return f.freq==="anual"}).map(function(f){
    var oc=ocorrencias(f,ym,ymMais(ym,12)).filter(function(o){return !fixaPaga(f,o.ref)})[0];
    if(!oc)return null;
    var cx=S.caixas.filter(function(x){return norm(x.nome)===norm(f.nome)})[0], tem=cx?saldoCaixa(cx.id):0;
    var falta=Math.max(0,f.valor-tem), meses=mesesAte(ym,oc.ref);
    var porMes=falta===0?0:meses>0?Math.ceil(falta/meses/100)*100:falta;
    return {f:f,data:oc.data,meses:meses,cx:cx||null,tem:tem,falta:falta,porMes:porMes};
  }).filter(Boolean).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:0});
}

function calcSim(){
  var el=$("#sRes"); if(!el)return;
  var c=conta(SIM.contaId), pa=$("#sParc"); if(pa)pa.hidden=!(c&&c.tipo==="passivo");

  var R=rendaMedia(), n=c.tipo==="passivo"?SIM.n:1, total=(n>1&&SIM.total>SIM.cent)?SIM.total:SIM.cent;
  var ps=c.tipo==="passivo"?gerarParcelas(c.id,hojeISO(),total,n):[{data:hojeISO(),valor:total}];
  var meses=comprometidoMeses(12), nova=meses.map(function(){return 0});

  var sem=meses.map(function(m){return m.div+m.fix}), com=sem.map(function(x,i){return x+nova[i]});

  function Y(val){return pT+(H-pT-pB)*(1-val/topo)}

  meses.forEach(function(m,i){

    if(nova[i]>0)s+='<rect x="'+x.toFixed(1)+'" y="'+Y(sem[i]+nova[i]).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(0,Y(sem[i])-Y(sem[i]+nova[i])).toFixed(1)+'" style="fill:var(--latao)"/>';
    s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" font-size="9" text-anchor="middle" style="fill:var(--ink2)">'+MES3[+m.ym.slice(5)-1]+'</text>';
  });
  if(R>0)s+='<line x1="8" x2="'+(W-8)+'" y1="'+Y(R).toFixed(1)+'" y2="'+Y(R).toFixed(1)+'" style="stroke:var(--in)" stroke-width="1.6" stroke-dasharray="5,4"/><text x="'+(W-8)+'" y="'+(Y(R)-4).toFixed(1)+'" font-size="9.5" text-anchor="end" style="fill:var(--in)">sua renda</text>';
  var li='';
  if(n>1)li+='<li>'+n+' parcelas de <b>'+esc(brl(Math.round(total/n)))+'</b> (total '+esc(brl(total))+').</li>';
  if(total>SIM.cent&&n>1){var tx=taxaMensal(SIM.cent,total/n,n); li+='<li>Juros embutidos: <b>'+esc(brl(total-SIM.cent))+'</b>, cerca de <b>'+(tx*100).toFixed(1).replace(".",",")+'% ao mês</b>.</li>'}
  li+=SIM.bem?'<li>O que é seu <b>não cai hoje</b>: o dinheiro vira um bem, que vai perdendo valor com o tempo. Mesmo assim as parcelas pesam no mês.</li>':'<li>O que é seu cai <b>'+esc(brl(total))+'</b>: a compra é um gasto.</li>';
  var sem1="";
  if(R>0){
    var pp=pico/R*100, cls=pp<30?"ok":pp<50?"at":"ru", tx2=pp<30?"Tranquilo":pp<50?"Atenção":"Aperta o orçamento";
    sem1='<div class="semaforo '+cls+'"><span class="pt" style="background:currentColor"></span><span>'+tx2+': no mês mais apertado, '+Math.round(pp)+'% da sua renda já estaria destinada a contas e parcelas.</span></div>';
    li+='<li>Peso médio nos 12 meses: de <b>'+Math.round(mSem/R*100)+'%</b> para <b>'+Math.round(mCom/R*100)+'%</b> da renda.</li>';
    li+='<li>Sobra livre por mês (média): de <b>'+esc(brl(R-mSem))+'</b> para <b>'+esc(brl(R-mCom))+'</b>.</li>';
  }else sem1='<div class="semaforo at"><span>Informe sua renda por mês acima para eu calcular o peso disso.</span></div>';

function guardarCopia(){
  var txt=JSON.stringify({app:"caderneta",versao:2,appVersao:VERSAO_APP,dados:S},null,1), nome="balancete-"+hojeISO()+".json";
  function marcar(){S.config.ultimoBackup=hojeISO();salvar();toast("Cópia guardada!");desenhar()}
  function baixar(){
    try{
      var a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
      a.download=nome; document.body.appendChild(a); a.click(); a.remove(); marcar();
    }catch(e){toast("Não consegui gerar o arquivo aqui")}
  }
  try{
    var f=new File([txt],nome,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"Cópia do Balancete"}).then(marcar).catch(function(e){if(!e||e.name!=="AbortError")baixar()});
      return;
    }
  }catch(e){}
  baixar();
}
function lerCopia(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      if(!ehObj(p)||p.app!=="caderneta"||!ehObj(p.dados))throw 0;
      var h=higienizar(p.dados);
      if(!h.contas.length&&!h.lancamentos.length)throw 0;
      confirmar("Isso troca tudo que está neste aparelho pelo conteúdo da cópia."+(h.perdidos?" ("+h.perdidos+" item(ns) com problema serão ignorados.)":"")+" Continuar?","Sim, recuperar",function(){
        S.contas=h.contas;S.categorias=h.categorias;S.lancamentos=h.lancamentos;S.fixas=h.fixas;S.caixas=h.caixas;S.reservas=h.reservas;S.config.pronto=true;
        atualizarBens(); salvar(); toast("Dados recuperados!"); ir("inicio");
      });
    }catch(e){toast("Esse arquivo não é uma cópia do Balancete")}
  };
  r.readAsText(file);
}

    var finLivre=!!fin&&!S.lancamentos.some(function(l){return l.contaId===fin.id||l.destinoId===fin.id});

      :"Apagar "+b.nome+"?";
    if(finLivre)txt+=" A dívida “"+fin.nome+"” (sem nenhum pagamento) também será apagada.";

      S.lancamentos=S.lancamentos.filter(function(l){return l.contaId!==id&&l.destinoId!==id});

    var fx=S.fixas.filter(function(x){return x.contaId===id});
    var rs=S.reservas.filter(function(x){return x.conta===id});
    var txt=ls.length||fx.length||rs.length
      ?"Apagar a conta "+c.nome+(ls.length?" e as "+ls.length+" anotações ligadas a ela (gastos, ganhos, transferências)":"")+(fx.length?(ls.length?" e ":" e as ")+fx.length+" contas fixas que saem dela":"")+(rs.length?" e o dinheiro guardado em caixinhas que estava nela":"")+"? É como se essa conta nunca tivesse existido: o saldo das outras contas muda junto, porque as transferências de e para ela também somem."
      :"Apagar a conta "+c.nome+"?";
    confirmar(txt,"Apagar tudo",function(){
      var sn=foto();
      S.lancamentos=S.lancamentos.filter(function(l){return l.contaId!==id&&l.destinoId!==id});
      S.fixas=S.fixas.filter(function(x){return x.contaId!==id});
      S.reservas=S.reservas.filter(function(x){return x.conta!==id});

    S.config[d.g]=val; salvar(); aplicarConfig(); desenhar();
  },

    if(!DESF)return; var d=JSON.parse(DESF); DESF=null;
    S.contas=d.contas;S.categorias=d.categorias;S.lancamentos=d.lancamentos;S.fixas=d.fixas;S.caixas=d.caixas;S.reservas=d.reservas;
    atualizarBens(); salvar(); desenhar(); toast("Voltou como estava");
  },

    var NL=String.fromCharCode(10);
    var t="Balancete (teste "+VERSAO_APP+")"+NL+"O que aconteceu / o que sugiro:"+NL+NL+NL+"---"+NL+"Aparelho: "+(navigator.userAgent||"").slice(0,120);
    if(navigator.share){navigator.share({title:"Balancete: minha opinião",text:t}).catch(function(){});return}
    try{navigator.clipboard.writeText(t).then(function(){toast("Texto copiado. Cole numa mensagem para mim.")},function(){toast("Não consegui copiar aqui")})}catch(e){toast("Não consegui copiar aqui")}

      [["oCarteira","Dinheiro"],["oBanco","Conta no banco"],["oPoup","Investimento"]].forEach(function(x,i){var c=cent(document.getElementById(x[0]));if(c>0||i===0)O.guardados.push({nome:x[1],c:c,carteira:i===0,inv:i===2,taxa:i===2?lerTaxa((document.getElementById("oTaxa")||{}).value):0})});
    }
    O.passo++; desenharOnb();
  },
  oCartao:function(d){O.cartao=d.s==="1";document.getElementById("oCartaoCampos").hidden=!O.cartao;document.querySelectorAll('[data-a="oCartao"]').forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.s===d.s))})},

};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]"); if(!b||b.disabled)return;
  var fn=ACOES[b.dataset.a]; if(fn)fn(b.dataset,b);
});
document.addEventListener("change",function(e){
  if(e.target.id==="arquivo"&&e.target.files&&e.target.files[0]){lerCopia(e.target.files[0]);e.target.value=""}
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="anPeriodo"||id==="anConta"||id==="anCat"){
    if(id==="anPeriodo")AN.periodo=e.target.value; else if(id==="anConta")AN.conta=e.target.value; else AN.cat=e.target.value;
    AN.n=15; pintarAnot();
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if($("#modalFundo").classList.contains("on"))fecharModal(); else if(FOLHA_ABERTA)fecharFolha() }
});

carregar();
atualizarBens();
aplicarConfig();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(e){}
if(S.config.pronto&&S.contas.length)ir("inicio"); else iniciarOnb();
var pr=$("#pergRosto"); if(pr)pr.innerHTML=rostoPerg();
var spTira=function(){var sp=$("#splash"); if(sp)sp.remove()};
setTimeout(spTira,calmo()?1200:4100);
if($("#splash"))$("#splash").addEventListener("click",spTira);   /* tocar pula a abertura */

})();
