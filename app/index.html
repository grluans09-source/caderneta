<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balancete</title>
<meta name="description" content="Suas finanças em ordem, sem complicação. Seus dados ficam só no seu celular.">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balancete">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--serif:'Times New Roman',Times,'Noto Serif','Liberation Serif',serif;
  --bg:#F8F5EE; --card:#FFFFFF; --ink:#111111; --ink2:#44413B; --ink3:#5F5B52; --rule:#E6DFCD; --rule2:#C8BC98;
  --in:#1E3A8A; --in-bg:#E4E9F7; --out:#9B1C2E; --out-bg:#F6E0E3; --tr:#4B5675; --tr-bg:#E6E8F0;
  --ouro:#7A5C0E; --ouro-bg:#F5EBC8; --latao:#C9A227; --capa:#0A0A0A; --capa-ink:#F5EFDF;
  --btn:#0A0A0A; --btn-ink:#F5EFDF; --sel:#F6EBC6; --selbg:#111111; --selink:#F5E6A8; --margem:#C9A227; --shadow:0 2px 10px rgba(0,0,0,.08);
  --am:#6B4E9B; --cobre:#B26A3C; --gasto-bg:#9B1C2E; --ganho-bg:#1E3A8A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --bg:#070707; --card:#131313; --ink:#F3EEDD; --ink2:#CBC5B2; --ink3:#9D9784; --rule:#2A2619; --rule2:#4D4428;
    --in:#93ABF5; --in-bg:#1B2440; --out:#F08A98; --out-bg:#34191F; --tr:#AEB8D6; --tr-bg:#1F2538;
    --ouro:#E2B945; --ouro-bg:#2E2710; --latao:#E2B945; --capa:#000000; --capa-ink:#F3EEDD;
    --btn:#E2B945; --btn-ink:#0A0A0A; --sel:#2A2310; --selbg:#F3EEDD; --selink:#0A0A0A; --margem:#E2B945; --shadow:none;
    --am:#A98BD6; --cobre:#CC8A56; --gasto-bg:#C8465A; --ganho-bg:#4D7BC4;
  }
}
:root[data-tema="escuro"]{
  --bg:#070707; --card:#131313; --ink:#F3EEDD; --ink2:#CBC5B2; --ink3:#9D9784; --rule:#2A2619; --rule2:#4D4428;
  --in:#93ABF5; --in-bg:#1B2440; --out:#F08A98; --out-bg:#34191F; --tr:#AEB8D6; --tr-bg:#1F2538;
  --ouro:#E2B945; --ouro-bg:#2E2710; --latao:#E2B945; --capa:#000000; --capa-ink:#F3EEDD;
  --btn:#E2B945; --btn-ink:#0A0A0A; --sel:#2A2310; --selbg:#F3EEDD; --selink:#0A0A0A; --margem:#E2B945; --shadow:none;
  --am:#A98BD6; --cobre:#CC8A56; --gasto-bg:#C8465A; --ganho-bg:#4D7BC4;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-tam="g"]{font-size:19px}
html[data-tam="gg"]{font-size:22px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-variant-numeric:lining-nums tabular-nums;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;
  padding-bottom:calc(9.5rem + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--in);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:32rem;margin:0 auto;padding:0 1rem;position:relative;isolation:isolate}
.wrap:before{content:"";position:absolute;left:.5rem;top:0;bottom:0;width:1px;background:var(--margem);opacity:.45;z-index:-1}
#tela{padding-top:0}
.serif{font-family:var(--serif)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:.25rem;font-family:var(--serif)}
h2{font-size:1.05rem;font-weight:700;margin:1.5rem 0 .55rem;font-family:var(--serif);letter-spacing:.01em;padding-bottom:.25rem;border-bottom:1px solid var(--rule2)}
.sub{color:var(--ink2);font-size:.95rem}
.faint{color:var(--ink3);font-size:.88rem}

/* capa de livro */
.capa{margin:0 -1rem;background:var(--capa);color:var(--capa-ink);padding:.7rem 1rem .75rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:3px solid var(--latao)}
.capa span{font-size:.82rem;opacity:.85}
.capa h1{font-family:var(--serif);font-size:1.25rem;font-weight:400;letter-spacing:.02em}
.lead{margin:.9rem 0 0}

/* cartões e papel */
.card{background:var(--card);border:1px solid var(--rule);border-radius:.8rem;padding:1rem;box-shadow:var(--shadow)}
.hero{text-align:center;padding:.4rem 0 0;margin-top:.6rem}
.hero .rot{color:var(--ouro);font-weight:700;font-size:.95rem;letter-spacing:.03em}
.hero .grande{font-family:var(--serif);font-size:min(2.7rem,calc((100vw - 2rem)/8.5));font-weight:700;color:var(--ouro);line-height:1.1;margin:.1rem 0;white-space:nowrap}
.hero .grande.neg{color:var(--out)}
.hero .eq{font-size:.88rem;color:var(--ink2)}
.bal{width:100%;max-width:21rem;height:auto;display:block;margin:.2rem auto 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bal .md-cab{transform-box:fill-box;transform-origin:50% 50%}
.bal.rev .md-cab{animation:mdRev 1.4s cubic-bezier(.45,0,.25,1)}
@keyframes mdRev{0%,100%{transform:none}35%,62%{transform:translateY(6px) scale(.965)}}
.bal .md-olho{transform-box:fill-box;transform-origin:50% 50%;animation:mdPisca 5.5s infinite}
@keyframes mdPisca{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.bal .md-ref{animation:mdRef 7s ease-in-out infinite}
@keyframes mdRef{0%,60%{transform:translateX(0)}100%{transform:translateX(150px)}}
/* aba Investir */
.inv-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;text-align:center}
.inv-res span{display:block;font-size:.78rem;color:var(--ink2)}.inv-res b{font-family:var(--serif);font-size:1.08rem}
html[data-tam="gg"] .inv-res{grid-template-columns:1fr}
.inv-c{border-left:5px solid var(--am)}
.inv-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.inv-n{display:block;font-family:var(--serif);font-size:1.12rem}.inv-t{display:block;font-size:.85rem;color:var(--ink2)}.inv-t em{font-style:normal;color:var(--out)}
.inv-v{font-family:var(--serif);font-size:1.25rem;white-space:nowrap}
html[data-tam="gg"] .inv-top{flex-direction:column}
.inv-acoes{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}.inv-acoes .btn{margin:0}
.inv-cx{display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.65rem 0;border-bottom:1px solid var(--rule)}.inv-cx:last-child{border-bottom:0}
.inv-cx i{display:block;font-style:normal;font-size:.82rem;color:var(--ink2)}.inv-cx>b{font-family:var(--serif);white-space:nowrap}
/* janela das travas: o Mordomo explica com calma */
.trava{display:grid;grid-template-columns:3.4rem 1fr;gap:.8rem;align-items:start}
.trava-r svg{width:3.4rem;height:3.4rem;overflow:visible}
.trava-m{margin:.35rem 0;line-height:1.45}
.modal.trava-j{border-top-color:var(--latao)}
/* pílula "Perguntar" (D55/D56): canto esquerdo, simétrica à pena */
.perg{position:fixed;left:1rem;bottom:calc(4.95rem + env(safe-area-inset-bottom));z-index:21;display:flex;align-items:center;gap:.35rem;min-height:3.3rem;background:#0A0A0A;border:2px solid var(--latao);border-radius:999px;padding:.2rem 1rem .2rem .25rem;color:#E8CB6A;font-family:var(--serif);font-weight:700;font-size:1.02rem;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.3)}
.perg:active{transform:scale(.95)}
.perg-r svg{display:block;width:2.75rem;height:2.75rem;overflow:visible}
.perg .pp-cab{transform-box:fill-box;transform-origin:50% 50%}
.perg .pp-pup{transform-box:fill-box;transform-origin:50% 50%;transition:transform .4s}
.perg.r-nod .pp-cab{animation:mdRev 1.4s cubic-bezier(.45,0,.25,1)}
.perg.r-baixo .pp-pup{transform:translate(-2px,2.6px)}
.perg.r-cima .pp-pup{transform:translate(2px,-2.8px)}
.perg.r-le .pp-pup{animation:ppLe 1.6s ease-in-out}
@keyframes ppLe{0%,100%{transform:none}25%,65%{transform:translateX(-2.6px)}45%,85%{transform:translateX(2.6px)}}
.perg-bal{position:fixed;left:1rem;bottom:calc(8.9rem + env(safe-area-inset-bottom));z-index:21;max-width:min(15rem,70vw);background:#0A0A0A;color:#F5EFDF;border:2px solid var(--latao);border-radius:1rem 1rem 1rem .3rem;padding:.45rem .8rem;font-family:var(--serif);font-size:.95rem;font-weight:700;opacity:0;transform:translateY(6px) scale(.9);transform-origin:0 100%;transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.perg-bal.on{opacity:1;transform:none}
html[data-tam="gg"] .perg .perg-t{display:none}html[data-tam="gg"] .perg{padding:.2rem}
/* janela do chat (preta e dourada, como o acerto de contas) */
.ch-cab{display:flex;align-items:center;gap:.55rem}
.ch-cab svg{width:2.9rem;height:2.9rem;flex:none;overflow:visible}
.ch-cab b{display:block;font-family:var(--serif);color:#E8CB6A;font-size:1.15rem}
.ch-cab span{font-size:.78rem;color:#CFC6AD}
.ch-msgs{max-height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:.45rem;padding:.5rem 0;margin-bottom:.4rem}
.ch-m{max-width:88%;padding:.55rem .8rem;border-radius:1rem;font-size:.95rem;line-height:1.4}
.ch-m.ele{background:#1E1C17;border:1px solid #3A3426;align-self:flex-start;border-bottom-left-radius:.3rem;color:#F5EFDF}
.ch-m.eu{background:#C9A227;color:#0A0A0A;align-self:flex-end;font-weight:700;border-bottom-right-radius:.3rem}
.ch-m b{color:#E8CB6A}.ch-m.eu b{color:#0A0A0A}
.ch-m i{color:#B9B09A}
.ch-ul{margin:.35rem 0;padding-left:1.1rem}.ch-ul li{margin:.15rem 0}
.ch-ir{display:block;margin-top:.45rem;min-height:2.6rem;padding:.3rem .9rem;border:2px solid #E8CB6A;border-radius:999px;color:#E8CB6A;font-weight:800;font-family:var(--serif)}
.chatm .ch-busca input{width:100%;min-height:3rem;border-radius:999px;border:2px solid #5A4A1E;background:#141310;color:#F5EFDF;padding:.4rem 1rem;font-size:1rem}
.chatm .ch-busca input:focus{border-color:#E8CB6A;outline:none}
.chatm .ch-grupos{margin:.5rem 0}
.chatm .chip{background:transparent;color:#F5EFDF;border-color:#E8CB6A;box-shadow:none}
.chatm .chip[aria-pressed="true"]{background:#E8CB6A;color:#0A0A0A}
.ch-tit{font-size:.82rem;color:#CFC6AD;margin:.3rem 0}
.ch-q{display:block;width:100%;text-align:left;min-height:2.9rem;padding:.55rem .8rem;margin:.3rem 0;border:1px solid #3A3426;border-left:4px solid #C9A227;border-radius:.8rem;background:#141310;color:#F5EFDF;font-size:.95rem}
.ch-q:active{background:#1E1C17}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* mascotes secundários: aparecem só em momentos especiais */
.momento{position:fixed;left:50%;top:40%;z-index:91;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none;animation:mSai .45s 1.9s ease forwards}
.momento svg{width:6.2rem;height:6.8rem;overflow:visible;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.momento b{background:#0A0A0A;color:#F5EFDF;border:2px solid var(--latao);border-radius:999px;padding:.4rem 1rem;font-family:var(--serif);font-size:1rem;white-space:nowrap;opacity:0;animation:mTxt .4s .7s ease forwards}
.momento.m-cai svg{animation:mCai .9s cubic-bezier(.3,1.25,.5,1) both}
@keyframes mCai{0%{transform:translateY(-45vh) rotateY(0)}75%{transform:translateY(8px) rotateY(1080deg)}100%{transform:none}}
.momento.m-desce svg{animation:mDesce .8s cubic-bezier(.3,1.3,.5,1) both}
@keyframes mDesce{0%{transform:translateY(-40vh)}70%{transform:translateY(6px) scaleY(.94)}100%{transform:none}}
.momento.m-sela svg{animation:mSela .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes mSela{0%{opacity:0;transform:scale(2.2) rotate(-14deg)}60%{opacity:1;transform:scale(.9) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-14deg)}}
@keyframes mTxt{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mSai{to{opacity:0;visibility:hidden}}
.pesao{position:fixed;left:.8rem;right:.8rem;bottom:calc(9.6rem + env(safe-area-inset-bottom));z-index:22;max-width:30rem;margin:0 auto;display:grid;grid-template-columns:3.4rem 1fr;gap:.6rem;align-items:center;background:#0A0A0A;color:#F5EFDF;border:2px solid var(--latao);border-radius:1.1rem;padding:.55rem .7rem;box-shadow:0 10px 24px rgba(0,0,0,.35);animation:pChega 1.4s cubic-bezier(.2,.8,.3,1) both}
.pesao svg{width:3.4rem;height:3.7rem;overflow:visible}
.pesao p{margin:0 0 .4rem;font-family:var(--serif);font-size:.98rem;line-height:1.25}
.pesao .acoes{display:flex;gap:.4rem;flex-wrap:wrap}
.pesao .btn{margin:0;min-height:2.75rem;width:auto;padding:.3rem .8rem;font-size:.88rem}
.pesao .btn.sec{background:transparent;color:#E8CB6A;border-color:#E8CB6A}
@keyframes pChega{from{transform:translateX(110%)}to{transform:none}}
html[data-tam="gg"] .pesao{grid-template-columns:1fr}html[data-tam="gg"] .pesao svg{display:none}
.bal .linha{stroke:var(--ink)}
.beam{transform-origin:160px 62px}.pA{transform-origin:52px 68px}.pB{transform-origin:268px 68px}
.bal:not(.wob) .beam{animation:sw 7s ease-in-out infinite alternate}
.bal:not(.wob) .pA,.bal:not(.wob) .pB{animation:sw2 7s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}
@keyframes sw2{from{transform:rotate(.9deg)}to{transform:rotate(-.9deg)}}
.moed{animation:cai .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cai{from{transform:translateY(-46px);opacity:0}to{transform:none;opacity:1}}
.wob .beam{animation:bw 2.4s ease-out}.wob .pA,.wob .pB{animation:pa 2.4s ease-out}
@keyframes bw{0%{transform:rotate(-7deg)}25%{transform:rotate(5deg)}50%{transform:rotate(-2.5deg)}75%{transform:rotate(1deg)}100%{transform:rotate(0)}}
@keyframes pa{0%{transform:rotate(7deg)}25%{transform:rotate(-5deg)}50%{transform:rotate(2.5deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
.tri{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:3px double var(--ink);margin:.9rem 0 .3rem}
.tri div{padding:.55rem .25rem;text-align:center;border-left:1px solid var(--rule2)}
.tri div:first-child{border-left:0}
.tri span{display:block;font-size:.8rem;color:var(--ink2)}
.tri b{display:block;font-family:var(--serif);font-weight:400;font-size:1.02rem;margin-top:.1rem;word-break:break-word}
.tri .e b{color:var(--in)} .tri .s b{color:var(--out)}

.alerta{display:flex;gap:.7rem;align-items:center;width:100%;border-radius:.6rem;padding:.8rem .9rem;margin-top:.6rem;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--latao)}
.alerta.ruim{border-left-color:var(--out);background:var(--out-bg)}
.alerta b{display:block}
.alerta span{font-size:.9rem;color:var(--ink2)}

/* linhas do livro */
.lista{display:flex;flex-direction:column}
.lanc{display:flex;align-items:center;gap:.6rem;width:100%;padding:.7rem .1rem;border-bottom:1px solid var(--rule);min-height:3.5rem}
.lanc:last-child{border-bottom:0}
.dia{width:2.6rem;text-align:center;flex:none}
.dia b{display:block;font-size:1.15rem;font-family:var(--serif);font-weight:400;line-height:1}
.dia i{font-style:normal;font-size:.72rem;color:var(--ink3);text-transform:uppercase}
.txt{min-width:0;flex:0 1 auto;max-width:62%}
.txt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt i{font-style:normal;font-size:.84rem;color:var(--ink2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gaveta .txt i{white-space:normal}
.pont{flex:1;min-width:.6rem;border-bottom:2px dotted var(--rule2);align-self:flex-end;margin-bottom:.9rem}
.vl{font-weight:700;white-space:nowrap;font-family:var(--serif)}
.vl.in{color:var(--in)} .vl.out{color:var(--out)} .vl.tr{color:var(--tr)}
.vazio{text-align:center;color:var(--ink2);padding:1.4rem .5rem}
.vazio b{display:block;color:var(--ink);margin-bottom:.2rem}
.novo-lin{animation:rin .55s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* botões */
.btn{display:block;width:100%;min-height:3.25rem;border-radius:.7rem;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:1.05rem;text-align:center;padding:.8rem 1rem;margin-top:.7rem;letter-spacing:.01em}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--rule2)}
.btn.perigo{background:var(--out-bg);color:var(--out)}
.btn.peq{display:inline-block;width:auto;min-height:2.75rem;padding:.5rem 1rem;font-size:.95rem;margin-top:.5rem}
.link{color:var(--in);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:2.75rem;padding:.5rem 0;display:inline-block}

/* navegação: capa preta com ouro */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--capa);border-top:3px solid var(--latao);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .in{max-width:32rem;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr 1fr 1fr 1fr;align-items:end}
nav button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0 .5rem;font-size:.66rem;color:var(--capa-ink);opacity:.78;min-height:3.6rem;text-align:center}
nav button[aria-current="page"]{opacity:1;font-weight:700;color:var(--latao)}
nav svg{width:1.6rem;height:1.6rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{align-items:center;opacity:1}
.fab span.b{display:grid;place-items:center;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--latao);color:#0A0A0A;margin-top:-1.5rem;border:3px solid var(--capa);box-shadow:0 4px 12px rgba(0,0,0,.35);font-size:2rem;line-height:1;font-weight:400;transition:transform .15s}
.fab:active span.b{transform:scale(.92)}
nav .in{position:relative}
.fab em{font-style:normal;font-weight:700;color:var(--capa-ink)}

/* folha (anotar) */
.folha{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:none;padding-bottom:3rem}
.folha.on{display:block;animation:abre .22s ease-out}
@keyframes abre{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.folha .wrap{padding-top:0}
.acoes{margin-top:1.1rem}
.acoes .btn{margin-top:0}
.volta{min-height:2.75rem;min-width:2.75rem;display:grid;place-items:center;font-size:1.5rem;color:var(--capa-ink);margin-left:-.6rem}
.capa.f{align-items:center;justify-content:flex-start}
.capa.f h1{flex:1}
.seg3{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem;margin-top:.9rem}
.seg3 button{min-height:3.4rem;border-radius:.7rem;border:2px solid var(--rule2);background:var(--card);text-align:center;font-weight:700;font-size:.95rem;padding:.4rem .2rem}
.seg3 button[aria-pressed="true"].s{background:var(--out-bg);border-color:var(--out);color:var(--out)}
.seg3 button[aria-pressed="true"].e{background:var(--in-bg);border-color:var(--in);color:var(--in)}
.seg3 button[aria-pressed="true"].t{background:var(--tr-bg);border-color:var(--tr);color:var(--tr)}
.rot{display:block;font-weight:700;margin:1.1rem 0 .4rem}
.dinheiro{width:100%;font-family:var(--serif);font-size:2.4rem;font-weight:700;border:0;border-bottom:3px double var(--ink);background:transparent;padding:.2rem 0;text-align:center;border-radius:0}
.dinheiro.s{color:var(--out)} .dinheiro.e{color:var(--in)} .dinheiro.t{color:var(--tr)}
.dinheiro::placeholder{color:var(--ink3);opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
/* Planejar: uma cor, um significado. Bordô = sai/dívida · ardósia = compromisso fixo · safira = entra · ametista = guardado · cobre = compra de bem */
.ferr.f-metas{border-left-color:var(--out)}
.ferr.f-caixinhas{border-left-color:var(--am)}
.ferr.f-fixas{border-left-color:var(--tr)}
.ferr.f-simulador{border-left-color:var(--cobre)}
.card.pagar{border-left:5px solid var(--out)}
.pagar .it.k-divida{border-left:3px solid var(--out);padding-left:.5rem}
.pagar .it.k-fixa{border-left:3px solid var(--tr);padding-left:.5rem}
.ag{border-left:5px solid var(--rule2);padding-left:.5rem;margin-left:-.5rem}
.ag.k-divida{border-left-color:var(--out)}
.ag.k-fixa{border-left-color:var(--tr)}
.ag.k-receber{border-left-color:var(--in)}
.ag.u-breve .dia{background:var(--out-bg);border-radius:.4rem;padding:.15rem 0}
.ag.u-agora .dia{background:var(--out);color:#fff;border-radius:.4rem;padding:.15rem 0}
.ag.u-agora .dia i{color:#fff}
.ag.k-receber.u-breve .dia{background:var(--in-bg)}
.ag.k-receber.u-agora .dia{background:var(--in)}
.legenda-ag{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin:-.2rem 0 .5rem;font-size:.82rem;color:var(--ink2)}
.legenda-ag .lg{display:inline-flex;align-items:center;gap:.35rem}
.legenda-ag .lg:before{content:"";width:.9rem;height:.45rem;border-radius:.25rem;background:var(--rule2)}
.legenda-ag .k-divida:before{background:var(--out)}
.legenda-ag .k-fixa:before{background:var(--tr)}
.legenda-ag .k-receber:before{background:var(--in)}
/* Anotar em dois toques: o botão da pena abre 4 bolinhas, uma por tipo de anotação */
.fab span.b{transition:transform .3s ease}
.fab.aberto span.b{transform:rotate(45deg)}
/* folha: 3 bolinhas para trocar de tipo */
.capa.f h1{font-size:1.2rem}
/* folha: listas curtas e busca */
.bcol{width:100%;min-height:2.4rem;padding:.35rem .6rem;border:2px solid var(--rule2);border-radius:.6rem;background:var(--card);color:var(--ink);font-size:.85rem}
.lc{display:flex;flex-direction:column;gap:.5rem}
.tc>div .link{align-self:flex-start;font-size:.82rem;margin-top:.1rem}
html[data-tam="gg"] .tc>div .bcol{font-size:.8rem}
/* conta Dinheiro: contagem de cédulas */
.ceds{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .8rem;margin-top:.7rem}
.ced{display:flex;flex-direction:column;gap:.15rem}
.ced-v{font-family:var(--serif);font-weight:700}
.ced .passo{gap:.35rem}
.ced .passo button{width:2.7rem;height:2.7rem;font-size:1.3rem}
.ced .passo b{min-width:2.2rem}
html[data-tam="g"] .ceds,html[data-tam="gg"] .ceds{grid-template-columns:1fr}
.ferrs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.8rem 0 .2rem}
.ferr{display:flex;flex-direction:column;gap:.15rem;min-height:4.2rem;padding:.65rem .8rem;border-radius:.8rem;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--latao);box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.ferr b{font-family:var(--serif);font-size:1rem}
.ferr span{font-size:.8rem;color:var(--ink2)}
html[data-tam="gg"] .ferrs{grid-template-columns:1fr}
.abas-din{margin:.8rem 0 .2rem;flex-wrap:nowrap;gap:.35rem}
.abas-din .chip{min-width:0;padding:.55rem .3rem;font-size:.9rem}
html[data-tam="g"] .abas-din,html[data-tam="gg"] .abas-din{flex-wrap:wrap}
.gaveta .txt b{white-space:normal}
.abas-din .chip{flex:1 1 auto;text-align:center}
.grupo{font-family:var(--serif,inherit);font-size:1.15rem;letter-spacing:.04em;margin:1.8rem 0 .2rem;padding-bottom:.35rem;border-bottom:2px solid var(--latao)}
.linha-falta{margin-top:.9rem}
.chip{min-height:2.9rem;padding:.55rem .95rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--ink);border-color:var(--latao);box-shadow:inset 0 0 0 1px var(--latao);font-weight:700}
.chip.novo{border-style:dashed;color:var(--in)}
.campo{margin-top:.9rem}
.campo label{display:block;font-weight:700;margin-bottom:.35rem}
.campo input,.campo select{width:100%;min-height:3.1rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.5rem .8rem;background:var(--card)}
.passo{display:flex;align-items:center;gap:1rem}
.passo button{width:3rem;height:3rem;border-radius:50%;border:2px solid var(--rule2);background:var(--card);font-size:1.5rem;text-align:center;font-weight:700}
.passo b{font-size:1.2rem;min-width:5rem;text-align:center}
.prev{background:var(--card);border:1px dashed var(--ink3);border-radius:.6rem;padding:.8rem .9rem;margin-top:1.1rem;font-size:.95rem;color:var(--ink2)}
.prev b{color:var(--ink)}
.prev .parc{display:flex;justify-content:space-between;padding:.15rem 0;font-variant-numeric:tabular-nums}

/* conta em T: de onde saiu | para onde foi */
.tt{position:relative;margin-top:1rem}
.th{display:grid;grid-template-columns:1fr 1fr;font-size:.72rem;letter-spacing:.07em;font-weight:700;color:var(--ink2);border-bottom:3px double var(--ink);padding-bottom:.35rem;text-align:center;text-transform:uppercase}
.tc{display:grid;grid-template-columns:1fr 1fr;position:relative}
.tc>div{display:flex;flex-direction:column;gap:.5rem;padding:.7rem .4rem}
.tc>div:first-child{border-right:1px solid var(--ink)}
.colrot{display:none;font-size:.75rem;letter-spacing:.07em;font-weight:700;color:var(--ink2);text-transform:uppercase}
.opt{display:block;width:100%;min-height:3.1rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.5rem .6rem;background:var(--card);font-weight:600;font-size:.95rem;line-height:1.25;position:relative;z-index:1}
.opt small{display:block;font-weight:400;color:var(--ink3);font-size:.78rem}
.opt[aria-pressed="true"]{border-color:var(--latao);background:var(--sel);box-shadow:inset 0 0 0 1px var(--latao)}
.opt.novo{border-style:dashed;color:var(--in);background:transparent}
.lnk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.lnk path{stroke:var(--latao);stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:var(--L,0);stroke-dashoffset:var(--L,0);animation:dr .55s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.moeda{position:absolute;left:0;top:0;margin:-.4rem 0 0 -.4rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--latao);border:2px solid #7a5c14;pointer-events:none;z-index:2}
html[data-tam="gg"] .th{display:none}
html[data-tam="gg"] .colrot{display:block}
html[data-tam="gg"] .tc{grid-template-columns:1fr}
html[data-tam="gg"] .tc>div:first-child{border-right:0;border-bottom:1px solid var(--ink)}
html[data-tam="gg"] .lnk{display:none}

/* carimbo */
.carimbo{position:fixed;left:50%;top:45%;z-index:90;border:4px solid var(--out);color:var(--out);padding:.35rem 1.1rem;font-family:var(--serif);letter-spacing:.14em;font-size:1.7rem;font-weight:700;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg);background:rgba(244,238,220,.82);border-radius:.3rem}
.carimbo.on{animation:car 1.1s ease-out}
@keyframes car{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.3)}20%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}

/* contas */
.gaveta{display:flex;align-items:center;gap:.75rem;width:100%;padding:.8rem 0;border-bottom:1px solid var(--rule);min-height:3.6rem}
.gaveta:last-child{border-bottom:0}
.marca{width:.65rem;height:2.4rem;border-radius:.2rem;background:var(--in);flex:none}
.marca.pas{background:var(--out)}
.gaveta .vl{font-size:1.02rem}
.cartao{background:var(--card);border:1px solid var(--rule);border-radius:.8rem;padding:1rem;margin-bottom:.7rem;box-shadow:var(--shadow)}
.cartao .t{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.cartao .t b{font-size:1.05rem;font-family:var(--serif)}
.barra-lim{height:.7rem;background:var(--rule);border-radius:.2rem;overflow:hidden;margin:.6rem 0 .3rem}
.barra-lim div{height:100%;background:var(--tr);transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.barra-lim div.alto{background:var(--out)}
.linhas3{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink2)}
.linhas3 b{display:block;color:var(--ink);font-size:.98rem;font-family:var(--serif)}

/* relatórios */
.mes{display:flex;align-items:center;justify-content:space-between;margin:.9rem 0 .5rem}
.mes button{min-width:3rem;min-height:3rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);font-size:1.3rem;text-align:center}
.mes b{font-size:1.15rem;font-family:var(--serif);font-weight:400}
.mes b::first-letter{text-transform:uppercase}
.vira-d{animation:vd .38s ease-out}.vira-e{animation:ve .38s ease-out}
@keyframes vd{from{opacity:0;transform:translateX(26px) rotateY(-12deg)}to{opacity:1;transform:none}}
@keyframes ve{from{opacity:0;transform:translateX(-26px) rotateY(12deg)}to{opacity:1;transform:none}}
.barra{margin:.7rem 0}
.barra .top{display:flex;justify-content:space-between;gap:.5rem;font-size:.95rem}
.trilho{height:.6rem;background:var(--rule);border-radius:.15rem;margin-top:.3rem;overflow:hidden}
.trilho div{height:100%;transition:width .8s cubic-bezier(.3,1.2,.5,1);animation:enche .9s ease-out}
@keyframes enche{from{width:0!important}}
.barra.s .trilho div{background:var(--out)} .barra.e .trilho div{background:var(--in)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.45rem .2rem;border-bottom:1px solid var(--rule)}
th{text-align:left;color:var(--ink2);font-weight:600;font-size:.8rem}
td:nth-child(n+2),th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
.confere{margin-top:.7rem;padding:.6rem .8rem;border-radius:.5rem;background:var(--in-bg);color:var(--in);font-weight:600;font-size:.92rem}
.confere.erro{background:var(--out-bg);color:var(--out)}
svg.grafico{width:100%;height:auto;display:block}

/* ajustes */
.opc{display:flex;gap:.45rem}
.opc button{flex:1;min-height:3rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);text-align:center;font-weight:700}
.opc button[aria-pressed="true"]{background:var(--sel);color:var(--ink);border-color:var(--latao);box-shadow:inset 0 0 0 1px var(--latao);font-weight:700}
.linha-sw{display:flex;align-items:center;gap:1rem;justify-content:space-between;min-height:3.2rem}
.sw{position:relative;width:3.4rem;height:2rem;border-radius:2rem;background:var(--rule2);flex:none;border:0}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-pressed="true"]{background:var(--latao)}
.sw[aria-pressed="true"]::after{left:1.6rem}
.item{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:3.2rem;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item small{color:var(--ink3)}
.linha-f{display:grid;grid-template-columns:1.3fr 1fr 3rem;gap:.4rem;margin-bottom:.45rem;align-items:center}
.linha-f input{width:100%;min-height:3.1rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.4rem .6rem;background:var(--card)}
.linha-f .x{min-height:3rem;border-radius:.6rem;border:2px solid var(--rule2);background:var(--card);font-size:1.3rem;text-align:center}

/* modal, toast, primeiros passos */
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal-fundo.on{display:flex}
.modal{background:var(--bg);width:100%;max-width:32rem;border-radius:1rem 1rem 0 0;padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;border-top:3px solid var(--latao);animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal p.q{font-size:1.1rem;font-weight:700;margin-bottom:.5rem;font-family:var(--serif)}
.toast{position:fixed;left:50%;bottom:calc(5.7rem + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--capa);color:var(--capa-ink);padding:.75rem 1.1rem;border-radius:.6rem;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center;border:1px solid var(--latao)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.beta{font-size:.55em;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:.4rem;padding:.05rem .35rem;vertical-align:middle;opacity:.85}
.toast.com-botao{pointer-events:auto}
.toast-desf{margin-left:.5rem;min-height:2.75rem;padding:0 1rem;border-radius:.5rem;border:1px solid var(--latao);background:var(--latao);color:var(--capa);font:inherit;font-weight:700;cursor:pointer}
.onb{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;display:none;padding-bottom:3rem}
.onb.on{display:block}
.fino{height:.35rem;background:var(--rule);border-radius:.2rem;margin:1rem 0;overflow:hidden}
.fino div{height:100%;background:var(--latao);transition:width .4s}
/* frase na capa */
.capa.grande{display:block}
.capa .topo-capa{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.capa .topo-capa span{font-size:.82rem;opacity:.85}
.capa .topo-capa h1{font-size:1.1rem}
.frase{display:block;width:100%;margin-top:.5rem;text-align:left;font-family:var(--serif);font-style:italic;font-size:1rem;line-height:1.35;min-height:3.2rem;color:var(--capa-ink)}
.frase cite{display:block;font-style:normal;font-size:.8rem;color:var(--latao);margin-top:.25rem;font-family:system-ui,sans-serif}
.frase.troca{animation:rin .5s ease-out}
.volta2{display:inline-grid;place-items:center;min-width:2.5rem;min-height:2.5rem;font-size:1.3rem;color:var(--capa-ink);margin:-.4rem .1rem -.4rem -.6rem;vertical-align:middle}
/* balança viva */
.legenda{display:flex;flex-wrap:wrap;gap:.3rem .9rem;justify-content:center;font-size:.85rem;color:var(--ink2);margin:.1rem 0}
.legenda b{color:var(--ink);font-family:var(--serif);font-weight:400}
.pt{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.3rem;vertical-align:-.05rem}
.pt.g{background:#4D7BC4}.pt.r{background:#C8465A}.pt.o{background:#E8C14F}
.como{display:inline-block;color:var(--in);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:2.5rem;padding:.4rem .2rem;font-size:.9rem}
/* potes de vidro (caixinhas) */
.jarras{display:flex;flex-wrap:wrap;gap:.8rem .5rem;margin:.3rem 0}
.jarw{width:calc(25% - .4rem);min-width:4.6rem;text-align:center;font-size:.78rem;color:var(--ink2);min-height:2.75rem}
.jarw b{display:block;color:var(--ink);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jar{width:3.4rem;height:4.4rem;margin:0 auto .25rem;border:2px solid var(--ink);border-radius:.4rem .4rem 1.1rem 1.1rem;overflow:hidden;position:relative;background:var(--card)}
.jar .w{position:absolute;left:-60%;width:220%;height:220%;border-radius:38%;background:#4D7BC4;opacity:.88;animation:giro 7s linear infinite;transition:top .9s cubic-bezier(.3,1.4,.5,1)}
.jar .w.am{background:#D9A93A}.jar .w.vm{background:#C8465A}.jar .w.az{background:#5A86C9}
@keyframes giro{to{transform:rotate(360deg)}}
/* agenda e atalhos */
.ag{border-bottom:1px solid var(--rule);padding-bottom:.5rem}
.ag:last-child{border-bottom:0}
.ag .lanc{border-bottom:0;padding-bottom:.2rem;cursor:default}
.ag .bts{display:flex;gap:.5rem;flex-wrap:wrap;padding-left:3.2rem}
.atalho{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:.8rem;padding:.9rem 1rem;margin-bottom:.55rem;min-height:4rem;box-shadow:var(--shadow)}
.atalho b{display:block;font-family:var(--serif);font-size:1.05rem}
.atalho span{display:block;font-size:.86rem;color:var(--ink2)}
.atalho i{font-style:normal;font-size:1.6rem;color:var(--latao)}
.barra2{display:flex;height:.8rem;border-radius:.2rem;overflow:hidden;background:var(--rule);margin:.5rem 0}
.barra2 div{height:100%;transition:width .8s cubic-bezier(.3,1.2,.5,1)}
.semaforo{display:flex;align-items:center;gap:.6rem;border-radius:.6rem;padding:.7rem .8rem;margin:.7rem 0;font-weight:600}
.semaforo.ok{background:var(--tr-bg);color:var(--tr)}.semaforo.at{background:var(--ouro-bg);color:var(--ouro)}.semaforo.ru{background:var(--out-bg);color:var(--out)}
.res li{margin:.35rem 0 .35rem 1.1rem;font-size:.95rem}
.res{padding:0;list-style:disc}
.pt.b{background:#CC8A56}
.marca.bem{background:#CC8A56}
.seg3 button[aria-pressed="true"].b{background:var(--ouro-bg);border-color:var(--ouro);color:var(--ouro)}
.pagar .rot2{font-weight:700;color:var(--ink2);font-size:.95rem}
.pagar .gr{font-family:var(--serif);font-size:2.1rem;font-weight:700;color:var(--out);line-height:1.15;margin:.1rem 0}
.pagar .gr.zero{color:var(--tr)}
.pagar .it{display:flex;justify-content:space-between;gap:.6rem;font-size:.92rem;padding:.3rem 0;border-bottom:1px solid var(--rule)}
.pagar .it:last-of-type{border-bottom:0}
.pagar .it b{white-space:nowrap;font-family:var(--serif)}
.pagar .it em{font-style:normal;color:var(--out);font-size:.8rem;font-weight:700}
.pt.q{background:#A98BD6}
.cofre{width:4.4rem;height:3.9rem;display:block;margin:0 auto .25rem;animation:flutua 3.4s ease-in-out infinite alternate;overflow:visible}
@keyframes flutua{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.cofre .cai{animation:caiMoeda 4.2s ease-in infinite}
@keyframes caiMoeda{0%{transform:translateY(-24px);opacity:0}14%{opacity:1}40%{transform:translateY(6px);opacity:1}48%{opacity:0}100%{transform:translateY(6px);opacity:0}}
.cofre .brilho{animation:pisca 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pisca{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.linha-cx{display:flex;align-items:center;gap:.8rem}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:-.2rem 0 .5rem}
.mesnav button{min-width:2.9rem;min-height:2.9rem;border:2px solid var(--rule2);border-radius:.6rem;background:var(--card);font-size:1.4rem;text-align:center}
.mesnav button:disabled{opacity:.3}
.mesnav b{font-family:var(--serif);font-weight:400;font-size:1.05rem}
.mesnav b::first-letter{text-transform:uppercase}
.busca input{width:100%;min-height:3.1rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.5rem .9rem;background:var(--card);font-size:1rem}
.filtros{margin-top:.6rem}
.filtros .chips{margin:.3rem 0 .6rem}
.chip.sm{min-height:2.6rem;padding:.3rem .8rem;font-size:.9rem}
.filtros select{width:100%;min-height:3rem;border:2px solid var(--rule2);border-radius:.6rem;padding:.4rem .7rem;background:var(--card);margin-bottom:.6rem}
.filtros label{display:block;font-weight:700;margin:.2rem 0 .3rem;font-size:.92rem}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
html.calmo *,html.calmo *:before{animation:none!important;transition:none!important}
/* ===== Jeitos de usar ===== */

/* ===== Preto, dourado e branco: o que é clicável aparece em ouro ou com contorno de ouro; o que está selecionado fica preto ===== */
.btn{background:linear-gradient(#EAD27A,#C9A227);color:#0A0A0A;border:1px solid #8A6D12;box-shadow:0 2px 0 #8A6D12,0 5px 12px rgba(0,0,0,.18);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #8A6D12}

/* ===== Visual vivo: formas gordinhas e redondas, ícones cheios e movimento com propósito ===== */
/* --- bolinhas do + : as regras de baixo (quarto de círculo a partir do canto direito) valem no lugar destas --- */
.fabmenu{--R:7.2rem;position:fixed;inset:0;z-index:19;pointer-events:none}

.fabfundo{position:absolute;inset:0;background:rgba(7,7,7,.62);opacity:0;transition:opacity .25s}
.fabmenu.on .fabfundo{opacity:1}
.fabarco{position:absolute;left:50%;bottom:calc(3.5rem + env(safe-area-inset-bottom));width:0;height:0}
.fabmenu.emfolha .fabarco{bottom:calc(2.8rem + env(safe-area-inset-bottom))}
.fb{position:absolute;left:0;top:0;width:3.6rem;height:3.6rem;margin:-1.8rem 0 0 -1.8rem;padding:0;background:none;border:0;color:#fff;transform:translate(0,0) scale(.15) rotate(-90deg);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.55,.5,1) var(--d),opacity .18s var(--d)}
.fabmenu.on .fb{transform:translate(calc(var(--cx) * var(--R)),calc(var(--cy) * var(--R) * -1)) scale(1) rotate(0);opacity:1;pointer-events:auto}

.fbc{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:4px solid #fff;font-size:1.9rem;font-weight:800;line-height:1;box-shadow:0 6px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.4)}

.fb-gasto .fbc{background:var(--gasto-bg)}.fb-ganho .fbc{background:var(--ganho-bg)}.fb-transf .fbc{background:var(--tr)}.fb-bem .fbc{background:var(--cobre)}

/* --- movimento: tela que entra, cartões que sobem, gráficos que crescem --- */

html[data-tam="gg"] .mm-tri{grid-template-columns:1fr}
.mm-frase{margin:.4rem 0}
.mm-mud{list-style:none;padding:0;margin:.3rem 0 0}
.mm-mud li{display:flex;justify-content:space-between;gap:.6rem;padding:.35rem 0;border-top:1px solid var(--rule);font-size:.92rem}
.mm-mud b.mais{color:var(--out)}.mm-mud b.menos{color:var(--in)}
.mm-card{background:var(--card);border:1px solid var(--rule2);border-top:5px solid var(--latao);border-radius:1.25rem;padding:.9rem;margin-top:.9rem;box-shadow:var(--shadow)}
.mm-card h3{font-family:var(--serif);font-size:1.1rem;margin:.2rem 0 0}
.mm-card .mesnav{margin-bottom:.4rem}
.fechou{border-left:5px solid var(--latao)}
.fechou-t{display:block;font-family:var(--serif);font-size:1.1rem}
/* dica de instalar */
.dica-inst{border-left:5px solid var(--latao)}
.dica-inst p{margin:.35rem 0}
.dica-inst .btn.peq{margin-right:.4rem}
/* acerto de contas em janela por cima da tela, preta e dourada como o cartão */
.modal.acm{background:#0A0A0A;color:#F5EFDF;border-top:3px solid var(--latao)}
.acm-topo{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.4rem}
.acm-t{font-family:var(--serif);font-size:1.15rem;color:#E8CB6A;margin:0;border:0;padding:0}
.acm-t:before,.acm-t:after{display:none}
.acm-x{min-height:2.75rem;padding:0 1rem;border-radius:999px;border:2px solid #E8CB6A;color:#E8CB6A;font-weight:800;flex:none}
.acm .card.pagar{background:transparent;border:0;box-shadow:none;padding:0;margin:0}
.acm .ac-lista{background:transparent;color:#F5EFDF;padding:0;border-radius:0}
.acm .ac-row{border-bottom:1px solid rgba(232,203,106,.25)}
.acm .ac-row.k-divida{border-left-color:#F29090}.acm .ac-row.k-fixa{border-left-color:#AEB8D6}
.acm .ac-t span{color:#B9B09A}.acm .ac-t em{color:#F29090}
.acm .ac-v{color:#F29090}.acm .ac-pagas .ac-v{color:#B9B09A}
.acm .ac-pagas .ac-t b:before{content:"✓ ";color:#E8CB6A}
/* ===== botão de anotar (a pena) no canto direito de baixo, logo acima da barra; bolinhas em quarto de círculo (esquerda e para cima) ===== */
nav .in{grid-template-columns:repeat(7,1fr)}
.fab{position:fixed;right:1rem;bottom:calc(4.7rem + env(safe-area-inset-bottom));z-index:21;display:flex;flex-direction:row;align-items:center;gap:.5rem;padding:0;opacity:1}
.fab span.b{margin-top:0}
/* o botão de anotar é a pena num medalhão de ouro (D55); aberto, vira um "×" */
.fab span.b{background:none;border:0;padding:0;width:3.9rem;height:3.9rem;box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.35)}
.fab .pena{display:block;width:100%;height:100%;overflow:visible}
.fab .pena-x{opacity:0;transition:opacity .2s}
.fab .pena-i{transform-box:fill-box;transform-origin:50% 50%;transition:opacity .2s,transform .3s}
.fab.aberto span.b{transform:none!important}
.fab.aberto .pena-i{opacity:0;transform:scale(.6) rotate(-30deg)}
.fab.aberto .pena-x{opacity:1}
.fab:active span.b{transform:scale(.92)}
.fabmenu{--R:8.5rem}
html[data-tam="g"] .fabmenu{--R:8rem}
html[data-tam="gg"] .fabmenu{--R:7.2rem}
.fabarco{left:auto;right:calc(1rem + 1.95rem);bottom:calc(4.7rem + 1.95rem + env(safe-area-inset-bottom))}
.fabmenu.emfolha .fabarco{right:calc(1rem + 1.9rem);bottom:calc(1rem + 1.9rem + env(safe-area-inset-bottom))}
.fbl{top:50%;left:auto;right:100%;transform:translateY(-50%);margin:0 .55rem 0 0;text-align:right}
.fb-bem .fbl{top:auto;bottom:100%;right:0;transform:none;margin:0 0 .45rem 0}
.dock{left:auto;right:1rem;margin-left:0}
html[data-tam="gg"] .fbl{font-size:.68rem;max-width:4.4rem}
html[data-tam="g"] .fbl{max-width:4.8rem}
</style>
</head>

<script>
(function(){
"use strict";

/* =====================================================================
   BALANCETE (antes chamado Caderneta) — finanças pessoais com partida dobrada por trás.
   Todos os valores em CENTAVOS (inteiros) para nunca errar contas.
   ===================================================================== */

/* ---------- utilidades ---------- */
var KEY="caderneta:v2";
/* versão do app (siga o CHANGELOG.md; subir junto com VERSAO em sw.js e "version" em package.json) */
var VERSAO_APP="1.20.0-beta.1";
var RE_ID=/^[A-Za-z0-9_-]+$/, RE_DATA=/^\d{4}-\d{2}-\d{2}$/;
var MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ehObj(x){return !!x&&typeof x==="object"&&!Array.isArray(x)}
function $(s){return document.querySelector(s)}

function num(c){return (Math.abs(c)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function brl(c){return (c<0?"−":"")+"R$ "+num(c)}
function pad(n){return String(n).padStart(2,"0")}
function isoDe(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hojeISO(){return isoDe(new Date())}
function dataBR(iso){return iso.split("-").reverse().join("/")}
function ultimoDia(ano,mes0){return new Date(ano,mes0+1,0).getDate()}

/* soma n meses mantendo o dia, limitado ao último dia do mês (31/jan+1 = 28/fev) */
function addMes(iso,n){
  var p=iso.split("-").map(Number), t=p[1]-1+n;
  var ano=p[0]+Math.floor(t/12), mes=((t%12)+12)%12;
  return ano+"-"+pad(mes+1)+"-"+pad(Math.min(p[2],ultimoDia(ano,mes)));
}
function addDias(iso,n){var p=iso.split("-").map(Number);return isoDe(new Date(p[0],p[1]-1,p[2]+n))}
function diasAte(iso){
  var a=hojeISO().split("-").map(Number), b=iso.split("-").map(Number);
  return Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/864e5);
}

/* divide em n parcelas em centavos; a sobra fica na última (soma sempre fecha) */
function dividir(total,n){
  var base=Math.floor(total/n), arr=[], i;
  for(i=0;i<n-1;i++)arr.push(base);
  arr.push(total-base*(n-1));
  return arr;
}

/* ---------- ciclo do cartão ---------- */
function proximoFechamento(compra,fecha){
  var p=compra.split("-").map(Number), ano=p[0], mes=p[1]-1, dia=p[2];
  var fe=Math.min(fecha,ultimoDia(ano,mes));
  if(dia<=fe)return ano+"-"+pad(mes+1)+"-"+pad(fe);
  mes++; if(mes>11){mes=0;ano++}
  return ano+"-"+pad(mes+1)+"-"+pad(Math.min(fecha,ultimoDia(ano,mes)));
}
function primeiroVencimento(compra,fecha,vence){
  var f=proximoFechamento(compra,fecha).split("-").map(Number);
  var ano=f[0], mes=f[1]-1+(vence>fecha?0:1);
  if(mes>11){mes=0;ano++}
  return ano+"-"+pad(mes+1)+"-"+pad(Math.min(vence,ultimoDia(ano,mes)));
}

/* ---------- dados ---------- */
var S={contas:[],categorias:[],lancamentos:[],fixas:[],caixas:[],reservas:[],
  config:{tamanho:"m",tema:"auto",contador:false,ultimoBackup:null,pronto:false,movimento:"vivo",renda:0,sobraRef:null,favoritas:[],favCats:[]}};

/* valida qualquer dado vindo do armazenamento ou de um backup */
var CARTEIRA_NOVA=false, INV_NOVA=false;
function higienizar(p){
  var out={contas:[],categorias:[],lancamentos:[],fixas:[],caixas:[],reservas:[],perdidos:0};
  function id(x){return typeof x==="string"&&RE_ID.test(x)}
  function cent(x){var n=Math.round(Number(x));return isFinite(n)?n:NaN}
  (Array.isArray(p.contas)?p.contas:[]).forEach(function(c){
    if(!ehObj(c)||!id(c.id)||typeof c.nome!=="string"||(c.tipo!=="ativo"&&c.tipo!=="passivo")){out.perdidos++;return}
    var n={id:c.id,nome:c.nome,tipo:c.tipo,inicial:cent(c.inicial)||0};
    ["fecha","vence"].forEach(function(k){var d=parseInt(c[k],10);if(d>=1&&d<=31)n[k]=d});
    if(cent(c.limite)>0)n.limite=cent(c.limite);
    if(c.pessoa===true)n.pessoa=true;
    if(c.carteira===true&&c.tipo==="ativo"&&c.pessoa!==true&&c.bem!==true){
      n.carteira=true;
      if(ehObj(c.cedulas)){var ce={};[200,100,50,20,10,5,2].forEach(function(v){var q=parseInt(c.cedulas[v],10);if(q>0&&q<=9999)ce[v]=q});if(Object.keys(ce).length)n.cedulas=ce}
      if(typeof c.contagem==="string"&&RE_DATA.test(c.contagem))n.contagem=c.contagem;
    }
    if(c.bem===true&&c.tipo==="ativo"){
      n.bem=true; var tx=Number(c.taxa); if(isFinite(tx)&&tx!==0)n.taxa=Math.max(-100,Math.min(100,Math.round(tx*10)/10));
      ["desde","ajustadoAte"].forEach(function(k){if(typeof c[k]==="string"&&/^\d{4}-\d{2}$/.test(c[k]))n[k]=c[k]});
    }
    if(typeof c.cobrar==="string"&&RE_DATA.test(c.cobrar))n.cobrar=c.cobrar;
    if(typeof c.conferido==="string"&&RE_DATA.test(c.conferido))n.conferido=c.conferido;
    if(ehObj(c.inv)&&c.tipo==="ativo"&&c.pessoa!==true&&c.bem!==true&&c.carteira!==true){
      var itx=Number(c.inv.taxa);
      n.inv={taxa:isFinite(itx)?Math.max(0,Math.min(100,Math.round(itx*100)/100)):0,banco:id(c.inv.banco)?c.inv.banco:null,ate:(typeof c.inv.ate==="string"&&RE_DATA.test(c.inv.ate))?c.inv.ate:null};
    }
    if(c.tipo==="passivo"&&Array.isArray(c.abertas)){
      var ab=c.abertas.filter(function(a){return ehObj(a)&&cent(a.valor)>0&&(a.data==null||(typeof a.data==="string"&&RE_DATA.test(a.data)))})
        .map(function(a){return {data:a.data||null,valor:cent(a.valor)}});
      if(ab.length){n.abertas=ab; n.inicial=ab.reduce(function(s,a){return s+a.valor},0)}
    }
    out.contas.push(n);
  });
  marcarCarteira(out.contas);
  out.contas.forEach(function(c){if(c.tipo==="ativo"&&!c.inv&&!c.pessoa&&!c.bem&&!c.carteira&&norm(c.nome)==="poupanca"){c.inv={taxa:0,banco:null,ate:null};INV_NOVA=true}});
  (Array.isArray(p.categorias)?p.categorias:[]).forEach(function(c){
    if(!ehObj(c)||!id(c.id)||typeof c.nome!=="string"||(c.tipo!=="despesa"&&c.tipo!=="receita")){out.perdidos++;return}
    var kn={id:c.id,nome:c.nome,tipo:c.tipo};
    if(["conf","rend","invtax"].indexOf(c.sis)>=0)kn.sis=c.sis;
    if(c.tipo==="despesa"&&cent(c.meta)>0)kn.meta=cent(c.meta);
    out.categorias.push(kn);
  });
  (Array.isArray(p.lancamentos)?p.lancamentos:[]).forEach(function(l){
    var val=ehObj(l)?cent(l.valor):NaN;
    if(!ehObj(l)||!id(l.id)||["saida","entrada","transferencia","bem","ajuste"].indexOf(l.tipo)<0||!isFinite(val)||val<=0||
       typeof l.data!=="string"||!RE_DATA.test(l.data)){out.perdidos++;return}
    var n={id:l.id,tipo:l.tipo,valor:val,desc:typeof l.desc==="string"?l.desc:"",
      contaId:id(l.contaId)?l.contaId:null,destinoId:id(l.destinoId)?l.destinoId:null,
      catId:id(l.catId)?l.catId:null,data:l.data};
    if(Array.isArray(l.parcelas)&&l.parcelas.length){
      var ps=l.parcelas.filter(function(q){return ehObj(q)&&typeof q.data==="string"&&RE_DATA.test(q.data)&&isFinite(cent(q.valor))})
        .map(function(q){return {data:q.data,valor:cent(q.valor)}});
      if(ps.length===l.parcelas.length)n.parcelas=ps;
    }
    if(l.tipo==="ajuste"){if(l.sinal!=="alta"&&l.sinal!=="baixa"){out.perdidos++;return} n.sinal=l.sinal}
    if(id(l.caixaId))n.caixaId=l.caixaId;
    if(id(l.fixaId))n.fixaId=l.fixaId;
    if(typeof l.rend==="string"&&/^\d{4}-\d{2}$/.test(l.rend))n.rend=l.rend;
    if(id(l.rendCx))n.rendCx=l.rendCx;
    if(typeof l.ref==="string"&&/^\d{4}-\d{2}$/.test(l.ref))n.ref=l.ref;
    out.lancamentos.push(n);
  });
  (Array.isArray(p.fixas)?p.fixas:[]).forEach(function(x){
    var v=ehObj(x)?cent(x.valor):NaN, dia=ehObj(x)?parseInt(x.dia,10):NaN;
    if(!ehObj(x)||!id(x.id)||typeof x.nome!=="string"||!(v>0)||!(dia>=1&&dia<=31)||!id(x.contaId)||!id(x.catId)||
       typeof x.inicio!=="string"||!RE_DATA.test(x.inicio)){out.perdidos++;return}
    var n={id:x.id,nome:x.nome,valor:v,dia:dia,freq:x.freq==="anual"?"anual":"mensal",mes:Math.min(11,Math.max(0,parseInt(x.mes,10)||0)),
      contaId:x.contaId,catId:x.catId,inicio:x.inicio,puladas:Array.isArray(x.puladas)?x.puladas.filter(function(r){return typeof r==="string"&&/^\d{4}-\d{2}$/.test(r)}):[]};
    if(parseInt(x.vezes,10)>0)n.vezes=parseInt(x.vezes,10);
    out.fixas.push(n);
  });
  (Array.isArray(p.caixas)?p.caixas:[]).forEach(function(x){
    if(!ehObj(x)||!id(x.id)||typeof x.nome!=="string"){out.perdidos++;return}
    var n={id:x.id,nome:x.nome,alvo:Math.max(0,cent(x.alvo)||0)};
    if(typeof x.prazo==="string"&&RE_DATA.test(x.prazo))n.prazo=x.prazo;
    var ctx=Number(x.taxa); if(isFinite(ctx)&&ctx>0)n.taxa=Math.min(100,Math.round(ctx*100)/100);
    if(typeof x.ate==="string"&&RE_DATA.test(x.ate))n.ate=x.ate;
    out.caixas.push(n);
  });
  (Array.isArray(p.reservas)?p.reservas:[]).forEach(function(x){
    var v=ehObj(x)?cent(x.valor):NaN;
    if(!ehObj(x)||!id(x.id)||!(v>0)||typeof x.data!=="string"||!RE_DATA.test(x.data)||!(x.de==="livre"||id(x.de))||!(x.para==="livre"||id(x.para))){out.perdidos++;return}
    var rv={id:x.id,data:x.data,de:x.de,para:x.para,valor:v}; if(id(x.conta))rv.conta=x.conta; if(typeof x.rend==="string"&&/^\d{4}-\d{2}$/.test(x.rend))rv.rend=x.rend;
    out.reservas.push(rv);
  });
  return out;
}
function higienizarConfig(c){
  var d=S.config;
  if(!ehObj(c))return d;
  return {
    tamanho:["m","g","gg"].indexOf(c.tamanho)>=0?c.tamanho:"m",
    tema:["auto","claro","escuro"].indexOf(c.tema)>=0?c.tema:"auto",
    contador:c.contador===true,
    ultimoBackup:typeof c.ultimoBackup==="string"&&RE_DATA.test(c.ultimoBackup)?c.ultimoBackup:null,
    pronto:c.pronto===true,
    movimento:c.movimento==="parado"?"parado":"vivo",
    renda:Math.max(0,Math.round(Number(c.renda))||0),
    sobraRef:typeof c.sobraRef==="string"&&/^\d{4}-\d{2}$/.test(c.sobraRef)?c.sobraRef:null,
    favoritas:Array.isArray(c.favoritas)?c.favoritas.filter(function(x){return typeof x==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(x)}).slice(0,3):[],
    favCats:Array.isArray(c.favCats)?c.favCats.filter(function(x){return typeof x==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(x)}).slice(0,20):[]
  };
}

function carregar(){
  var raw=lsGet(KEY);
  if(!raw)return;
  try{
    var p=JSON.parse(raw);
    if(!ehObj(p))throw new Error("formato");
    CARTEIRA_NOVA=false; INV_NOVA=false;
    var h=higienizar(p);
    S.contas=h.contas;S.categorias=h.categorias;S.lancamentos=h.lancamentos;S.fixas=h.fixas;S.caixas=h.caixas;S.reservas=h.reservas;
    S.config=higienizarConfig(p.config);
    if(INV_NOVA){
      INV_NOVA=false; if(S.config.pronto)salvar();
      setTimeout(function(){toast("Novidade: sua Poupança agora fica na aba Investir. Informe a taxa ao ano para ela render no app.")},1500);
    }
    if(S.config.pronto&&atualizarRendimentos())salvar();
    if(CARTEIRA_NOVA){
      CARTEIRA_NOVA=false; if(S.config.pronto)salvar();
      setTimeout(function(){toast("Novidade: criei a conta Dinheiro, para o dinheiro que você leva na carteira.")},900);
    }
    if(h.perdidos){
      lsSet(KEY+":corrompido",raw);
      setTimeout(function(){toast(h.perdidos+" item(ns) com problema foram ignorados. Guardei uma cópia do original.")},400);
    }
  }catch(e){
    lsSet(KEY+":corrompido",raw);   /* nunca sobrescreve dados ilegíveis sem guardar o original */
    setTimeout(function(){toast("Seus dados estavam ilegíveis. Guardei uma cópia e comecei do zero.")},400);
  }
}
function salvar(){
  if(!lsSet(KEY,JSON.stringify(S)))toast("Não consegui salvar neste navegador");
}

function conta(id){for(var i=0;i<S.contas.length;i++)if(S.contas[i].id===id)return S.contas[i];return null}
function cat(id){for(var i=0;i<S.categorias.length;i++)if(S.categorias[i].id===id)return S.categorias[i];return null}
function nomeConta(id){var c=conta(id);return c?c.nome:"(conta apagada)"}
function nomeCat(id){if(id==="__valoriza")return "Valorização de bens"; if(id==="__desvaloriza")return "Desvalorização de bens"; var c=cat(id);return c?c.nome:"Sem categoria"}

/* ---------- vocabulário: comum x contador ---------- */
var VOC={
  simples:{pl:"É meu de verdade",ativo:"O que eu tenho",passivo:"O que eu devo",entrou:"Entrou",saiu:"Saiu",sobrou:"Sobrou",
           resultado:"Resultado do mês",evo:"Para onde o que é meu está indo"},
  contador:{pl:"Patrimônio líquido",ativo:"Ativo",passivo:"Passivo",entrou:"Receitas",saiu:"Despesas",sobrou:"Resultado",
           resultado:"DRE do mês",evo:"Evolução e projeção do patrimônio líquido"}
};
function v(k){return VOC[S.config.contador?"contador":"simples"][k]}

/* =====================================================================
   MOTOR DE PARTIDA DOBRADA
   Toda moeda tem duas faces: de onde saiu e para onde foi.
   gasto        : D categoria (despesa) / C conta que pagou
   ganho        : D conta que recebeu  / C categoria (receita)
   mudar lugar  : D conta destino      / C conta de origem
   Ativo cresce a débito; passivo cresce a crédito. PL = ativo − passivo.
   ===================================================================== */
function partidas(l){
  if(l.tipo==="saida")return [{k:"cat",id:l.catId,lado:"D"},{k:"conta",id:l.contaId,lado:"C"}];
  if(l.tipo==="entrada")return [{k:"conta",id:l.contaId,lado:"D"},{k:"cat",id:l.catId,lado:"C"}];
  if(l.tipo==="ajuste")return l.sinal==="alta"
    ?[{k:"conta",id:l.contaId,lado:"D"},{k:"cat",id:"__valoriza",lado:"C"}]
    :[{k:"cat",id:"__desvaloriza",lado:"D"},{k:"conta",id:l.contaId,lado:"C"}];
  return [{k:"conta",id:l.destinoId,lado:"D"},{k:"conta",id:l.contaId,lado:"C"}];
}
function saldoConta(c,ate){
  var s=c.inicial||0;
  S.lancamentos.forEach(function(l){
    if(ate&&l.data>ate)return;
    var d=0;
    if(l.tipo==="saida"&&l.contaId===c.id)d=-l.valor;
    else if(l.tipo==="entrada"&&l.contaId===c.id)d=l.valor;
    else if(l.tipo==="ajuste"&&l.contaId===c.id)d=l.sinal==="alta"?l.valor:-l.valor;
    else if(l.tipo==="transferencia"||l.tipo==="bem"){
      if(l.destinoId===c.id)d=l.valor; else if(l.contaId===c.id)d=-l.valor;
    }
    s+= c.tipo==="ativo"? d : -d;   /* no passivo, pagar reduz a dívida */
  });
  return s;
}
function totais(ate){
  var a=0,p=0;
  S.contas.forEach(function(c){var s=saldoConta(c,ate); if(c.tipo==="ativo")a+=s; else p+=s});
  return {ativo:a,passivo:p,pl:a-p};
}
function resumoMes(ym){
  var r={ent:0,sai:0,aj:0,porEnt:{},porSai:{},lanc:[]};
  S.lancamentos.forEach(function(l){
    if(l.data.slice(0,7)!==ym)return;
    r.lanc.push(l);
    if(l.tipo==="entrada"){r.ent+=l.valor;r.porEnt[l.catId]=(r.porEnt[l.catId]||0)+l.valor}
    else if(l.tipo==="saida"){r.sai+=l.valor;r.porSai[l.catId]=(r.porSai[l.catId]||0)+l.valor}
    else if(l.tipo==="ajuste")r.aj+=(l.sinal==="alta"?l.valor:-l.valor);   /* bens mudando de valor: não é dinheiro entrando ou saindo */
  });
  r.lanc.sort(ordemRecente);
  return r;
}
function ordemRecente(a,b){return a.data<b.data?1:a.data>b.data?-1:(a.id<b.id?1:-1)}

/* o que ainda falta pagar numa conta de dívida (cartão, empréstimo...).
   Pagamentos (mudar de lugar para a dívida) quitam os itens mais antigos primeiro. */
function itensDevidos(c){
  if(c.pessoa){var sp=saldoConta(c); return sp>0?[{data:c.cobrar||null,valor:sp,desc:"Dívida com "+c.nome,n:1,de:1}]:[]}
  var it=[];
  if(c.abertas&&c.abertas.length)
    c.abertas.forEach(function(a){it.push({data:a.data,valor:a.valor,desc:"Dívida de antes de usar o app",n:1,de:1})});
  else if(c.inicial>0)it.push({data:null,valor:c.inicial,desc:"Dívida de antes de usar o app",n:1,de:1});
  S.lancamentos.forEach(function(l){
    if((l.tipo!=="saida"&&l.tipo!=="bem")||l.contaId!==c.id)return;
    var base=l.desc||(l.tipo==="bem"?nomeConta(l.destinoId):nomeCat(l.catId));
    if(l.parcelas&&l.parcelas.length)
      l.parcelas.forEach(function(p,i){it.push({data:p.data,valor:p.valor,desc:base,n:i+1,de:l.parcelas.length})});
    else it.push({data:l.data,valor:l.valor,desc:base,n:1,de:1});
  });
  it.sort(function(a,b){return (a.data||"")<(b.data||"")?-1:(a.data||"")>(b.data||"")?1:0});
  var pago=0;
  S.lancamentos.forEach(function(l){
    if(l.tipo==="transferencia"){ if(l.destinoId===c.id)pago+=l.valor; if(l.contaId===c.id)pago-=l.valor }
    else if(l.tipo==="entrada"&&l.contaId===c.id)pago+=l.valor;   /* estorno */
  });
  var out=[];
  it.forEach(function(x){
    if(pago>=x.valor){pago-=x.valor;return}
    out.push({data:x.data,valor:x.valor-pago,desc:x.desc,n:x.n,de:x.de}); pago=0;
  });
  return out;
}
/* contas a pagar: itens em aberto agrupados por conta e data de vencimento */
function aPagar(){
  var out=[];
  S.contas.filter(function(c){return c.tipo==="passivo"}).forEach(function(c){
    var g={};
    itensDevidos(c).forEach(function(x){
      var k=x.data||"sem";
      if(!g[k])g[k]={conta:c,data:x.data,valor:0,itens:[]};
      g[k].valor+=x.valor; g[k].itens.push(x);
    });
    Object.keys(g).forEach(function(k){out.push(g[k])});
  });
  return out.sort(function(a,b){return (a.data||"")<(b.data||"")?-1:(a.data||"")>(b.data||"")?1:0});
}

/* ---------- datas, caixinhas, pessoas, contas fixas, agenda ---------- */
function ymMais(ym,n){return addMes(ym+"-01",n).slice(0,7)}
function cmpData(a,b){var x=a.data||"0000",y=b.data||"0000";return x<y?-1:x>y?1:0}
function caixa(id){for(var i=0;i<S.caixas.length;i++)if(S.caixas[i].id===id)return S.caixas[i];return null}
function nomeCaixa(id){var c=caixa(id);return c?c.nome:"(caixinha apagada)"}
/* caixinha = dinheiro SEPARADO dentro do que já é seu (reserva no patrimônio). Não mexe no banco. */
function saldoCaixa(id){
  var s=0;
  S.reservas.forEach(function(r){if(r.para===id)s+=r.valor; if(r.de===id)s-=r.valor});
  S.lancamentos.forEach(function(l){if(l.tipo==="saida"&&l.caixaId===id)s-=l.valor});
  return s;
}
function totalReservado(){return S.caixas.reduce(function(s,c){return s+saldoCaixa(c.id)},0)}
/* em qual conta está guardado o dinheiro de cada caixinha. Guardar escolhe a conta; usar o dinheiro
   libera primeiro o da conta escolhida; um gasto pago com a caixinha libera primeiro o da conta que pagou. */
function contasDinheiro(){return S.contas.filter(function(c){return c.tipo==="ativo"&&!c.pessoa&&!c.bem&&!c.inv})}
function bucketsCaixa(id){
  var b={}, ev=[], pad0=(contasDinheiro()[0]||{}).id;
  S.reservas.forEach(function(r,i){if(r.para===id||r.de===id)ev.push({data:r.data,i:i,r:r})});
  S.lancamentos.forEach(function(l,i){if(l.tipo==="saida"&&l.caixaId===id)ev.push({data:l.data,i:100000+i,l:l})});
  ev.sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:a.i-b.i});
  function tira(valor,pref){
    var resto=valor, t;
    if(pref&&b[pref]>0){t=Math.min(b[pref],resto);b[pref]-=t;resto-=t}
    Object.keys(b).sort(function(x,y){return b[y]-b[x]}).forEach(function(k){if(resto>0&&b[k]>0){t=Math.min(b[k],resto);b[k]-=t;resto-=t}});
  }
  ev.forEach(function(e){
    if(e.r){var c=e.r.conta||pad0; if(e.r.para===id&&e.r.de!==id)b[c]=(b[c]||0)+e.r.valor; else if(e.r.de===id)tira(e.r.valor,c)}
    else tira(e.l.valor,e.l.contaId);
  });
  return b;
}
function guardadoConta(cid){return S.caixas.reduce(function(s,x){return s+(bucketsCaixa(x.id)[cid]||0)},0)}
function livreConta(c){return saldoConta(c)-guardadoConta(c.id)}
function melhorConta(){return contasDinheiro().slice().sort(function(a,b){return livreConta(b)-livreConta(a)})[0]||null}
function bensLista(){return S.contas.filter(function(c){return c.bem})}
function bensTotal(){return bensLista().reduce(function(s,c){return s+saldoConta(c)},0)}
/* Caixinhas são organização pessoal sobre o dinheiro que EXISTE nas contas (carteira, banco, poupança).
   Dívidas, bens e dinheiro que te devem não entram; as caixinhas não mexem na contabilidade. */
function dinheiroEmConta(){
  return S.contas.reduce(function(s,c){return (c.tipo==="ativo"&&!c.pessoa&&!c.bem&&!c.inv)?s+saldoConta(c):s},0);
}
function livreAgora(){return dinheiroEmConta()-totalReservado()}
function metasMes(){return S.categorias.filter(function(k){return k.tipo==="despesa"&&k.meta>0})}
function sobraMesPassado(){
  var ym=ymMais(hojeISO().slice(0,7),-1);
  if(S.config.sobraRef===ym)return null;
  var r=resumoMes(ym); if(!r.lanc.length)return null;
  var soma=0; metasMes().forEach(function(k){soma+=Math.max(0,k.meta-(r.porSai[k.id]||0))});
  if(soma<=0)return null;
  return {ym:ym,valor:soma,mes:MES[+ym.slice(5)-1]};
}
function pessoasLista(){return S.contas.filter(function(c){return c.pessoa})}
function contasNormais(){return S.contas.filter(function(c){return !c.pessoa&&!c.bem})}
function aReceber(){
  return pessoasLista().filter(function(c){return c.tipo==="ativo"&&saldoConta(c)>0}).map(function(c){return {conta:c,data:c.cobrar||null,valor:saldoConta(c)}}).sort(cmpData);
}
function fixaPaga(f,ref){
  if((f.puladas||[]).indexOf(ref)>=0)return true;
  return S.lancamentos.some(function(l){return l.fixaId===f.id&&l.ref===ref});
}
function ocorrencias(f,deYM,ateYM){
  var out=[], idx=0, ym=f.inicio.slice(0,7), guarda=0;
  while(ym<=ateYM&&guarda++<800){
    if(f.freq!=="anual"||(+ym.slice(5)-1)===f.mes){
      var p=ym.split("-").map(Number), data=ym+"-"+pad(Math.min(f.dia,ultimoDia(p[0],p[1]-1)));
      if(data>=f.inicio){idx++; if(f.vezes&&idx>f.vezes)break; if(ym>=deYM)out.push({ref:ym,data:data,n:idx})}
    }
    ym=ymMais(ym,1);
  }
  return out;
}
function fixasPendentes(){
  var h=hojeISO().slice(0,7), out=[];
  S.fixas.forEach(function(f){
    ocorrencias(f,ymMais(h,-2),ymMais(h,1)).forEach(function(o){
      if(!fixaPaga(f,o.ref))out.push({fixa:f,ref:o.ref,data:o.data,valor:f.valor});
    });
  });
  return out.sort(cmpData);
}
/* agenda única: dívidas, contas fixas e dinheiro que vão te pagar */
function agenda(){
  var out=[];
  aPagar().forEach(function(g){out.push({k:"divida",data:g.data,valor:g.valor,titulo:g.conta.nome,g:g})});
  fixasPendentes().forEach(function(x){out.push({k:"fixa",data:x.data,valor:x.valor,titulo:x.fixa.nome,x:x})});
  aReceber().forEach(function(r){if(r.data)out.push({k:"receber",data:r.data,valor:r.valor,titulo:r.conta.nome,r:r})});
  return out.filter(function(a){return !a.data||diasAte(a.data)<=35}).sort(cmpData);
}
function quandoTxt(data,verbo){
  if(!data)return "sem data";
  var d=diasAte(data);
  return d<0?(verbo==="cobrar"?"atrasado há ":"atrasada há ")+(-d)+(d===-1?" dia":" dias"):d===0?"hoje":d===1?"amanhã":"em "+d+" dias";
}
function quandoFrase(data,rec){
  if(!data)return "sem data de vencimento";
  return diasAte(data)<0?quandoTxt(data,rec?"cobrar":""):(rec?"cobrar ":"vence ")+quandoTxt(data,rec?"cobrar":"");
}
/* tudo o que vence num mês: o que ainda falta pagar e o que já foi pago.
   No mês de hoje entram também as contas atrasadas e as sem data. */
function pagarNoMes(ym){
  var hoje=hojeISO().slice(0,7), ini=ym+"-01", falta=[], pago=[];
  aPagar().forEach(function(g){
    var dentro=!!g.data&&g.data.slice(0,7)===ym, resto=ym===hoje&&(!g.data||g.data<ini);
    if(dentro||resto)falta.push({k:"divida",data:g.data,valor:g.valor,titulo:g.conta.nome,atrasada:!!g.data&&g.data<hojeISO(),cid:g.conta.id});
  });
  S.fixas.forEach(function(fx){
    ocorrencias(fx,ym===hoje?ymMais(ym,-2):ym,ym).forEach(function(o){
      if(fixaPaga(fx,o.ref))return;
      if(o.ref===ym||(ym===hoje&&o.ref<ym))falta.push({k:"fixa",data:o.data,valor:fx.valor,titulo:fx.nome,atrasada:o.ref<ym||(!!o.data&&o.data<hojeISO()),fid:fx.id,ref:o.ref});
    });
  });
  S.lancamentos.forEach(function(l){
    if(l.data.slice(0,7)!==ym)return;
    var dv=l.tipo==="transferencia"?conta(l.destinoId):null, c=conta(l.contaId), k=l.catId?cat(l.catId):null;
    if(dv&&dv.tipo==="passivo")pago.push({data:l.data,valor:l.valor,titulo:"Pagamento: "+dv.nome});
    else if(l.tipo==="saida"&&l.fixaId&&c&&c.tipo==="ativo")pago.push({data:l.data,valor:l.valor,titulo:l.desc||"Conta fixa"});
    else if(l.tipo==="saida"&&k&&k.nome==="Juros e multas")pago.push({data:l.data,valor:l.valor,titulo:l.desc||"Juros e multas"});
  });
  falta.sort(cmpData); pago.sort(cmpData);
  var soma=function(a){return a.reduce(function(s,x){return s+x.valor},0)};
  return {falta:falta,pago:pago,tf:soma(falta),tp:soma(pago)};
}
var PAG_OFF=0, AC_ABERTO=false;
function cartaoPagar(ym,o){
  o=o||{};
  var p=pagarNoMes(ym), hoje=hojeISO().slice(0,7), mes=MES[+ym.slice(5)-1], tot=p.tf+p.tp, atual=ym<=hoje;
  var nav=o.setas?'<div class="mesnav"><button data-a="pagMes" data-n="-1" aria-label="Mês anterior"'+(o.off<=-2?" disabled":"")+'>‹</button><b>'+mes+(ym.slice(0,4)!==hoje.slice(0,4)?" de "+ym.slice(0,4):"")+'</b><button data-a="pagMes" data-n="1" aria-label="Próximo mês"'+(o.off>=11?" disabled":"")+'>›</button></div>':'';
  if(!p.falta.length&&!p.pago.length)return '<div class="card pagar">'+nav+'<div class="rot2">Contas de '+mes+'</div><div class="gr zero">Nada para pagar</div></div>';
  var tit=ym===hoje?"Falta pagar em "+mes:ym>hoje?"Vai vencer em "+mes:"Ficou em aberto em "+mes;
  var pc=tot?Math.round(p.tp/tot*100):0, aberto=!!o.aberto&&o.lista!==false;
  function linhaAc(x,pago){
    var dt=x.data?dataBR(x.data).slice(0,5):"sem data";
    var info=pago||!x.data?dt:x.atrasada?'<em>'+esc(quandoTxt(x.data))+'</em> · '+dt:esc('vence '+quandoTxt(x.data))+' · '+dt;
    var bt=(pago||!atual)?'':x.k==="divida"?'<button class="btn peq" data-a="pagar" data-id="'+esc(x.cid)+'" data-valor="'+x.valor+'">Pagar</button>':'<button class="btn peq" data-a="fxPagar" data-id="'+esc(x.fid)+'" data-ref="'+esc(x.ref)+'" data-data="'+esc(x.data)+'">Paguei</button>';
    return '<div class="ac-row k-'+esc(x.k||"divida")+'"><div class="ac-t"><b>'+esc(x.titulo)+'</b><span>'+info+'</span></div><div class="ac-v">'+esc(brl(x.valor))+'</div>'+(bt?'<div class="ac-b">'+bt+'</div>':'')+'</div>';
  }
  var h='<div class="card pagar">'+nav+'<div class="rot2">'+esc(tit)+'</div><div class="gr'+(p.tf===0?" zero":"")+'">'+esc(brl(p.tf))+'</div>';
  if(p.tp>0)h+='<div class="barra2" role="img" aria-label="'+pc+'% já pago"><div style="width:'+pc+'%;background:var(--latao)"></div></div><p class="faint">Já pagou <b>'+esc(brl(p.tp))+'</b> de <b>'+esc(brl(tot))+'</b> neste mês</p>';
  if(o.lista!==false&&p.falta.length){
    if(aberto)h+='<div class="ac-lista" id="acLista">'+p.falta.map(function(x){return linhaAc(x,false)}).join("")+'</div>'+(!atual?'<p class="faint" style="margin-top:.4rem">Ainda não venceu: o botão de pagar aparece quando o mês chegar.</p>':'');
    else{
      h+=p.falta.slice(0,o.max||3).map(function(x){
        var dt=x.data?dataBR(x.data).slice(0,5):"sem data";
        return '<div class="it k-'+esc(x.k)+'"><span>'+esc(x.titulo)+' <span class="faint">'+dt+'</span>'+(x.atrasada?' <em>atrasada</em>':'')+'</span><b>'+esc(brl(x.valor))+'</b></div>';
      }).join("");
      if(p.falta.length>(o.max||3))h+='<p class="faint">e mais '+(p.falta.length-(o.max||3))+' conta(s)</p>';
    }
    if(o.acerto)h+='<button class="btn peq" data-a="acToggle" aria-haspopup="dialog" aria-expanded="'+AC_ABERTO+'">Abrir o acerto de contas ('+p.falta.length+')</button>';
  }
  if(aberto&&p.pago.length)h+='<p class="rot2" style="margin-top:.9rem">Já pago neste mês</p><div class="ac-lista ac-pagas">'+p.pago.map(function(x){return linhaAc(x,true)}).join("")+'</div>';
  if(o.botao)h+='<button class="link" data-a="ir" data-v="planejar">Ver a agenda e pagar</button>';
  return h+'</div>';
}
function cartaoPagarInicio(){return cartaoPagar(ymMais(hojeISO().slice(0,7),PAG_OFF),{max:3,setas:true,off:PAG_OFF,acerto:true})}
/* acerto de contas: janela preta e dourada que sobe por cima da tela */
var AC_VOLTA=false;
function abrirAcerto(){

function linhaFalta(){

  return '<button class="atalho linha-falta" data-a="ir" data-v="planejar"><div><b>Falta pagar em '+mes+': '+esc(brl(p.tf))+'</b><span>'+(p.falta.length?p.falta.length+' conta'+(p.falta.length>1?'s':'')+' · toque para ver e pagar':'Nada para pagar este mês')+'</span></div><i>›</i></button>';
}
function rendaMedia(){
  if(S.config.renda>0)return S.config.renda;
  var ym=hojeISO().slice(0,7), soma=0, n=0, i;
  for(i=0;i<3;i++){var r=resumoMes(ymMais(ym,-i)); if(r.ent>0){soma+=r.ent;n++}}
  return n?Math.round(soma/n):0;
}
/* quanto está comprometido em cada um dos próximos n meses (dívidas em aberto + contas fixas) */
function comprometidoMeses(n){
  var base=hojeISO().slice(0,7), out=[], i;
  for(i=0;i<n;i++)out.push({ym:ymMais(base,i),div:0,fix:0});
  function idx(data){
    if(!data)return 0;
    var ym=data.slice(0,7), k;
    for(k=0;k<n;k++)if(out[k].ym===ym)return k;
    return ym<base?0:-1;
  }
  aPagar().forEach(function(g){var k=idx(g.data); if(k>=0)out[k].div+=g.valor});
  S.fixas.forEach(function(f){
    ocorrencias(f,base,out[n-1].ym).forEach(function(o){
      if(fixaPaga(f,o.ref))return;
      var k=idx(o.data); if(k>=0)out[k].fix+=f.valor;
    });
  });
  return out;
}
function taxaMensal(valor,parc,n){
  if(n<2||parc*n<=valor)return 0;
  var lo=0.00001, hi=1, i, r, pv;
  for(i=0;i<70;i++){r=(lo+hi)/2; pv=parc*(1-Math.pow(1+r,-n))/r; if(pv>valor)lo=r; else hi=r}
  return (lo+hi)/2;
}

var VIEW="inicio", REF=new Date(); REF.setDate(1);
var ABA={anotacoes:"mais",relatorio:"relatorios",ajustes:"mais",caixinhas:"planejar",metas:"planejar",fixas:"planejar",simulador:"planejar"};

function ir(vw){
  if(vw==="investir"&&atualizarRendimentos())salvar();
  setTimeout(function(){pergReage(vw)},0);
  if(vw==="anotacoes"&&VIEW!=="anotacoes"){AN_VOLTA=(VIEW==="mais"||VIEW==="relatorios")?VIEW:"inicio";AN.q="";AN.n=15}
  VIEW=vw;
  if(AC_ABERTO)fecharAcerto();
  if(vw==="planejar"){PAG_OFF=0;AG_TODAS=false;AC_ABERTO=false}
  $("#tela").classList.remove("vira-d","vira-e");
  document.querySelectorAll("nav button[data-v]").forEach(function(b){
    if(b.dataset.v===(ABA[vw]||vw))b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  var cur=document.querySelector('nav button[aria-current="page"]'); if(cur){cur.classList.remove("pop");void cur.offsetWidth;cur.classList.add("pop")}

function fmtRoll(k,c){
  if(k==="pl")return brl(c);
  if(k==="ent")return "+"+num(c);
  if(k==="sai")return "−"+num(c);
  return (c<0?"−":"")+num(c);
}
function rolarNum(el,k,de,para){
  if(!window.requestAnimationFrame){el.textContent=fmtRoll(k,para);return}
  el.textContent=fmtRoll(k,de);
  var t0=null;
  function p(t){
    if(!t0)t0=t;
    var x=Math.min(1,(t-t0)/800), e=1-Math.pow(1-x,3);
    el.textContent=fmtRoll(k,Math.round(de+(para-de)*e));
    if(x<1&&el.isConnected)requestAnimationFrame(p);
  }
  requestAnimationFrame(p);
}
function animarInicio(){
  document.querySelectorAll("[data-roll]").forEach(function(el){
    var k=el.dataset.k, para=+el.dataset.roll, de=ULT[k]==null?0:ULT[k];
    ULT[k]=para;
    if(calmo()||de===para)return;
    rolarNum(el,k,de,para);
  });
  if(WOB){
    WOB=false; var b=$("#bal");
    if(b&&!calmo()){b.classList.remove("wob");void b.getBoundingClientRect();b.classList.add("wob");setTimeout(function(){b.classList.remove("wob")},2500)}
  }
}

function buscaPerg(txt){
  var pal=norm(txt).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(function(w){return w.length>=3&&["que","para","com","uma","como","meu","minha","meus","minhas","tem","tenho","isso","esta","este","nos","das","dos"].indexOf(w)<0});
  if(!pal.length)return [];
  return PERGS.map(function(p,i){
    var alvo=" "+norm(p.q+" "+p.kw).replace(/[^a-z0-9 ]/g," ")+" ", pts=0;
    pal.forEach(function(w){if(alvo.indexOf(" "+w+" ")>=0)pts+=2; else if(alvo.indexOf(" "+w.slice(0,4))>=0)pts+=1});
    return {i:i,pts:pts};
  }).filter(function(x){return x.pts>0}).sort(function(a,b){return b.pts-a.pts||a.i-b.i}).slice(0,3).map(function(x){return x.i});
}
function listaPergs(idx,titulo){
  return (titulo?'<p class="ch-tit">'+esc(titulo)+'</p>':'')+idx.map(function(i){return '<button class="ch-q" data-a="chPerg" data-i="'+i+'">'+esc(PERGS[i].q)+'</button>'}).join("");
}
function grupoIdx(g){var o=[];PERGS.forEach(function(p,i){if(p.g===g)o.push(i)});return o}
function pintarGrupos(){
  $("#chGrupos").innerHTML=GRUPOS.map(function(x){return '<button class="chip" data-a="chGrupo" data-g="'+x[0]+'" aria-pressed="'+(CH.g===x[0])+'">'+esc(x[1])+'</button>'}).join("");
  $("#chLista").innerHTML=listaPergs(grupoIdx(CH.g));
}

}

var AN={q:"",ordem:"data",dir:"desc",tipo:"todos",periodo:"mes",conta:"",cat:"",n:15,aberto:false}, AN_VOLTA="inicio";
function semAcento(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

  return l.desc||(l.tipo==="bem"?"Comprei "+nomeConta(l.destinoId):l.tipo==="ajuste"?"Ajuste de valor":l.tipo==="transferencia"?"Transferência":nomeCat(l.catId));

function anotacoesFiltradas(modo,ym){
  var q=semAcento(AN.q.trim()), hoje=hojeISO().slice(0,7), ini=null, fim=null;
  if(modo!=="mes"){
    if(AN.periodo==="mes"){ini=hoje+"-01";fim=hoje+"-31"}
    else if(AN.periodo==="passado"){var pm=ymMais(hoje,-1);ini=pm+"-01";fim=pm+"-31"}
    else if(AN.periodo==="3m"){ini=ymMais(hoje,-2)+"-01";fim=hoje+"-31"}
    else if(AN.periodo==="ano"){ini=hoje.slice(0,4)+"-01-01";fim=hoje.slice(0,4)+"-12-31"}
  }
  var tiposOk={todos:null,saida:["saida"],entrada:["entrada"],transferencia:["transferencia"],bens:["bem","ajuste"]}[AN.tipo];
  var r=S.lancamentos.filter(function(l){
    if(modo==="mes"&&l.data.slice(0,7)!==ym)return false;
    if(ini&&(l.data<ini||l.data>fim))return false;
    if(tiposOk&&tiposOk.indexOf(l.tipo)<0)return false;
    if(AN.conta&&l.contaId!==AN.conta&&l.destinoId!==AN.conta)return false;
    if(AN.cat&&l.catId!==AN.cat)return false;
    if(q&&textoBusca(l).indexOf(q)<0)return false;
    return true;
  });
  var m=AN.dir==="asc"?1:-1;
  r.sort(function(a,b){

    else if(AN.ordem==="nome")c=tituloLanc(a).localeCompare(tituloLanc(b),"pt-BR",{sensitivity:"base"});
    else c=a.data<b.data?-1:a.data>b.data?1:0;
    if(c===0)c=a.data<b.data?-1:a.data>b.data?1:(a.id<b.id?-1:1);

  });

}

var TIPOS=[["saida","Gastei","−","gasto"],["entrada","Recebi","+","ganho"],["transferencia","Transferi","⇄","transf"],["bem","Comprei um bem","⌂","bem"]];
var NOME_TIPO={saida:"Gastei",entrada:"Recebi",transferencia:"Transferi entre contas",bem:"Comprei um bem"};
function fabMenu(abrir){
  var m=$("#fabMenu"); if(!m)return;
  var on=abrir===undefined?!m.classList.contains("on"):abrir, dock=!!(FOLHA_ABERTA&&F);
  m.classList.toggle("on",on); m.classList.toggle("emfolha",dock); m.setAttribute("aria-hidden",String(!on));
  var f=document.querySelector(".fab"); if(f){f.setAttribute("aria-expanded",String(on&&!dock));f.classList.toggle("aberto",on&&!dock)}
  var dk=$("#dockTipo"); if(dk){dk.setAttribute("aria-expanded",String(on&&dock));dk.classList.toggle("aberto",on&&dock)}
  atualizarDock();
  document.querySelectorAll("#fabMenu .fb").forEach(function(b){var at=on&&dock&&F.tipo===b.dataset.t; b.classList.toggle("atual",at); b.setAttribute("aria-disabled",String(at)); b.tabIndex=on&&!at?0:-1});
